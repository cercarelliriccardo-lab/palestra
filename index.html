var tab = "oggi";
var TABS = ["oggi", "pesi", "corsa", "cibo", "dati"];
/* Da dove entra la prossima vista. Lo scrive chi cambia scheda o passo, e
   render() lo consuma una volta sola: se restasse, ogni ridisegno (una spunta,
   un numero) farebbe scivolare tutto di lato senza motivo. */
var verso = 0;

/* Quale vista era a schermo l'ultima volta. Cambiare scheda o passo e' un
   ARRIVO: si riparte dall'alto e le schede entrano. Ridisegnare la stessa
   vista non lo e': la pagina deve restare esattamente dov'era. */
var vistaPrec = null;

function render(){
  /* Prima di ogni altra cosa: i bersagli vengono dal profilo e dal peso piu
     recente, quindi non puo esistere uno stato in cui il peso e cambiato e
     le calorie no. */
  ricalcola();
  /* TRAPPOLA NUMERO DUE. render() finisce con animaOn/animaOff sulla figura
     trovata in #view: a immersiva aperta congelerebbe l omino. E capita
     davvero, perche gpsVia() chiama render() dal suo callback d errore. */
  if(imm.on){ syncWake(); return; }
  var yPrima = window.scrollY || window.pageYOffset || 0;
  /* La sezione della scheda Cibo entra nell'identita della vista: passare fra
     diario e spesa e' un ARRIVO, non un ridisegno — deve partire dall'alto. */
  var vista = ses.on ? "ses:" + ses.i : "tab:" + tab + (tab === "cibo" ? ":" + sezCibo : "");
  var stessaVista = vista === vistaPrec;
  vistaPrec = vista;
  var w = weekNow();
  document.getElementById("wkLabel").textContent = S.start
    ? (w > 4 ? "settimana " + w + " · oltre scheda" : "settimana " + w + " di 4")
    : "non avviato";
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
    if(b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  var cur = document.querySelector("#tabs .cursore");
  if(cur) cur.style.setProperty("--i", String(Math.max(0, TABS.indexOf(tab))));
  var v = document.getElementById("view");
  v.style.setProperty("--dx", verso ? (verso > 0 ? "22px" : "-22px") : "0px");
  verso = 0;
  /* Prima di riscrivere, non dopo: se la classe arrivasse a elementi gia' nel
     documento l'animazione sarebbe gia' partita per un fotogramma. */
  v.classList.toggle("zitto", stessaVista);
  if(ses.on){
    v.innerHTML = vSessione();
    var s = ses.steps[ses.i];
    /* "avvic" mancava: la serie di avvicinamento mostrava un riquadro vuoto.
       Il movimento serve proprio lì, perché è il primo che vedi. */
    var fig = s.t === "intro" || s.t === "serie" || s.t === "avvic" ? s.ex.id : s.t === "stre" ? s.st.id : null;
    if(fig) animaOn(fig); else animaOff();
  } else {
    v.innerHTML = ({ oggi:vOggi, pesi:vPesi, corsa:vCorsa, cibo:vCibo, dati:vDati })[tab]();
    /* Qualunque vista puo mostrare una figura: basta un contenitore data-fig. */
    var wf = v.querySelector("[data-fig]");
    if(wf) animaOn(wf.dataset.fig); else animaOff();
  }
  /* Il cronometro sopravvive al ridisegno: l'innerHTML ha staccato il bottone
     a cui scriveva, quindi va riagganciato al suo gemello nuovo. Se la riga
     non c'e' piu — hai cambiato scheda o variante — si chiude senza scrivere
     niente, invece di continuare a contare per un nodo morto. */
  if(tenuta.on){
    var bt = document.querySelector('.set[data-ex="' + tenuta.ex + '"][data-i="' + tenuta.i + '"] .crono');
    if(bt){ tenuta.el = bt; tenuta.ultimo = -1; bt.setAttribute("data-on", "1"); }
    else tenutaFerma(true);
  }
  syncWake();
  if(stessaVista){
    /* Si torna esattamente dove si era. Prima la pagina saltava in cima a ogni
       spunta: in mezzo a una seduta era il difetto piu fastidioso dell'app. */
    window.scrollTo(0, yPrima);
    fermaIngresso();
    animaConta(null, true);   /* i numeri si scrivono, non risalgono da zero */
  } else {
    window.scrollTo(0, 0);
    /* Dopo lo scrollTo, non prima: la misura di cosa sta sotto la piega va
       fatta a pagina gia riportata in cima, altrimenti e la misura di ieri. */
    scorrimentoIngresso();
    animaConta();
  }
}

function bannerStorage(){
  var pre = schemaFuturo ? '<div class="note alert"><strong>Questi dati vengono da una versione piu recente dell\'app.</strong> Questa versione potrebbe non leggerli tutti: aggiornala prima di scriverci sopra, oppure esporta subito come backup.</div>' : "";
  if(storageOK) return pre;
  return pre + '<div class="note alert"><strong>I dati non si salvano su questo browser.</strong> Probabilmente è attiva la navigazione privata o il blocco dei dati dei siti. Quello che scrivi resta finché non chiudi la pagina: esporta prima di uscire.</div>';
}

   ============================================================
   La vecchia coppia di pose per esercizio resta in POSE e serve ancora agli
   stretching. Corsa, cammino e i sette esercizi coi pesi passano di qui.

   Perche: interpolando le COORDINATE le ossa cambiano lunghezza a meta
   strada e il ginocchio attraversa il corpo in linea retta invece di fare
   un arco. Qui le ossa hanno lunghezza costante per costruzione:
     - la falcata interpola gli ANGOLI e li trasforma in punti;
     - i pesi dicono dove stanno bacino, piedi e mani, e il gomito lo trova
       un solutore a due ossa.
   In piu sono quattro arti, non due: gli esercizi bilaterali lo sembrano.

   Regole anatomiche, quelle che si sbagliano per prime:
     - il ginocchio flette SOLO indietro (angolo sottratto all'anca, mai < 0);
     - il gomito flette SOLO avanti (angolo sommato alla spalla);
     - in corsa la spalla resta dietro al tronco: avanti va solo l'avambraccio.

function nuova(id){ return !!CICLO[id] || !!PESI[id]; }
function xy(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); }
function daAngolo(x, y, gradi, len){
  var r = gradi * Math.PI / 180;
  return [x + Math.sin(r) * len, y + Math.cos(r) * len];
}

/* Chiavi cicliche col coseno: continua in valore e in derivata, e il ciclo
   si richiude sulla prima chiave. E un giro, non un pendolo. */
function chiave(keys, p){
  p = p - Math.floor(p);
  for(var i = 0; i < keys.length; i++){
    var a = keys[i], b = keys[(i + 1) % keys.length];
    var p0 = a[0], p1 = b[0]; if(p1 <= p0) p1 += 1;
    var q = p; if(q < p0) q += 1;
    if(q >= p0 && q <= p1){
      var u = (1 - Math.cos(Math.PI * (q - p0) / (p1 - p0))) / 2;
      return [a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
    }
  }
  return [keys[0][1], keys[0][2]];
}

/* Due ossa, un bersaglio. Se il bersaglio e piu lontano della somma delle
   ossa lo tira dentro, invece di spezzare l'arto per arrivarci. */
function ik(a, b, l1, l2, dir){
  var dx = b[0] - a[0], dy = b[1] - a[1], d = Math.sqrt(dx * dx + dy * dy) || 0.01;
  var max = l1 + l2 - 0.6;
  if(d > max){ var s = max / d; dx *= s; dy *= s; d = max; b = [a[0] + dx, a[1] + dy]; }
  var ang = Math.atan2(dy, dx);
  var c = (d * d + l1 * l1 - l2 * l2) / (2 * d * l1);
  c = Math.max(-1, Math.min(1, c));
  var off = Math.acos(c) * dir;
  return [[a[0] + Math.cos(ang + off) * l1, a[1] + Math.sin(ang + off) * l1], b];
}

function falcata(id, p){
  var c = CICLO[id], ancaX = 100;
  var ancaY = c.ancaY - c.bob * Math.cos(4 * Math.PI * (p - 0.13));
  var lr = c.inclina * Math.PI / 180;
  var sp = [ancaX + Math.sin(lr) * OSSO.tronco, ancaY - Math.cos(lr) * OSSO.tronco];
  var te = [sp[0] + Math.sin(lr) * OSSO.collo, sp[1] - Math.cos(lr) * OSSO.collo];
  function gamba(q){
    var k = chiave(c.gamba, q);
    var gin = daAngolo(ancaX, ancaY, k[0], OSSO.coscia);
    return [[ancaX, ancaY], gin, daAngolo(gin[0], gin[1], k[0] - k[1], OSSO.stinco)];
  }
  function braccio(q){
    var k = chiave(c.braccio, q);
    var gom = daAngolo(sp[0], sp[1], k[0], OSSO.braccio);
    return [sp, gom, daAngolo(gom[0], gom[1], k[0] + k[1], OSSO.avambr)];
  }
  var gV = gamba(p), gL = gamba(p + 0.5), bV = braccio(p + 0.5), bL = braccio(p);
  /* Nessuna caviglia sotto il pavimento: si alza tutto di quanto serve.
     In volo non corregge niente, quindi l'oscillazione resta intatta. */
  var basso = Math.max(gV[2][1], gL[2][1]), dy = basso > SUOLO_Y ? basso - SUOLO_Y : 0;
  if(dy){
    [gV, gL, bV, bL].forEach(function(l){ l.forEach(function(q){ q[1] -= dy; }); });
    ancaY -= dy; sp = [sp[0], sp[1] - dy]; te = [te[0], te[1] - dy];
  }
  return { anca:[ancaX, ancaY], sp:sp, te:te, gamba:gV, gambaF:gL,
           braccio:bV, braccioF:bL, mani:bV[2], maniF:bL[2] };
}

function ossa(id, u){
  var E = PESI[id], A = E.a, B = E.b;
  var anca = [A.anca[0] + (B.anca[0] - A.anca[0]) * u, A.anca[1] + (B.anca[1] - A.anca[1]) * u];
  var lean = A.lean + (B.lean - A.lean) * u;
  var mani = [A.mani[0] + (B.mani[0] - A.mani[0]) * u, A.mani[1] + (B.mani[1] - A.mani[1]) * u];
  var lr = lean * Math.PI / 180;
  var sp = [anca[0] + Math.sin(lr) * OSSO.tronco, anca[1] - Math.cos(lr) * OSSO.tronco];
  var te = [sp[0] + Math.sin(lr) * OSSO.collo, sp[1] - Math.cos(lr) * OSSO.collo];
  var maniF = [mani[0] - 9, Math.min(mani[1] + 3, SUOLO_Y)];
  var G1 = ik(anca, A.piedi[0], OSSO.coscia, OSSO.stinco, -1);
  var G2 = ik(anca, A.piedi[1], OSSO.coscia, OSSO.stinco, -1);
  var B1 = ik(sp, mani, OSSO.braccio, OSSO.avambr, E.gomito);
  var B2 = ik(sp, maniF, OSSO.braccio, OSSO.avambr, E.gomito);
  return { anca:anca, sp:sp, te:te, mani:B1[1], maniF:B2[1],
    gamba:[anca, G1[0], G1[1]], gambaF:[anca, G2[0], G2[1]],
    braccio:[sp, B1[0], B1[1]], braccioF:[sp, B2[0], B2[1]] };
}

/* La pila si alza davvero: e l'unico modo di far vedere il carico senza
   scrivere un numero che l'app non conosce. Accesi solo i dischi scelti. */
function pila(x, yB, su){
  var s = '<rect class="telaio" x="' + (x + 13) + '" y="' + (yB - 86) + '" width="4" height="92" rx="2"></rect>';
  for(var i = 0; i < 8; i++){
    var y = yB - i * 10, mv = i >= 4 ? su * 24 : 0;
    s += '<rect class="' + (i >= 4 ? "vivo" : "telaio") + '" x="' + x + '" y="' + (y - mv).toFixed(1) +
      '" width="30" height="8" rx="2"></rect>';
  }
  return s;
}

/* Discesa lenta, breve fermata, risalita rapida: e il profilo di un
   sollevamento, non un'onda simmetrica. */
function tempoLift(t){
  if(t < 0.44) return (1 - Math.cos(Math.PI * (t / 0.44))) / 2;
  if(t < 0.54) return 1;
  if(t < 0.82) return 1 - (1 - Math.cos(Math.PI * ((t - 0.54) / 0.28))) / 2;
  return 0;
}

/* ---------- la figura ---------- */
function lerp(a, b, u){ return a + (b - a) * u; }
function poseAt(id, u){
  var p = POSE[id]; if(!p) return null;
  return p.a.map(function(pt, i){
    return [lerp(pt[0], p.b[i][0], u), lerp(pt[1], p.b[i][1], u)];
  });
}
/* Riquadro stretto attorno alla figura: nel riquadro piccolo della schermata
   Oggi un viewBox da 200x200 lascia la figura grande un dito e illeggibile.
   Il ritaglio si calcola dalle due pose, cosi vale per qualsiasi esercizio. */
function riquadro(id){
  var P = POSE[id].a.concat(POSE[id].b);
  var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  P.forEach(function(p){
    if(p[0] < x0) x0 = p[0]; if(p[0] > x1) x1 = p[0];
    if(p[1] < y0) y0 = p[1]; if(p[1] > y1) y1 = p[1];
  });
  var m = 22, w = x1 - x0 + m * 2, hh = y1 - y0 + m * 2, l = Math.max(w, hh);

/* Interpolazione in JS invece che con animazioni CSS: identica su ogni browser,
   si ferma di colpo quando l'utente apre un campo, e si spegne del tutto con
   prefers-reduced-motion (WCAG 2.3.3) mostrando la posa finale ferma. */
var anim = { raf:0, id:null, ferma:false };
var pocoMoto = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function animaOn(id){
  animaOff();
  anim.id = id;
  if(!POSE[id] && !nuova(id)) return;
  var gait = !!CICLO[id], pesi = !!PESI[id];
  /* Posa ferma leggibile: meta volo per la corsa, meta discesa per un peso. */
  var fermo = gait ? 0.7 : pesi ? 0.55 : 1;
  if(pocoMoto){ disegna(id, fermo); return; }
  /* Un fotogramma subito: a pagina nascosta rAF non parte e il riquadro
     resterebbe vuoto invece che con la figura ferma. */
  disegna(id, fermo);
  var dur = gait ? CICLO[id].durata : pesi ? 4200 : 3000;
  var t0 = performance.now(), ultimo = 0;
  (function ciclo(now){
    if(anim.id !== id) return;

       niente di visibile e si consuma batteria col wake lock acceso.
       Resta rAF e non setInterval: si sospende da solo a pagina nascosta. */
    if(!anim.ferma && now - ultimo >= 40){
      ultimo = now;
      var t = ((now - t0) % dur) / dur;
      disegna(id, gait ? t : pesi ? tempoLift(t) : (1 - Math.cos(2 * Math.PI * t)) / 2);
    }
    anim.raf = requestAnimationFrame(ciclo);
  })(t0);
}
function animaOff(){ if(anim.raf) cancelAnimationFrame(anim.raf); anim.raf = 0; anim.id = null; }

/* Conferma di un gesto: pulsazione sull'elemento toccato piu un anello che
   si espande e muore. Non e decorazione — in sala pesi si tocca senza
   guardare, e la vibrazione da sola non basta col telefono su una panca.
   Si spegne con prefers-reduced-motion come tutto il resto (WCAG 2.3.3). */
function festaSpunta(el){
  if(!el || pocoMoto) return;

  var r = el.getBoundingClientRect(), d = Math.max(r.width, r.height);

  a.className = "anello";

  a.style.left = (r.left + r.width / 2 - d / 2) + "px";
  a.style.top = (r.top + r.height / 2 - d / 2) + "px";
  document.body.appendChild(a);
  setTimeout(function(){ a.remove(); }, 640);
}

/* Numeri che salgono da zero. Stessa curva e stessa durata di valore
   (comune.js: 1300 ms, 1-(1-t)^3, parte veloce e rallenta alla fine). */
function contaSu(el, subito){
  var target = parseFloat(el.dataset.target);
  if(isNaN(target)) return;
  /* Il peso corporeo e 51,5 e non 52: senza decimali la tessera piu importante
     salirebbe fino a un numero che non e quello scritto nei dati. */
  var dec = parseInt(el.dataset.dec || "0", 10);
  var ritardo = parseInt(el.dataset.ritardo || "0", 10);
  function scrivi(v){ el.textContent = v.toFixed(dec).replace(".", ","); }
  /* Se la pagina non e visibile rAF non parte e il numero resterebbe a zero
     per sempre: in quel caso si scrive e basta. Stesso per chi vuole meno moto. */
  /* "subito" e' il ridisegno della stessa vista: far risalire i numeri da zero
     dopo ogni spunta li rende illeggibili proprio mentre li stai guardando. */
  if(subito || pocoMoto || document.visibilityState !== "visible"){ scrivi(target); return; }
  /* Parte quando la sua tessera ha finito di entrare: se salgono tutti insieme
     mentre le tessere scorrono, lo schermo diventa illeggibile per un secondo. */
  setTimeout(function(){
    var t0 = performance.now();
    (function passo(ora){
      var t = Math.min((ora - t0) / 1300, 1);
      scrivi(target * (1 - Math.pow(1 - t, 3)));
      if(t < 1) requestAnimationFrame(passo); else scrivi(target);
    })(t0);
  }, ritardo);
}
function animaConta(radice, subito){
  var dove = radice || document;
  Array.prototype.forEach.call(dove.querySelectorAll(".conta"), function(el){
    /* Se la sua scheda non e ancora entrata, il numero sale quando entra lei:
       altrimenti scorri fin li e lo trovi gia arrivato. */
    if(!radice && !subito && el.closest(".attesa")) return;
    contaSu(el, subito);
  });
}

/* ------------------------------------------------------------------
   Ingresso legato allo scorrimento
   ------------------------------------------------------------------
   Prima ogni scheda partiva al momento del render: quelle in fondo alla
   pagina finivano di entrare mentre stavi ancora leggendo la prima, e
   scorrendo trovavi solo roba ferma. Ora chi nasce sotto la piega aspetta,
   e parte quando lo sguardo ci arriva davvero.
   Chi e gia visibile non viene toccato: conserva lo scaglionamento in
   cascata, che li ha senso perche le vedi tutte insieme.
   ------------------------------------------------------------------ */
var dormienti = [], spazzataInCoda = 0;
function liberaScheda(el){
  el.classList.remove("attesa");
  el.classList.add("arriva");
  animaConta(el);
}
/* La regola e "il viewport ci e arrivato o ci e passato sopra", non "ci sta
   dentro adesso". Un elemento superato da uno scorrimento veloce non tornera
   mai a incrociare il bordo scendendo: se la condizione fosse l'incrocio,
   resterebbe invisibile per sempre. Qui basta che il suo bordo alto sia
   entrato nella finestra, anche molto prima e anche solo per un istante. */
function spazza(){
  spazzataInCoda = 0;
  if(!dormienti.length) return;
  var alte = window.innerHeight, restano = [];
  dormienti.forEach(function(el){
    if(el.getBoundingClientRect().top < alte) liberaScheda(el); else restano.push(el);
  });
  dormienti = restano;
  if(!dormienti.length) staccaSpazzata();
}
function chiediSpazzata(){
  if(spazzataInCoda) return;
  spazzataInCoda = requestAnimationFrame(spazza);
}
function staccaSpazzata(){
  window.removeEventListener("scroll", chiediSpazzata);
  window.removeEventListener("resize", chiediSpazzata);
}
/* Svuota la lista di chi aspetta e stacca gli ascoltatori, senza riarmare
   niente. Serve in due casi: prima di ricalcolare, e sui ridisegni della
   stessa vista — dove gli elementi in attesa sono stati staccati dal
   documento con l'innerHTML e lasciarli in lista farebbe girare la spazzata
   a vuoto su nodi che non esistono piu. */
function fermaIngresso(){
  dormienti.forEach(function(el){ el.classList.remove("attesa"); });
  dormienti = [];
  staccaSpazzata();
}
function scorrimentoIngresso(){
  /* Ogni render riparte da zero: le vecchie in attesa appartengono a una
     vista che non esiste piu, e lasciarle nell'elenco le terrebbe nascoste. */
  fermaIngresso();
  if(pocoMoto) return;
  var alte = window.innerHeight;
  Array.prototype.forEach.call(
    document.querySelectorAll("#view .card, #view .tile, #view .ex, #view .gauge"),
    function(el){
      /* La soglia e 96 px sotto il bordo: cio che spunta appena e gia in vista,
         e farlo aspettare darebbe l'impressione di un buco nella pagina. */
      if(el.getBoundingClientRect().top > alte - 96){ el.classList.add("attesa"); dormienti.push(el); }
    });
  if(!dormienti.length) return;
  window.addEventListener("scroll", chiediSpazzata, { passive:true });
  window.addEventListener("resize", chiediSpazzata);
  /* Rete di sicurezza: se dopo dieci secondi qualcosa e ancora in attesa,
     vuol dire che nessuno scorrimento e mai arrivato fin li. Meglio una
     scheda che compare senza cerimonia che una scheda che non compare. */
  setTimeout(function(){
    if(!dormienti.length) return;
    dormienti.forEach(liberaScheda);
    dormienti = [];
    staccaSpazzata();
  }, 10000);
}

var ses = { on:false, i:0, steps:[], kind:"pesi", avanzato:false };

function buildSteps(kind){
  var out = [];
  if(kind === "stretch"){
    streOggi().forEach(function(st){ out.push({ t:"stre", st:st }); });
    out.push({ t:"sfine" });
    return out;
  }
  var dOggi = oggiISO();
  /* L'ordine e' quello di oggi, non quello della scheda: se hai rimandato la
     chest press perche' era occupata, il percorso deve rispecchiarlo. */
  var lista = exOggi(dOggi);

     registra e non conta nel volume: vedi vincoli.md §1-quater per come
     va raccontata — l'evidenza è più debole di quanto si dica in palestra. */
  out.push({ t:"avvic", ex:lista[0] });
  lista.forEach(function(ex, xi){
    out.push({ t:"intro", ex:ex });
    /* per esercizio, non globale: se ne hai aggiunta una al goblet il percorso
       la contiene, e gli altri restano come sono */
    var n = nSerie(dOggi, ex.id);
    for(var si = 0; si < n; si++){
      out.push({ t:"serie", ex:ex, si:si });
      if(si < n - 1) out.push({ t:"riposo", ex:ex, sec:ex.rest, dopo:"Serie " + (si+2) + " · " + ex.n });
      /* Riposo anche fra un esercizio e l'altro: la scheda prescrive 90-120
         secondi anche lì, e saltarlo sarebbe cambiare un parametro. */
      else if(xi < lista.length - 1) out.push({ t:"riposo", ex:ex, sec:100, dopo:lista[xi+1].n });
    }

/* Penultima seduta di quell'esercizio: serve al confronto del riepilogo. */
function lastSessionPrima(exId, d){
  var keys = Object.keys(S.sessions).filter(function(k){ return k < d; }).sort();
  for(var i = keys.length - 1; i >= 0; i--){
    var arr = S.sessions[keys[i]][exId];
    if(arr && arr.some(function(x){ return x.done; })) return { d:keys[i], sets:arr.filter(function(x){ return x.done; }) };
  }
  return null;
}

/* Promemoria veri: un file di calendario da importare nel telefono.
   Una pagina web non può mandare notifiche su iPhone — il Calendario sì. */
function pad2(n){ return String(n).padStart(2, "0"); }
function icsEsc(s){ return String(s).replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n"); }
/* Lo standard iCalendar vuole righe non oltre 75 ottetti, spezzate con una
   riga di continuazione che inizia con uno spazio. Si conta in byte UTF-8,
   non in caratteri: accenti, · e — ne occupano piu di uno. */
function bLen(ch){ var c = ch.charCodeAt(0); return c < 0x80 ? 1 : c < 0x800 ? 2 : 3; }
function piega(l){
  var res = [], cur = "", n = 0;
  for(var i = 0; i < l.length; i++){
    var b = bLen(l[i]);
    if(n + b > 74){ res.push(cur); cur = " "; n = 1; }
    cur += l[i]; n += b;
  }
  res.push(cur);
  return res.join("\r\n");
}
function generaICS(ora){
  var hh = (ora || "07:30").split(":");
  var L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//palestra//scheda settimane 1-4//IT", "CALSCALE:GREGORIAN"];
  for(var k = 0; k < 28; k++){
    var dt = giornoDelProgramma(k), iso2 = iso(dt), sett = Math.floor(k / 7) + 1;
    var tipo = PIANO[dt.getDay()], cfg = RUN_WEEKS[Math.min(3, sett - 1)];
    var tit, des;
    if(tipo === "pesi"){
      tit = "Pesi — full body";
      des = (sett === 1 ? 2 : 3) + " serie per esercizio, 7 esercizi. " +
        "Ogni serie finisce con 1-3 ripetizioni ancora in canna, mai a cedimento. " +
        "Riposo 90 secondi, 2 minuti su goblet squat e stacco rumeno.";
    } else if(tipo === "corsa"){
      tit = "Corsa — " + cfg.label;
      des = "5 minuti di camminata veloce prima, 5 di camminata lenta dopo. " +
        "Ritmo facile: quello in cui riesci a dire una frase intera.";
    } else {
      tit = "Riposo — solo stretching";
      des = "Riposo o camminata. Lo stretching si fa lo stesso: 10 minuti, mai a freddo.";
    }
    /* Lunedì e giovedì: pesata. Conta la media settimanale, non il singolo giorno. */
    var dow = dt.getDay();
    if(dow === 1 || dow === 4){ tit = "Pesati · " + tit; des = "PRIMA DI TUTTO: pesati appena sveglio, prima di mangiare. " + des; }
    var stamp = iso2.replace(/-/g, "") + "T" + pad2(+hh[0]) + pad2(+hh[1]) + "00";
    L.push("BEGIN:VEVENT",
      "UID:palestra-" + iso2 + "@locale",
      "DTSTAMP:" + iso2.replace(/-/g, "") + "T000000Z",
      "DTSTART:" + stamp,
      "DURATION:PT15M",
      "SUMMARY:" + icsEsc("Settimana " + sett + " · " + tit),
      "DESCRIPTION:" + icsEsc(des),
      "BEGIN:VALARM", "TRIGGER:PT0S", "ACTION:DISPLAY",
      "DESCRIPTION:" + icsEsc(tit), "END:VALARM",
      "END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return L.map(piega).join("\r\n") + "\r\n";
}
function scaricaICS(){
  var ora = (document.getElementById("icsOra") || {}).value || "07:30";
  var testo = generaICS(ora), nome = "palestra-settimane-1-4.ics";

function tileIco(k){ return '<span class="ico"><svg viewBox="0 0 16 16">' + (ICONE[k] || "") + '</svg></span>'; }

/* Sparkline: solo la forma, niente assi. Tufte — sta accanto al numero e il
   trend si "vede" senza leggerlo (regola 4 del design di valore). */
function spark(vals, col){
  if(!vals || vals.length < 2) return '<div class="spark"></div>';
  var W = 100, H = 32, min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if(max - min < 0.0001){ min -= 1; max += 1; }
  var n = vals.length - 1;
  var pt = vals.map(function(v, i){
    return [ (i / n) * W, 3 + (1 - (v - min) / (max - min)) * (H - 8) ];
  });
  var d = pt.map(function(p, i){ return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
  var u = pt[pt.length - 1];
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="' + d + ' L' + W + ' ' + H + ' L0 ' + H + ' Z" fill="' + col + '" opacity=".12"/>' +
    '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2" vector-effect="non-scaling-stroke"' +
      ' stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"' +
      ' style="animation:traccia .9s cubic-bezier(.3,.7,.3,1) forwards"/>' +
    '<circle cx="' + u[0].toFixed(1) + '" cy="' + u[1].toFixed(1) + '" r="2.6" fill="' + col + '"' +
      ' vector-effect="non-scaling-stroke" style="animation:appari .3s .8s ease both"/></svg>';
}
/* Sette barrette: i giorni della settimana. */
function barrette(v){
  return '<svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true">' +
    v.map(function(on, i){
      var w = 100 / v.length, x = i * w + 1.5;
      return '<rect x="' + x.toFixed(1) + '" y="' + (on ? 4 : 18) + '" width="' + (w - 3).toFixed(1) + '" height="' + (on ? 28 : 14) + '" rx="2" ' +
        'fill="' + (on ? "var(--ok)" : "var(--surface-3)") + '" style="animation:appari .3s ' + (0.1 + i * 0.05).toFixed(2) + 's ease both"/>';
    }).join("") + '</svg>';
}
function tile(ic, lab, val, unita, grafico, piede, pill, pillTipo){
  return '<div class="tile"><div class="th">' + tileIco(ic) + '<span class="tl">' + esc(lab) + '</span></div>' +
    '<div class="tv">' + val + (unita ? '<small>' + esc(unita) + '</small>' : "") + '</div>' +
    (grafico || "") +
    '<div class="tf">' + (pill ? '<span class="pill-sm ' + (pillTipo || "") + '">' + esc(pill) + '</span>' : "") +
    '<span>' + esc(piede) + '</span></div></div>';
}

  if(exportScaduto()){
    var gg = giorniDaExport();
    h += '<div class="note warn"><strong>' + (gg === null ? "Non hai mai fatto un backup." : "Ultimo backup " + gg + " giorni fa.") + '</strong> ' +
      'I numeri stanno solo dentro questo telefono, e nessuno li copia al posto tuo. ' +
      '<button class="btn sm" data-act="go" data-to="dati" style="margin-top:8px">Esporta adesso</button></div>';
  }

  /* peso di partenza mancante */
  if(!S.weights.length){
    h += '<div class="note warn"><strong>Manca ancora il peso di partenza.</strong> È il dato che manca da quattro sessioni di lavoro sul progetto: senza, il ciclo di controllo sulle calorie non può partire. Pesati appena sveglio, prima di mangiare. <button class="btn sm" data-act="go" data-to="dati" style="margin-top:8px">Registra il peso</button></div>';
  }

  /* Quattro tessere: i numeri del progetto a colpo d'occhio, senza paragrafi. */
  var sd = stretchDay(d);
  var fattiStr = streFatti(d);
  var ft = foodTot(d);
  var ws = S.weights.slice().sort(function(a,b){ return a.d < b.d ? -1 : 1; });
  var fs = S.ftf.slice().sort(function(a,b){ return a.d < b.d ? -1 : 1; });
  var lun = mondayOf(now), sett = [];
  for(var k = 0; k < 7; k++){ var dd = new Date(lun); dd.setDate(lun.getDate() + k); sett.push(stretchDone(iso(dd))); }
  var xs = sett.filter(Boolean).length;

  h += '<div class="grid2">';

  h += tile("peso", "Peso",
    ws.length ? '<span class="conta" data-dec="1" data-ritardo="60" data-target="' + ws[ws.length-1].kg + '">0,0</span>' : "—", ws.length ? "kg" : "",
    spark(ws.slice(-8).map(function(x){ return x.kg; }), "var(--accent)"),
    ws.length ? "obiettivo " + PESO_META : "da registrare",
    ws.length ? (ws.length >= 2 ? (ws[ws.length-1].kg - ws[0].kg >= 0 ? "+" : "") + (Math.round((ws[ws.length-1].kg - ws[0].kg) * 10) / 10).toString().replace(".", ",") + " kg" : "1 dato") : "manca",
    ws.length >= 2 ? "ok" : "warn");

  h += tile("mob", "Dita-terra",
    fs.length ? '<span class="conta" data-ritardo="120" data-target="' + fs[fs.length-1].cm + '">0</span>' : "—", fs.length ? "cm" : "",
    spark(fs.slice(-8).map(function(x){ return x.cm; }), "var(--accent)"),
    "obiettivo " + FTF_META + " cm",
    fs.length >= 2 ? (fs[fs.length-1].cm - fs[0].cm) + " cm" : null, "ok");

  h += tile("stre", "Stretching", fattiStr + "/" + streOggi().length, "oggi",
    barrette(sett), xs + " giorni su 7",
    xs >= 5 ? "in linea" : "obiettivo 5", xs >= 5 ? "ok" : "warn");

  h += tile("cibo", "Calorie", '<span class="conta" data-ritardo="240" data-target="' + Math.round(ft.k) + '">0</span>', "kcal",
    spark([0, ft.k * 0.35, ft.k * 0.7, ft.k], ft.k >= targetKcal(d) ? "var(--ok)" : "var(--warn)"),
    Math.round(ft.p) + " g proteine",
    ft.k >= targetKcal(d) ? "in linea" : "mancano " + Math.max(0, Math.round(targetKcal(d) - ft.k)),
    ft.k >= targetKcal(d) ? "ok" : "warn");

  h += '</div>';

  h += '<div class="card"><div class="riga"><div style="flex:1">' +
    '<div class="eyebrow">Stretching di oggi</div>' +
    '<div class="pallini">' + streOggi().map(function(x){
      return '<i data-on="' + (sd.items[x.id] ? 1 : 0) + '"></i>';
    }).join("") + '<span class="num">' + fattiStr + '/' + streOggi().length + '</span></div>' +
    (tipo === "pesi" ? '<p class="fine">Dopo i pesi, non prima.</p>' : "") +
    '</div><button class="btn" data-act="sesStart" data-kind="stretch">Vai</button></div>' +
    vSceltaStre() + '</div>';

  h += '<div class="card riga"><div style="flex:1">' +
    '<div class="eyebrow">Cibo</div>' +
    gauge(ft.k, targetKcal(d) + 500, targetKcal(d), targetKcal(d) + 100, "kcal", etichettaKcal(d)) +
    gauge(ft.p, PROT_MAX + 40, PROT_MIN, PROT_MAX, "g proteine", PROT_MIN + "-" + PROT_MAX) +
    '</div><button class="btn" data-act="go" data-to="cibo">Aggiungi</button></div>';

  /* le due cose che restano da fare una volta sola */
  var pesato = S.weights.length > 0;
  if(!(pesato && S.setup.fermi && S.setup.attrezzi)){
    h += '<div class="card"><div class="eyebrow">Una volta sola</div><div class="checklist">' +
      '<div class="check" data-on="' + (pesato ? 1 : 0) + '"><span class="box">✓</span><span class="lbl">Pesarsi appena sveglio</span></div>' +
      '<button type="button" class="check" data-act="setup" data-id="fermi" data-on="' + (S.setup.fermi ? 1 : 0) + '"><span class="box">✓</span><span class="lbl">Collaudare i fermi del rack<span class="sub">Bilanciere scarico, lasciati cadere sopra apposta</span></span></button>' +
      '<button type="button" class="check" data-act="setup" data-id="attrezzi" data-on="' + (S.setup.attrezzi ? 1 : 0) + '"><span class="box">✓</span><span class="lbl">Identificare i due attacchi<span class="sub">Rullo sotto i polpacci = leg curl · sopra le caviglie = leg extension</span></span></button>' +
      '</div></div>';
  }

  if(w > 4){
    h += '<div class="note warn"><strong>La scheda copre le settimane 1-4.</strong> Da qui in poi ripete la quarta.</div>';
  }
  return h;
}

function gauge(val, scala, min, max, unita, goal){
  var pct = Math.min(100, (val / scala) * 100);
  var z1 = (min / scala) * 100, z2 = (max / scala) * 100;
  var stato = val < min ? "sotto" : val > max ? "sopra" : "dentro";
  return '<div class="gauge">' +
    '<span class="lab"><b class="conta num" data-target="' + Math.round(val) + '">0</b> ' + esc(unita) +
    '<span class="goal">obiettivo ' + esc(goal) + '</span></span>' +
    '<div class="bar"><span class="fill" data-s="' + stato + '" style="width:' + pct.toFixed(1) + '%"></span>' +
    '<span class="zone" style="left:' + z1.toFixed(1) + '%;width:' + (z2-z1).toFixed(1) + '%"></span></div>' +
    '<div class="ticks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>' +
    '</div>';
}

/* ---------- PESI ---------- */
/* Il programma non avviato chiudeva Pesi e Corsa con una riga di testo che
   rimandava a un'altra scheda. Effetto reale, scoperto il 07/08 leggendo i
   dati veri: ric ha fatto due allenamenti, ha aperto l'app per registrarli e
   ha trovato un vicolo cieco — le sedute non erano perse, erano
   NON REGISTRABILI. La funzione principale non si chiude dietro un passaggio
   altrove: il tasto per sbloccarla sta qui, dove sei. */
function avvioMancante(cosa){
  return '<div class="card"><div class="eyebrow">Prima di cominciare</div>' +
    '<h2>Il programma non è ancora avviato</h2>' +
    '<p class="fine">Serve un lunedì di riferimento: da lì l\'app conta le settimane, sceglie il blocco della corsa e passa da 2 a 3 serie. Finché manca, ' + cosa + ' non si può registrare.</p>' +
    '<div class="row"><input type="date" id="startD3" value="' + iso(mondayOf(new Date())) + '" style="flex:1"></div>' +
    '<div class="row"><button class="btn primary wide" data-act="setStart3">Comincio da questa settimana</button></div>' +
    '<p class="fine">Se hai già cominciato prima, cambia la data: metti il lunedì della settimana in cui hai fatto il primo allenamento.</p>' +
    '</div>';
}

/* ---------- cambiare la variante di uno slot ---------- */
var cambioAperto = null;   /* id dello slot col pannello aperto */

function ultimoCarico(exId){
  var l = lastSession(exId, "9999-99-99");
  if(!l || !l.sets || !l.sets.length || l.sets[0].kg == null) return null;
  var e = exDi(exId);
  return String(l.sets[0].kg).replace(".", ",") + (e && e.secs ? " sec" : " kg");
}

function vCambiaEx(d, sid, ex){
  var s = slotDi(sid); if(!s) return "";
  var h = '<div class="cambia">';

  if(!variantiAperte()){
    /* Divieto spiegato, non muto: la ragione e' tecnica e vale la pena saperla. */
    h += '<p class="fine">Le varianti si aprono dalla <strong>settimana 5</strong>. Adesso il guadagno è nervoso — il cervello impara il movimento ripetendolo — e cambiare esercizio ogni volta fa ricominciare l\'apprendimento da capo.</p>';
    if(sid === "acc")
      h += '<p class="fine">Unica eccezione: il passaggio al <strong>bilanciere</strong> non dipende dalla settimana ma dal criterio tecnico — 3×10 di goblet a piena profondità con tecnica pulita.</p>';
    return h + '</div>';
  }

  var prop = treVolteDiFila(sid);
  if(prop && cambioAperto !== sid){
    var pn = (exDi(prop) || {}).n || prop;
    h += '<div class="note"><strong>Tre sedute di fila con ' + esc(pn) + '.</strong> Lo rendo il predefinito di questo slot?' +
      '<div class="row"><button class="btn sm" data-act="defSi" data-sid="' + sid + '" data-id="' + prop + '">Sì</button>' +
      '<button class="btn sm ghost" data-act="defNo" data-sid="' + sid + '" data-id="' + prop + '">No, lascia così</button></div></div>';
  }

  h += '<button class="btn sm ghost wide" data-act="cambiaEx" data-sid="' + sid + '">' +
    (cambioAperto === sid ? "Chiudi" : "Cambia esercizio") + '</button>';
  if(cambioAperto !== sid) return h + '</div>';

  h += '<p class="fine">Slot <strong>' + esc(s.n) + '</strong> — ' + esc(s.mus) + '. Una sostituzione alla volta, e tienila almeno 3-4 settimane prima di giudicarla: le prime due volte sei goffo su qualsiasi movimento.</p>';

  variantiSlot(s).forEach(function(v){
    var qui = v.id === ex.id, car = ultimoCarico(v.id);
    h += '<div class="varvoce" data-on="' + (qui ? 1 : 0) + '">' +
      '<div class="vt"><strong>' + esc(v.n) + '</strong>' +
        (qui ? ' <span class="pill">in uso</span>' : '') +
        (v.agg ? ' <span class="pill up">si aggiunge</span>' : '') + '</div>' +
      '<div class="va">' + esc(v.att) + '</div>' +
      (v.k ? '<p class="fine">' + esc(v.k) + '</p>' : '') +
      /* L'avviso di sicurezza sta QUI, prima che tu scelga, non nel "come si
         fa" che si apre dopo: dopo e' tardi. */
      (v.warn ? '<div class="note alert">' + esc(v.warn) + '</div>' : '') +
      '<div class="vc">' + (car
        ? 'ultimo carico <span class="num">' + car + '</span>'
        : 'mai usato — <strong>prima seduta con carico prudente</strong>, come alla settimana 1') + '</div>' +
      (qui ? ''
           : v.agg
             ? '<button class="btn sm" data-act="extraAdd" data-id="' + v.id + '">Aggiungi in fondo alla seduta</button>'
             : '<button class="btn sm" data-act="scegliEx" data-sid="' + sid + '" data-id="' + v.id + '">Usa questo oggi</button>') +
      '</div>';
  });
  h += '<p class="fine">La scelta vale <strong>per oggi</strong>. Su un esercizio nuovo il carico riparte da zero: 40 kg di macchina e 14 kg per manubrio non sono la stessa scala, e confrontarli non vorrebbe dire niente.</p>';
  return h + '</div>';
}

function vTogliExtra(ex){
  return '<div class="cambia"><p class="fine">Aggiunto in fondo: non prende il posto di nessuno slot.</p>' +
    '<button class="btn sm ghost" data-act="extraDel" data-id="' + ex.id + '">Togli dalla seduta di oggi</button></div>';
}

var avvisoSerie = null;  /* messaggio sotto i tasti delle serie, dura un ridisegno */
function vPesi(){
  if(!S.start) return bannerStorage() + avvioMancante("una seduta di pesi");
  var d = oggiISO(), n = serieCount();
  var h = bannerStorage();
  var tipo = PIANO[new Date().getDay()];

  h += '<div class="card">' +
    '<div class="eyebrow">Seduta · settimana ' + weekNow() + '</div>' +
    '<h2>Full body — ' + n + ' serie</h2>' +
    '<p class="fine">Ogni serie finisce con <strong>1-3 ripetizioni ancora in canna</strong>, mai a cedimento. Riposo 90 secondi, 2 minuti su goblet squat e stacco rumeno: parte da solo quando spunti la serie.</p>' +
    '<p class="fine">I numeri <strong>in grigio</strong> sono quelli dell\'ultima volta, già pronti: se il peso è quello, tocca solo la spunta e non scrivere niente. Se cambi un numero diventa nero, ed è un dato tuo. Lo schermo resta acceso finché sei su questa scheda.</p>' +
    /* La seduta guidata si apre SOLO da Oggi: un ingresso solo, e sta dove
       arrivi aprendo l'app. Qui resta l'elenco lungo, che serve a un altro
       scopo — vedere tutto insieme, registrare a mano, cambiare variante. */
    '<p class="fine">La <strong>seduta guidata</strong> — una schermata alla volta, coi timer — si apre dalla scheda <strong>Oggi</strong>.</p>' +
    '<button class="btn wide" data-act="go" data-to="oggi">Vai a Oggi</button>' +
    (tipo !== "pesi" ? '<div class="note">Oggi il piano dice <strong>' + (tipo === "corsa" ? "corsa" : "riposo") + '</strong>. Puoi registrare lo stesso, ma tre sedute di pesi non consecutive sono la struttura su cui è costruito il volume settimanale.</div>' : '') +
    /* L'ordine cambiato vale solo per oggi, se non lo fissi. Detto qui perche'
       altrimenti domani lo ritrovi com'era e sembra che l'app se lo dimentichi. */
    (ordineSpostatoOggi(d)
      ? '<div class="note"><strong>Hai spostato gli esercizi.</strong> Vale solo per oggi: domani torna l\'ordine di sempre.' +
        '<div class="row"><button class="btn sm" data-act="ordineFissa">Usa sempre quest\'ordine</button>' +
        '<button class="btn sm ghost" data-act="ordineAzzera">Rimetti com\'era</button></div></div>'
      : '') +
    '</div>';

  var voci = vociOggi(d), lista = voci.map(function(v){ return v.ex; });
  voci.forEach(function(voce, i){
    var ex = voce.ex, sid = voce.sid;
    var sets = setsOf(d, ex.id);
    var last = lastSession(ex.id, d);
    var pr = proposta(ex.id, d), nEx = nSerie(d, ex.id);
    h += '<div class="ex" data-ex="' + ex.id + '">' +
      '<div class="ex-h">' +
        '<span class="idx num">' + (i+1) + '</span>' +
        '<div style="flex:1">' +
          '<h3>' + esc(ex.n) + '</h3>' +
          '<div class="meta">' + (ex.secs ? nEx + ' × 20-30 sec' : nEx + ' × 10-12') + ' · ' + esc(ex.att) +
            (S.regol[ex.id] ? ' · <span class="regp">' + esc(S.regol[ex.id]) + '</span>' : '') + '</div>' +
        '</div>' +
        '<button class="btn sm ghost" data-act="how" data-id="' + ex.id + '">Come si fa</button>' +
      '</div>';

    h += '<div class="ex-body">';
    if(last){
      h += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
      h += '<span class="pill">ultima · ' + (last.sets[0].kg != null ? last.sets[0].kg + (ex.secs ? "" : " kg") + " · " : "") +
           last.sets.map(function(s){ return s.reps || 0; }).join("/") + '</span>';
      if(pr && pr.salito){
        h += '<span class="pill up">salito a ' + (ex.secs ? pr.reps + ' secondi' : String(pr.kg).replace(".",",") + ' kg') + ' — le avevi chiuse tutte</span>';
      }
      h += '</div>';
    }
    /* corpo:1 e' a corpo libero contando RIPETIZIONI: niente colonna dei chili
       come il plank, ma la colonna a destra resta "Rip." e non "Secondi". */
    var senzaKg = ex.secs || ex.corpo;
    h += '<div class="set-head"><span>Serie</span><span>' + (senzaKg ? "—" : "Kg") + '</span><span>' + (ex.secs ? "Secondi" : "Rip.") + '</span><span></span></div>';
    sets.forEach(function(st, si){
      /* Campi vuoti = si mostra la proposta, in grigio. Diventa un dato vero
         solo quando spunti o quando modifichi: fino ad allora S resta intatto. */
      var vuota = st.kg == null && st.reps == null && !st.done;
      var prop = vuota && pr ? 1 : 0;
      var vKg = st.kg != null ? st.kg : (prop && pr.kg != null ? pr.kg : "");
      var vRp = st.reps != null ? st.reps : (prop ? pr.reps : "");
      h += '<div class="set" data-ex="' + ex.id + '" data-i="' + si + '" data-done="' + (st.done ? 1 : 0) + '" data-prop="' + prop + '">' +
        '<span class="sn">' + (si+1) + '</span>' +
        (ex.secs
          /* Cronometro della tenuta. Sta nella colonna dei chili, che per un
             esercizio a tempo era occupata solo dalla scritta "corpo": spazio
             gia' pagato. Prima i secondi andavano contati a mente e scritti a
             mano — cosa che nessuno fa mentre trema in plank. */
          ? '<button type="button" class="crono" data-act="tenuta"' +
            (st.done ? ' disabled' : '') + ' aria-label="cronometro della serie ' + (si+1) + '">' +
            (tenuta.on && tenuta.ex === ex.id && tenuta.i === si ? "0″" : "▶") + '</button>'
          : senzaKg
          ? '<span style="text-align:center;color:var(--ink-3);font-family:var(--mono);font-size:12px">corpo</span>'
          : '<div class="stepper"><button type="button" data-act="st" data-f="kg" data-dl="-' + ex.step + '">−</button>' +
            '<input type="number" inputmode="decimal" step="' + ex.step + '" data-f="kg" value="' + vKg + '" aria-label="chili serie ' + (si+1) + '">' +
            '<button type="button" data-act="st" data-f="kg" data-dl="' + ex.step + '">+</button></div>') +
        '<div class="stepper"><button type="button" data-act="st" data-f="reps" data-dl="' + (ex.secs ? -5 : -1) + '">−</button>' +
        '<input type="number" inputmode="numeric" data-f="reps" value="' + vRp + '" aria-label="ripetizioni serie ' + (si+1) + '">' +
        '<button type="button" data-act="st" data-f="reps" data-dl="' + (ex.secs ? 5 : 1) + '">+</button></div>' +
        '<button type="button" class="tick" data-act="done" aria-label="serie ' + (si+1) + ' fatta">✓</button>' +
        '</div>';
    });
    /* Aggiungere o togliere una serie: alcuni giorni ne hai una in piu nelle
       gambe, altri no. Una gia registrata non si toglie senza annullarla. */
    h += '<div class="serie-piu">' +
      '<button type="button" class="btn sm" data-act="serieMeno" data-id="' + ex.id + '">− serie</button>' +
      '<span class="num">' + nEx + '</span>' +
      '<button type="button" class="btn sm" data-act="seriePiu" data-id="' + ex.id + '">+ serie</button>' +
      /* Spostare l'esercizio. Sta qui accanto alle serie perche' e' la stessa
         famiglia di gesto: adattare la seduta di oggi a com'e' andata. */
      '<span class="ordina">' +
        '<button type="button" class="btn sm" data-act="exSu" data-id="' + esc(sid || "") + '"' +
          (i === 0 || !sid ? ' disabled' : '') + ' aria-label="sposta ' + esc(ex.n) + ' prima">↑</button>' +
        '<button type="button" class="btn sm" data-act="exGiu" data-id="' + esc(sid || "") + '"' +
          (i === lista.length - 1 || !sid ? ' disabled' : '') + ' aria-label="sposta ' + esc(ex.n) + ' dopo">↓</button>' +
      '</span>' +
      '</div>' +
      /* Il cambio di variante e il suo blocco. Sugli aggiuntivi non c'e':
         non occupano uno slot, quindi non c'e' niente da sostituire. */
      (sid ? vCambiaEx(d, sid, ex) : vTogliExtra(ex)) +
      (avvisoSerie && avvisoSerie.id === ex.id ? '<p class="fine avviso-serie">' + esc(avvisoSerie.t) + '</p>' : "");
    h += '</div>';
    h += '<div class="how" id="how-' + ex.id + '" hidden>' +
      /* Riempito dal gestore "how" al momento dell'apertura, non qui: sette
         figure nel documento significano sette #stage, e ne verrebbe animata
         sempre e solo la prima. */
      '<div class="fighow"></div>' +
      schedaAttr(ex) +
      cercaVideo(ex.id) +
      '<label class="reg"><span>Le tue regolazioni — si salvano da sole</span>' +
      '<input type="text" data-reg="' + ex.id + '" value="' + esc(S.regol[ex.id] || "") +
      '" placeholder="es. sedile foro 3 · manubri da 6 kg"></label>' +
      '</div>';
    h += '</div>';
  });

  var pz = S.pain[d] || [], al = painAlert();
  h += '<div class="card"><div class="eyebrow">Fastidi e dolori</div>' +
    '<p class="fine">Tocca la zona dove hai sentito qualcosa <em>durante</em> la seduta. Non serve a lamentarsi: serve ad accorgersi se lo stesso punto torna tre sedute di fila, che è la differenza fra indolenzimento e infortunio.</p>' +
    '<div class="zone">' + ZONE.map(function(z){
      return '<button type="button" data-act="zona" data-z="' + esc(z) + '" data-on="' + (pz.indexOf(z) >= 0 ? "1" : "0") + '">' + esc(z) + '</button>';
    }).join("") + '</div>' +
    (al.length
      ? '<div class="note alert"><strong>' + esc(al.join(", ")) + ' — stesso punto per tre sedute di fila.</strong> Questo non è indolenzimento: i DOMS sono diffusi, simmetrici e migliorano col movimento. Fermati su quel movimento e fallo vedere. Un dolore guardato subito costa molte meno settimane di uno ignorato.</div>'
      : '<p class="fine">Nessuna zona ripetuta per tre sedute.</p>') +
    '</div>';

  h += '<div class="card"><div class="eyebrow">Come si progredisce</div>' +
    '<p class="fine">Prima le ripetizioni, poi il peso: porti tutte le serie a 12 pulite, <em>solo allora</em> aggiungi carico. Coi manubri e il bilanciere si sale di 2,5 kg grazie ai dischi piccoli; sulle macchine a pila il gradino è 5 kg, che a 50 kg di peso corporeo è tanto — lì riparti da 8 ripetizioni invece che da 10. L\'app te lo propone da sola quando la seduta precedente è chiusa a 12.</p></div>';
  return h;
}

/* ---------- CORSA ---------- */
function vCorsa(){
  if(!S.start) return bannerStorage() + avvioMancante("una corsa");
  var wk = weekClamped(), cfg = RUN_WEEKS[wk-1];
  var h = bannerStorage();
  var seq = run.started ? run.seq : buildSeq(wk);
  var totale = Math.round(seq.reduce(function(a,x){ return a + x.s; }, 0) / 60);

/* ============================================================
   VOLUME SETTIMANALE PER GRUPPO MUSCOLARE
   ============================================================
   L'app contava serie, carichi, calorie, peso e stretching, ma non l'unica
   variabile che decide se il muscolo cresce.

   AGGANCIATO ALLO SLOT, NON ALLA VARIANTE. Lo slot e' il pattern di movimento,
   e il pattern determina i muscoli: sostituendo il rematore col rematore
   australiano la schiena prende comunque le sue serie. Le due varianti
   aggiuntive non occupano uno slot e hanno una voce loro.

   MEZZO PESO AL LAVORO INDIRETTO. Non e' un numero inventato: la letteratura
   sul volume delle braccia raccomanda di sottrarre 3-5 serie di stimolo gia
   ricevuto dai multiarticolari, e contare meta e' il modo piu semplice di
   farlo. [Da verificare se sia raccomandazione con supporto sperimentale o
   prassi consolidata: vedi vincoli.md.]

   COSA QUESTA TESSERA NON DEVE DIVENTARE. Un obiettivo da inseguire. Serve a
   VEDERE la settimana, non a gareggiare con se stessi: niente "ti mancano
   quattro serie", niente spunte verdi a 20, nessun confronto con la settimana
   scorsa. A BMI 17,6 una funzione che invita ad allenarsi di piu senza
   mangiare di piu viola la regola centrale del progetto — vincoli.md 1-octies.
   ============================================================ */

var MUSC = {
  acc:   { d:["Quadricipiti","Glutei"],  i:[] },
  cern:  { d:["Femorali","Glutei"],      i:["Lombari"] },
  spo:   { d:["Petto"],                  i:["Tricipiti"] },
  tvert: { d:["Dorsali"],                i:["Bicipiti"] },
  toriz: { d:["Dorsali"],                i:["Bicipiti"] },
  svert: { d:["Spalle"],                 i:["Tricipiti"] },
  core:  { d:["Core"],                   i:[] }
};
/* Gli aggiuntivi: non occupano uno slot, quindi il loro contributo va detto
   a parte o sparirebbe dal conto. */
var MUSC_EX = {
  legcurl: { d:["Femorali"], i:[] },
  alzate:  { d:["Spalle"],   i:[] }
};
var VOL_MIN = 10, VOL_MAX = 20, VOL_POCO = 5;

/* Da lunedi a domenica, non "ultimi sette giorni": la settimana si azzera il
   lunedi, altrimenti il numero scivolerebbe insieme all'ultima seduta. */
function settimanaDi(d){
  var lun = mondayOf(parseISO(d)), out = [];
  for(var i = 0; i < 7; i++){
    var g = new Date(lun); g.setDate(lun.getDate() + i);
    out.push(iso(g));
  }
  return out;
}

function volumeSettimana(d){
  var tot = {};
  function metti(m, q){ tot[m] = (tot[m] || 0) + q; }
  settimanaDi(d).forEach(function(g){
    var sess = S.sessions[g] || {};
    Object.keys(sess).forEach(function(exId){
      /* Solo le serie SPUNTATE. Le righe create al volo da setsOf() e la serie
         di avvicinamento non sono lavoro e non entrano. */
      var n = (sess[exId] || []).filter(function(x){ return x.done; }).length;
      if(!n) return;
      var m = MUSC_EX[exId];
      if(!m){
        var sl = slotDiEx(exId);
        m = sl ? MUSC[sl.id] : null;
      }
      if(!m) return;
      m.d.forEach(function(x){ metti(x, n); });
      m.i.forEach(function(x){ metti(x, n / 2); });
    });
  });
  return tot;
}

function statoVol(v){ return v < VOL_POCO ? "poco" : v > VOL_MAX ? "tanto" : "dentro"; }

function vVolume(d){
  var tot = volumeSettimana(d);
  var gruppi = Object.keys(tot).sort(function(a, b){ return tot[b] - tot[a]; });
  if(!gruppi.length){
    return '<div class="card"><div class="eyebrow">Volume di questa settimana</div>' +
      '<p class="fine">Nessuna serie spuntata questa settimana. Il conteggio parte da lunedì.</p></div>';
  }
  var h = '<div class="card"><div class="eyebrow">Volume di questa settimana</div>' +
    '<p class="fine">Serie per gruppo muscolare, da lunedì. La fascia scura è <strong>' +
    VOL_MIN + '-' + VOL_MAX + '</strong>, il riferimento per la crescita; da principiante si cresce già con ' + VOL_POCO + '-' + VOL_MIN + '.</p>';
  gruppi.forEach(function(g){
    var v = tot[g], st = statoVol(v);
    var pc = Math.min(100, v / 26 * 100);
    h += '<div class="volr">' +
      '<span class="vn">' + esc(g) + '</span>' +
      '<span class="vb"><i class="fascia" style="left:' + (VOL_MIN/26*100) + '%;width:' + ((VOL_MAX-VOL_MIN)/26*100) + '%"></i>' +
        '<i class="riemp" data-s="' + st + '" style="width:' + pc + '%"></i></span>' +
      '<span class="vv num" data-s="' + st + '">' + (v % 1 ? String(v).replace(".", ",") : v) + '</span>' +
      '</div>';
  });
  /* Una frase sola, e dice un FATTO, non un incoraggiamento. */
  var dor = tot["Dorsali"] || 0, qua = tot["Quadricipiti"] || 0;
  if(dor >= qua * 2 && qua > 0)
    h += '<p class="fine">I dorsali prendono il doppio delle gambe perché lat machine e rematore lavorano gli stessi muscoli.</p>';
  h += '<p class="fine">Le mezze serie sono lavoro <strong>indiretto</strong>: i tricipiti prendono metà serie da ogni spinta, i bicipiti da ogni trazione.</p>' +
    '</div>';
  return h;
}

  var vuoti = SLOT.filter(function(s){ return variantiSlot(s).length === 0; });

    h += '<details class="perche"><summary><span>Perché questo numero</span></summary>' +
      '<p class="fine">La dorsiflessione della caviglia — portare la tibia avanti sopra il piede col tallone a terra — è associata in modo significativo alla profondità dell\'accosciata. È quello che predice se il goblet squat verrà bene, più delle proporzioni ossee. Se è bassa, la categoria <strong>Caviglie</strong> dello stretching serve proprio a quello.</p>' +

  /* I percorsi memorizzati. Le tracce c'erano dalla v3.2 ma vivevano solo

    /* L'assillo del backup scaduto ha senso solo finché il backup è l'unica

    (function(){

document.getElementById("view").addEventListener("click", function(e){

  if(a === "seriePiu"){ avvisoSerie = null; cambiaSerie(d, el.dataset.id, +1); buzz(25); render(); return; }
  if(a === "serieMeno"){

    avvisoSerie = esito === "spuntata" ? { id:el.dataset.id, t:"Questa serie l'hai già registrata. Annulla la spunta e poi la togli." }
                : esito === "minimo" ? { id:el.dataset.id, t:"Una serie deve restare." }

    for(var k2 = 0; k2 < ses.steps.length; k2++){

  if(a === "defSi"){

    if(!S.rifiutati) S.rifiutati = {};

    if(pe >= 14 && pe <= 100) S.profilo.eta = pe;
    if(pa >= 120 && pa <= 230) S.profilo.altezza = pa;
    S.profilo.sesso = document.getElementById("pfSex").value === "f" ? "f" : "m";
    S.profilo.fatto = true;
    save(); buzz(30); render(); return;
  }
  if(a === "addPassi"){
    var pv = parseInt(document.getElementById("psN").value, 10);
    var pd = document.getElementById("psD").value;
    if(!pd || isNaN(pv) || pv < 0) return;
    if(!S.passi) S.passi = {};
    S.passi[pd] = pv; save(); render(); return;
  }
  if(a === "gpsVia"){ gpsVia(); return; }
  if(a === "gpsStop"){
    /* Fermare il seguimento non butta via i chilometri: restano in gps.km e
       finiscono nella corsa quando la chiudi. */
    gpsFerma(); render(); return;
  }

  if(a === "runPlay"){
    runStart();
    /* Si entra da qui, non toccando la linguetta: la scheda Corsa serve anche
       a guardare la tabella, spegnere le tessere e leggere i perche, e se
       toccarla buttasse a schermo pieno quelle cose non si raggiungerebbero. */
    if(!imm.on) immEntra(); else immVai(immFase().k === "run" ? "a" : "b");
    render(); return;
  }
  if(a === "runPause"){ runPause(); render(); return; }
  if(a === "runSkip"){ if(!run.started){ run.seq = buildSeq(weekClamped()); run.i = 0; run.started = true; } runNext(); render(); return; }
  if(a === "runStop"){ run.started = false; run.playing = false; syncWake(); render(); return; }
  if(a === "ellittica"){
    S.runs.push({ d:d, week:weekClamped(), kind:"ellittica", rpe:null }); save(); render(); return;
  }

  if(a === "addFood"){
    foodDay(d).push({ n:el.dataset.n, k:+el.dataset.k, p:+el.dataset.p });
    save(); buzz(25); render(); return;
  }
  if(a === "delFood"){ foodDay(d).splice(+el.dataset.i, 1); save(); render(); return; }
  /* Mezza porzione e doppia porzione: il piatto cambia piu spesso del cibo. */
  if(a === "qPiu" || a === "qMeno"){
    var vx = foodDay(d)[+el.dataset.i];
    var q = (vx.q || 1) + (a === "qPiu" ? 0.5 : -0.5);
    if(q < 0.5) q = 0.5;
    vx.q = Math.round(q * 10) / 10;
    save(); render(); return;
  }
  if(a === "ripetiIeri"){
    var ie = S.food[iso(new Date(Date.now() - 86400000))] || [];
    ie.forEach(function(x){ foodDay(d).push({ n:x.n, k:x.k, p:x.p, q:x.q || 1 }); });
    save(); buzz(30); render(); return;
  }
  if(a === "delMio"){ S.mieiCibi.splice(+el.dataset.i, 1); save(); render(); return; }
  if(a === "addCustom"){
    var n2 = document.getElementById("cN").value.trim();
    var k2 = parseFloat(document.getElementById("cK").value);
    var p2 = parseFloat(document.getElementById("cP").value);
    if(!n2 || isNaN(k2)) return;
    var voce = { n:n2, k:Math.round(k2), p:isNaN(p2) ? 0 : Math.round(p2) };
    foodDay(d).push({ n:voce.n, k:voce.k, p:voce.p });
    /* e resta: la prossima volta e un tocco solo */
    if(!S.mieiCibi.some(function(x){ return x.n.toLowerCase() === voce.n.toLowerCase(); })) S.mieiCibi.push(voce);
    save(); render(); return;
  }

  if(a === "addPeso"){
    var wd = document.getElementById("wD").value, wk2 = parseFloat(document.getElementById("wK").value);
    if(!wd || isNaN(wk2)) return;
    S.weights = S.weights.filter(function(x){ return x.d !== wd; });
    S.weights.push({ d:wd, kg:wk2 }); save(); render(); return;
  }
  if(a === "addKw"){
    var kd = document.getElementById("kD").value;
    var ksx = parseFloat(document.getElementById("kSx").value);
    var kdx = parseFloat(document.getElementById("kDx").value);
    if(!kd || isNaN(ksx) || isNaN(kdx)) return;   /* servono tutti e due i lati: l'asimmetria e' il dato */
    S.kw = (S.kw || []).filter(function(x){ return x.d !== kd; });
    S.kw.push({ d:kd, sx:ksx, dx:kdx }); save(); render(); return;
  }
  if(a === "addFtf"){
    var fd = document.getElementById("fD").value, fc = parseFloat(document.getElementById("fC").value);
    if(!fd || isNaN(fc)) return;
    S.ftf = S.ftf.filter(function(x){ return x.d !== fd; });
    S.ftf.push({ d:fd, cm:fc }); save(); render(); return;
  }

  if(a === "syncSalva"){
    var so = (document.getElementById("syOwner").value || "").trim();
    var sr = (document.getElementById("syRepo").value || "").trim();
    var st = (document.getElementById("syTok").value || "").trim();
    if(!so || !sr || !st){
      syErr = "Servono tutti e tre: proprietario, nome del repository e token.";
      render(); return;
    }
    try{
      localStorage.setItem(KEY_SY, JSON.stringify({ owner:so, repo:sr, token:st, file:"stato.json" }));
    }catch(e){
      syErr = "Non riesco a salvare il collegamento su questo browser.";
      render(); return;
    }
    syErr = ""; sy.tentativi = 0; sy.sha = null;
    /* Il primo giro e' quello che conta: legge cosa c'e' gia' in rete e lo
       fonde con quello che hai qui. Se il telefono era vuoto, si ripopola. */
    syncOra().then(render);
    render();
    return;
  }
  if(a === "syncAdesso"){ sy.tentativi = 0; syncOra().then(render); return; }
  if(a === "syncScollega"){
    if(!confirm("Scollego la sincronia?\nI dati gia' in rete restano dove sono. Da qui in poi l'app scrive solo su questo telefono.")) return;
    try{ localStorage.removeItem(KEY_SY); }catch(e){}
    syErr = ""; sy.sha = null; syncStato("off"); render();
    return;
  }

  if(a === "ics"){ scaricaICS(); return; }
  if(a === "export"){ doExport(); return; }
  if(a === "showImport"){ var ib = document.getElementById("importBox"); ib.hidden = !ib.hidden; return; }
  if(a === "torna"){
    /* Prima di sovrascrivere si mette da parte com'e adesso, altrimenti un
       ripristino sbagliato e' irreversibile quanto quello che sta riparando. */
    if(!confirm("Rimetti i dati com'erano il " + el.dataset.d.slice(8) + "/" + el.dataset.d.slice(5,7) + "?\nQuello che hai scritto dopo va perso.")) return;
    var c = copie(); c.push({ d:"prima-del-ripristino", s:JSON.stringify(S) });
    while(c.length > 8) c.shift();
    try{ localStorage.setItem(KEY_BK, JSON.stringify(c)); }catch(e){}
    if(ripristinaCopia(el.dataset.d)) render();
    return;
  }
  if(a === "import"){
    try{
      var o = JSON.parse(document.getElementById("impT").value);
      if(!o || typeof o.v !== "number") throw 0;
      if(o.v > SCHEMA){ alert("Questo backup viene da una versione piu recente dell'app. Aggiorna l'app prima di ripristinarlo."); return; }
      S = migra(o); save(); render();
    }catch(err){ alert("Il testo incollato non è un backup valido. Deve iniziare con una graffa e contenere tutti i dati del file esportato."); }
    return;
  }
});

/* QUARTO ascoltatore. I data-act sono agganciati a #tabs, #rest e #view: il
   pannello immersivo sta FUORI da #view, quindi li dentro nessun comando
   funzionerebbe — inclusi runPlay e runPause, che sembrano riusati e invece
   non arriverebbero mai. Sei azioni, non serve estrarre il gestore grande. */
document.getElementById("imm").addEventListener("click", function(e){
  var el = e.target.closest("[data-act]"); if(!el) return;
  var a = el.dataset.act;
  if(a === "runPlay"){ runStart(); immVai(immFase().k === "run" ? "a" : "b");
    document.getElementById("immFoot").innerHTML = immFootHTML();
    document.getElementById("immHud").innerHTML = immHudHTML(); return; }
  if(a === "runPause"){ runPause();
    document.getElementById("immFoot").innerHTML = immFootHTML(); return; }
  if(a === "runSkip"){
    if(!run.started){ run.seq = buildSeq(weekClamped()); run.i = 0; run.started = true; }
    runNext(); return;
  }
  if(a === "immEsci"){ immEsci(); return; }
  if(a === "immZoomPiu" || a === "immZoomMeno"){
    var z = immZ + (a === "immZoomPiu" ? 1 : -1);
    if(z < 13 || z > 17) return;
    S.immZoom = z; save();
    /* Cambiare zoom e un ricalcolo, cioe la stessa cosa che succede gia ogni
       128 px di deriva. Non e un costo nuovo. */
    immNodi = {}; document.getElementById("immTess").innerHTML = ""; immBase = null;
    if(gps.pts.length > 1){ immRicalcola(); immTraccia(); }
    document.getElementById("immHud").innerHTML = immHudHTML();
    return;
  }
  if(a === "gpsVia"){ gpsVia(); document.getElementById("immFoglio").innerHTML = immFoglioHTML(); return; }
  if(a === "tessere"){
    S.tessere = !!el.checked; save();
    immNodi = {}; document.getElementById("immTess").innerHTML = "";
    immBase = null;
    if(gps.pts.length > 1){ immRicalcola(); immTraccia(); }
    document.getElementById("immFoglio").innerHTML = immFoglioHTML();
    return;
  }
});
document.getElementById("immScroll").addEventListener("scroll", immScrolla, { passive:true });
window.addEventListener("resize", function(){
  if(!imm.on) return;
  clearTimeout(imm.rz);
  imm.rz = setTimeout(function(){
    immG = immGeo();
    document.getElementById("immS1").style.height = immG.H + "px";
    document.getElementById("immFoglio").style.height = immG.H + "px";
    document.getElementById("immSvg").setAttribute("viewBox", "0 0 " + immG.W + " " + immG.H);
    immBase = null;
    if(gps.pts.length > 1){ immRicalcola(); immTraccia(); }
    immPiazza(imm.p);
  }, 300);
});

document.getElementById("view").addEventListener("change", function(e){
  if(e.target.matches(".set input")) writeSet(e.target);
  if(e.target.matches("[data-reg]")){ S.regol[e.target.dataset.reg] = e.target.value.trim(); save(); }
});
document.getElementById("view").addEventListener("input", function(e){
  if(e.target.matches("[data-reg]")){ S.regol[e.target.dataset.reg] = e.target.value.trim(); save(); }
});
/* Il movimento accanto a un campo aperto e solo disturbo: la figura si ferma. */
document.getElementById("view").addEventListener("focusin", function(e){
  if(e.target.matches("input")) anim.ferma = true;
});
document.getElementById("view").addEventListener("focusout", function(e){
  if(e.target.matches("input")) anim.ferma = false;
});

/* Filtro dei cibi. Non passa da render(): riscrivere la vista a ogni lettera
   farebbe perdere il campo mentre scrivi. Si nascondono i bottoni e basta. */
document.getElementById("view").addEventListener("input", function(e){
  if(e.target.id !== "cerca") return;
  var q = e.target.value.trim().toLowerCase();
  Array.prototype.forEach.call(document.querySelectorAll(".gruppo"), function(g){
    var visti = 0;
    Array.prototype.forEach.call(g.querySelectorAll(".foods .food"), function(b){
      var ok = !q || b.dataset.n.toLowerCase().indexOf(q) >= 0;
      var riga = b.parentElement.classList.contains("mio") ? b.parentElement : b;
      riga.style.display = ok ? "" : "none";
      if(ok) visti++;
    });
    g.style.display = visti ? "" : "none";
  });
});

function writeSet(inp){
  var row = inp.closest(".set"); if(!row) return;
  var sets = setsOf(oggiISO(), row.dataset.ex);
  var i = +row.dataset.i;
  /* Se la riga era ancora una proposta, toccarla la promuove per intero: si
     scrivono tutti i campi visibili, non solo quello modificato, altrimenti
     resterebbe mezza registrata e mezza suggerita. */
  var campi = row.dataset.prop === "1" ? row.querySelectorAll("input") : [inp];
  Array.prototype.forEach.call(campi, function(x){
    var v = parseFloat(x.value);
    sets[i][x.dataset.f] = isNaN(v) ? null : v;
  });
  row.setAttribute("data-prop", "0");
  save();
}

function doExport(){
  var payload = JSON.stringify(S, null, 1);
  var name = "palestra-" + oggiISO() + ".json";
  if(window.claude && window.claude.downloads && window.claude.downloads.save){
    window.claude.downloads.save({ filename:name, data:payload })
      .then(function(){ segnaExport(); })
      .catch(function(){ fallbackExport(payload, name); });
  } else fallbackExport(payload, name);
}
/* Segnato solo quando il salvataggio e andato a buon fine: se l'utente annulla
   il download il promemoria deve restare acceso. */
function segnaExport(){
  S.lastExport = oggiISO(); save();
  if(tab === "dati") render();
}
function fallbackExport(payload, name){
  try{
    var blob = new Blob([payload], { type:"application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    segnaExport();
  }catch(e){
    var ib = document.getElementById("importBox");
    if(ib){ ib.hidden = false; document.getElementById("impT").value = payload; }
    alert("Non riesco a scaricare il file da qui. Ho messo i dati nel riquadro di testo qui sotto: copiali e incollali in un file.");
  }
}

render();
</script>
