<title>Palestra — settimane 1-4</title>
<style>
  /* ============================================================
     Palette presa da "valore" (finanza-personale/valore/stile.css), per
     famiglia visiva fra i due progetti. Valori dal codice, non dal documento.
     Concetto: Osservatorio — fondo notte, pannelli di vetro che ci galleggiano
     sopra, smeraldo come firma. La notte e il default, come li.
     REGOLA VINCOLANTE di valore: il verde-firma non coincide col verde-stato,
     altrimenti il cervello confonde decorazione e stato.
     Firma #16E8A0 · stato ok #97C459. Non avvicinarli.
     ============================================================ */
  :root{
    --bg:#0A0D10; --surface:rgba(13,18,23,0.85);
    --surface-2:rgba(255,255,255,0.04); --surface-3:rgba(255,255,255,0.09);
    --ink:#EAF0EE; --ink-2:#B6C3C7; --ink-3:#93A4AE;
    --line:rgba(255,255,255,0.10); --line-2:rgba(234,240,238,0.22);
    --accent:#16E8A0; --accent-ink:#04231A; --accent-soft:rgba(22,232,160,0.14);
    --ochre:#16E8A0; --ochre-soft:rgba(22,232,160,0.14);
    --ok:#97C459; --ok-soft:rgba(151,196,89,0.16);
    --warn:#EF9F27;
    --bad:#E24B4A; --bad-soft:rgba(226,75,74,0.16);
    /* Azzurro elettrico: la ghisa e le macchine. Non e un colore di stato —
       lo smeraldo resta l'unico che vuol dire qualcosa. --ghisa e cio che si
       muove col tuo gesto, --ghisa-2 il telaio che sta fermo. */
    --ghisa:#2E8BFF; --ghisa-2:#1B4C86;
    --rete:rgba(22,232,160,0.14); --alone-oriz:rgba(22,232,160,0.13);
    --ombra:0 8px 30px rgba(0,0,0,0.4);
    --alone:0 14px 36px rgba(0,0,0,0.28), 0 0 22px rgba(22,232,160,0.18);
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --r:16px;
  }
  :root[data-theme="dark"]{
    --bg:#0A0D10; --surface:rgba(13,18,23,0.85);
    --surface-2:rgba(255,255,255,0.04); --surface-3:rgba(255,255,255,0.09);
    --ink:#EAF0EE; --ink-2:#B6C3C7; --ink-3:#93A4AE;
    --line:rgba(255,255,255,0.10); --line-2:rgba(234,240,238,0.22);
    --accent:#16E8A0; --accent-ink:#04231A; --accent-soft:rgba(22,232,160,0.14);
    --ochre:#16E8A0; --ochre-soft:rgba(22,232,160,0.14);
    --ok:#97C459; --ok-soft:rgba(151,196,89,0.16);
    --warn:#EF9F27;
    --bad:#E24B4A; --bad-soft:rgba(226,75,74,0.16);
    --ghisa:#2E8BFF; --ghisa-2:#1B4C86;
    --rete:rgba(22,232,160,0.14); --alone-oriz:rgba(22,232,160,0.13);
    --ombra:0 8px 30px rgba(0,0,0,0.4);
    --alone:0 14px 36px rgba(0,0,0,0.28), 0 0 22px rgba(22,232,160,0.18);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.5;
    -webkit-text-size-adjust:100%;
    padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));
  }
  #app{max-width:560px;margin:0 auto; position:relative; z-index:1}

  /* ---------- fondale in profondita ----------
     Un pavimento che scorre verso di te, in prospettiva: le tessere smettono
     di stare su una parete piatta e iniziano a galleggiare sopra uno spazio.
     E CSS 3D, non WebGL, per un motivo preciso: durante la seduta lo schermo
     resta acceso col wake lock, e un contesto WebGL che gira per un'ora di
     palestra si mangia la batteria. Qui si animano solo transform e opacity,
     due soli livelli, quindi il lavoro lo fa la GPU e il thread principale
     resta libero per i timer.
     L'alfa e bassissima di proposito: i contrasti del testo sono calcolati
     su --surface, e questo non deve spostarli. */
  .fondo{
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
    perspective:640px; perspective-origin:50% 30%;
    /* Sfuma all'orizzonte e a fondo schermo: senza, la griglia finisce di
       taglio contro il bordo e si legge come un difetto. */
    -webkit-mask-image:linear-gradient(to bottom, transparent 24%, #000 42%, #000 90%, transparent);
    mask-image:linear-gradient(to bottom, transparent 24%, #000 42%, #000 90%, transparent);
  }
  .fondo .piano{
    position:absolute; left:-70%; right:-70%; top:30%; bottom:-70%;
    transform:rotateX(69deg); transform-origin:50% 0;
  }
  /* Il disegno e alto il doppio di una cella e scorre di una cella esatta:
     cosi il ciclo si richiude e non si vede il salto. */
  .fondo .griglia{
    position:absolute; inset:-64px 0 0 0;
    background-image:
      repeating-linear-gradient(to right, var(--rete) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(to bottom, var(--rete) 0 1px, transparent 1px 64px);
    animation:scorre 9s linear infinite;
  }
  @keyframes scorre{from{transform:translate3d(0,0,0)} to{transform:translate3d(0,64px,0)}}
  /* Alone all'orizzonte: da solo dice "profondita" piu della griglia. */
  .fondo .orizz{
    position:absolute; left:50%; top:30%; width:160%; height:260px;
    transform:translate(-50%,-70%);
    background:radial-gradient(50% 50% at 50% 50%, var(--alone-oriz), transparent 72%);
    animation:respiro 13s ease-in-out infinite;
  }
  @keyframes respiro{0%,100%{opacity:.5} 50%{opacity:1}}
  /* Durante la seduta il pannello copre tutto e lo schermo e forzato acceso:
     far girare il fondale sotto una cosa che non si vede e solo batteria. */
  body.in-ses .fondo .griglia, body.in-ses .fondo .orizz{animation-play-state:paused}

  /* ---------- testata ---------- */
  .top{
    position:sticky; top:0; z-index:30;
    background:var(--bg); border-bottom:1px solid var(--line);
    padding:10px 16px 8px; display:flex; align-items:baseline; gap:10px;
  }
  .top h1{font-size:15px;font-weight:650;margin:0;letter-spacing:-.01em}
  .top .wk{
    margin-left:auto; font-family:var(--mono); font-size:12px;
    color:var(--ink-2); letter-spacing:.04em; text-transform:uppercase;
  }
  /* La riga di verita della sincronia. Non e un pulsante e non chiede niente:
     dice soltanto se quello che hai scritto e' gia uscito dal telefono.
     Serve perche' senza non c'e' modo di fidarsi, e fidarsi e' tutto il punto. */
  .top .sy{
    font-family:var(--mono); font-size:11px; letter-spacing:.03em;
    display:inline-flex; align-items:center; gap:5px; color:var(--ink-2);
  }
  .top .sy::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .top .sy[data-s="ok"]{color:var(--accent)}
  .top .sy[data-s="lavoro"]::before{animation:respiro 1.1s ease-in-out infinite}
  .top .sy[data-s="offline"],.top .sy[data-s="attesa"]{color:var(--warn)}
  .top .sy[data-s="errore"],.top .sy[data-s="auth"]{color:var(--bad)}

  main{padding:14px 16px 24px; display:flex; flex-direction:column; gap:14px}

  /* ---------- blocchi ---------- */
  /* I pannelli di "vetro" di valore: galleggiano sul fondo notte, si sollevano
     di 3px e si illuminano di smeraldo quando li tocchi. Stessi valori. */
  .card, .today, .ex, .runner{
    box-shadow:var(--ombra);
    /* NIENTE opacity in questa transizione. L'opacita' e' gia' guidata
       dall'animazione "entra" (.52s), e prima c'era anche una transizione
       da .6s sulla stessa proprieta': due motori con durate diverse che si
       contendono lo stesso valore. Quando l'animazione finiva e mollava la
       presa, la transizione era ancora a meta' strada e faceva lo scatto —
       e' il lampeggio che si vedeva scorrendo, dopo che la scheda era gia'
       entrata. Chi la rimette lo rimette. */
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .card:hover, .today:hover, .ex:hover, .runner:hover{
    transform:translateY(-3px); border-color:var(--accent-soft); box-shadow:var(--alone);
  }
  .card:active, .ex:active{transform:translateY(-1px)}
  /* dissolvenza in entrata. In valore e una coppia di classi perche il DOM resta;
     qui render() ricostruisce la vista ogni volta, quindi basta l'animazione:
     riparte da sola a ogni cambio di scheda e non puo lasciare niente nascosto. */
  /* --dx la scrive render(): la vista entra dal lato da cui sei arrivato,
     cosi il passaggio fra schede racconta in che direzione ti sei mosso. */
  @keyframes entra{
    from{opacity:0; transform:translate3d(var(--dx,0px),14px,0) scale(.985)}
    to{opacity:1; transform:none}
  }
  /* .52s invece di .45: con la scala in mezzo, il tempo di prima faceva
     sembrare la scheda scattata li invece di arrivata. */
  .card, .today, .ex, .runner, .ses{animation:entra .52s cubic-bezier(.2,.8,.2,1) both}
  /* Il pannello della seduta e fisso a schermo intero: entra piu deciso e
     senza scaglionamento, e un passo solo. */
  .ses{animation-duration:.34s}
  /* Scaglionate: l'occhio segue l'ordine di lettura invece di ricevere tutto
     in faccia. Oltre la quinta il ritardo si sentirebbe come lentezza. */
  #view > *:nth-child(2){animation-delay:.05s}
  #view > *:nth-child(3){animation-delay:.10s}
  #view > *:nth-child(4){animation-delay:.15s}
  #view > *:nth-child(5){animation-delay:.20s}
  #view > *:nth-child(6){animation-delay:.25s}
  #view > *:nth-child(7){animation-delay:.30s}
  #view > *:nth-child(8){animation-delay:.35s}
  #view > *:nth-child(n+9){animation-delay:.40s}
  /* Sotto la piega lo scaglionamento non serve: quando ci arrivi scorrendo,
     quella scheda e la prima che vedi. Entra da sola, senza coda. */
  .attesa{opacity:0 !important; animation:none !important}
  /* Ridisegno della STESSA vista: nessun ingresso. L'animazione racconta un
     arrivo, e una spunta o una serie in piu non sono un arrivo — rifarla a
     ogni tocco fa tornare invisibile tutto quello che sta sotto la piega, e
     scorrendo la pagina sembra lampeggiare. */
  #view.zitto .card, #view.zitto .today, #view.zitto .ex,
  #view.zitto .runner, #view.zitto .ses, #view.zitto .tile{animation:none}
  .arriva{animation:entra .52s cubic-bezier(.2,.8,.2,1) both !important; animation-delay:0s !important}
  /* le barre si riempiono invece di saltare al valore */
  @keyframes riempi{from{transform:scaleX(0)} to{transform:scaleX(1)}}
  /* i grafici si tracciano da sinistra a destra */
  @keyframes traccia{from{stroke-dashoffset:1} to{stroke-dashoffset:0}}
  /* Un numero che sale cambia larghezza a ogni cifra e trascina con se tutto
     cio che gli sta accanto: le cifre a passo fisso tengono ferma la riga. */
  .conta{font-variant-numeric:tabular-nums}
  @keyframes appari{from{opacity:0} to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.4)} to{opacity:1;transform:none}}
  /* Cinque pallini che compaiono in fila: si conta con l'occhio, non leggendo. */
  .pallini i{animation:pop .3s cubic-bezier(.34,1.56,.64,1) both}
  .pallini i:nth-child(2){animation-delay:.04s}
  .pallini i:nth-child(3){animation-delay:.08s}
  .pallini i:nth-child(4){animation-delay:.12s}
  .pallini i:nth-child(5){animation-delay:.16s}
  /* Conferma di una serie: e il gesto che si ripete 21 volte a seduta, con le
     mani sudate e senza guardare. Il rimbalzo dice "preso" prima che si legga
     qualsiasi cosa. E l'unico rimbalzo di tutta l'app, e sta qui di proposito. */
  @keyframes botto{0%{transform:scale(1)} 38%{transform:scale(1.22)} 100%{transform:scale(1)}}
  @keyframes anello{from{transform:scale(.6);opacity:.8} to{transform:scale(2.1);opacity:0}}
  .botto{animation:botto .42s cubic-bezier(.34,1.56,.64,1)}
  /* L'anello nasce al centro di cio che hai toccato e muore fuori: non occupa
     spazio, non sposta niente, non si puo toccare. */
  .anello{
    position:fixed;z-index:60;pointer-events:none;border-radius:50%;
    border:2px solid var(--accent); animation:anello .6s ease-out forwards;
  }

  .card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r); padding:15px;
  }
  .card > * + *{margin-top:10px}
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.09em;
    text-transform:uppercase; color:var(--ink-3);
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
  h2{font-size:19px;line-height:1.25;margin:0;font-weight:640;text-wrap:balance;letter-spacing:-.015em}
  h3{font-size:15px;margin:0;font-weight:620;letter-spacing:-.01em}
  p{margin:0;color:var(--ink-2);font-size:14px}
  .fine{font-size:12.5px;color:var(--ink-3);line-height:1.45}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------- controlli ---------- */
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    min-height:44px;padding:0 16px;border-radius:8px;
    background:var(--surface-2);border:1px solid var(--line-2);
    font-size:15px;font-weight:560;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.food{background:var(--ochre);border-color:var(--ochre);color:var(--bg)}
  .btn.ghost{background:transparent}
  .btn.wide{width:100%}
  .btn.sm{min-height:34px;padding:0 11px;font-size:13.5px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  input[type=number],input[type=date],input[type=text]{
    font:inherit;font-family:var(--mono);font-variant-numeric:tabular-nums;
    background:var(--surface-2);color:var(--ink);
    border:1px solid var(--line-2);border-radius:7px;
    padding:8px 9px;min-height:42px;width:100%;
  }
  input[type=number]{-moz-appearance:textfield;text-align:center}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  .stepper{display:flex;align-items:stretch;gap:0;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;background:var(--surface-2)}
  .stepper button{width:38px;flex:none;font-size:19px;color:var(--ink-2);background:var(--surface-3)}
  .stepper button:active{background:var(--accent-soft);color:var(--accent)}
  .stepper input{border:none;border-radius:0;background:transparent;min-height:42px;width:100%;padding:0}

  /* ---------- pillole di stato ---------- */
  .pill{
    display:inline-flex;align-items:center;gap:5px;
    font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);
  }
  .pill.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
  .pill.up{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
  .pill.alert{background:var(--bad-soft);border-color:transparent;color:var(--bad)}

  /* ---------- avvisi ---------- */
  .note{
    border-left:3px solid var(--accent);background:var(--accent-soft);
    padding:11px 13px;border-radius:0 8px 8px 0;font-size:13.5px;color:var(--ink-2);
  }
  .note strong{color:var(--ink)}
  /* Regola di valore: il rosso e una scorciatoia all'amigdala, rosso ovunque
     vuol dire ansia costante. Resta solo per gli allarmi veri — dolore che
     torna tre volte, dati che non si salvano. Tutto il resto e ambra. */
  .note.alert{border-color:var(--bad);background:var(--bad-soft)}
  .note.warn{border-color:var(--warn);background:rgba(239,159,39,0.13)}

  /* ---------- oggi ---------- */
  .today{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:16px;display:flex;flex-direction:column;gap:12px;
  }
  .today .date{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink-3);
  }
  .today h2{font-size:26px}
  .checklist{display:flex;flex-direction:column;gap:2px}
  .check{
    display:flex;align-items:center;gap:11px;padding:9px 2px;
    border-bottom:1px solid var(--line);text-align:left;width:100%;
  }
  .checklist .check:last-child{border-bottom:none}
  .box{
    width:22px;height:22px;flex:none;border:1.5px solid var(--line-2);border-radius:5px;
    display:grid;place-items:center;font-size:13px;color:transparent;
  }
  .check[data-on="1"] .box{background:var(--ok);border-color:var(--ok);color:#fff}
  .check[data-on="1"] .lbl{color:var(--ink-3);text-decoration:line-through}
  .lbl{font-size:14.5px;flex:1}
  .sub{font-size:12px;color:var(--ink-3);display:block;text-decoration:none!important}

  /* ---------- esercizi ---------- */
  .ex{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
  .ex + .ex{margin-top:10px}
  .ex-h{padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
  .ex-h .idx{
    font-family:var(--mono);font-size:12px;color:var(--ink-3);
    padding-top:2px;min-width:16px;
  }
  .ex-h .meta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .ex-body{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
  .set{display:grid;grid-template-columns:52px 1fr 1fr 46px;gap:7px;align-items:center}
  .set .sn{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
  .set .tick{
    min-height:42px;border:1px solid var(--line-2);border-radius:7px;
    background:var(--surface-2);display:grid;place-items:center;font-size:16px;color:var(--ink-3);
  }
  .set[data-done="1"] .tick{background:var(--ok);border-color:var(--ok);color:#fff}
  /* proposta non ancora confermata: numero in grigio, si distingue da un dato vero */
  .set[data-prop="1"] input{color:var(--ink-3)}
  .set[data-prop="1"] .tick{border-color:var(--accent);color:var(--accent)}
  .set-head{display:grid;grid-template-columns:52px 1fr 1fr 46px;gap:7px}
  .set-head span{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:center}
  .set-head span:first-child{text-align:left}
  .how{
    font-size:13.5px;color:var(--ink-2);line-height:1.55;
    background:var(--surface-2);border-top:1px solid var(--line);padding:12px 14px;
  }
  .how p + p{margin-top:8px}

  /* ---------- spiegazioni richiudibili ----------
     Le ragioni contano, ma non ogni volta: in sala pesi si legge la riga che
     dice cosa fare, il perche si apre quando serve. Nessun testo e stato
     tagliato — e tutto qui dentro, coi numeri e le fonti intatte.
     <details> nativo: si apre senza JS, e leggibile dai lettori di schermo,
     e resta aperto finche non lo richiudi. */
  .perche{border-top:1px solid var(--line);margin-top:10px;padding-top:2px}
  .perche summary{
    list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
    min-height:44px;font-size:13.5px;color:var(--ink-3);
  }
  .perche summary::-webkit-details-marker{display:none}
  /* Il testo va in uno span: un nodo di testo nudo in un flex si restringe
     e va a capo anche con mezzo schermo libero. */
  .perche summary > span{flex:1;min-width:0}
  .perche summary::after{
    content:"›";margin-left:auto;font-size:17px;line-height:1;
    transition:transform .18s ease;
  }
  .perche[open] summary::after{transform:rotate(90deg)}
  .perche[open] summary{color:var(--ink-2)}
  .perche > p{margin:0 0 10px}
  .perche > p:first-of-type{margin-top:2px}
  /* Dentro la seduta guidata il fondo e smeraldo pieno: la riga e il chevron
     vanno sul bianco, altrimenti sparisce tutto. */
  .perche.su-blu{border-top-color:rgba(255,255,255,.28)}
  .perche.su-blu summary{color:rgba(255,255,255,.82)}
  .perche.su-blu[open] summary{color:#fff}

  /* ---------- timer riposo ---------- */
  .rest{
    position:fixed;left:0;right:0;z-index:40;
    bottom:calc(60px + env(safe-area-inset-bottom,0px));
    /* pannello di vetro con lo smeraldo sul numero, non un blocco pieno:
       sta a schermo per minuti interi e in tinta unita e troppo rumore */
    background:var(--surface);color:var(--ink);
    /* Il bordo e il BINARIO su cui corre la riga del riposo, quindi va spento:
       con lo smeraldo su tutta la larghezza la riga che si accorcia sopra era
       invisibile — sotto restava una linea piena dello stesso colore. */
    border-top:2px solid var(--line-2); box-shadow:var(--ombra);
    padding:9px 16px;display:flex;align-items:center;gap:12px;
    max-width:560px;margin:0 auto;
  }
  /* l'attributo hidden nasconde con display:none, ma il display:flex qui sopra
     lo batteva per specificita: la barra restava a schermo con 0:00 sempre */
  .rest[hidden]{display:none}
  /* Riparte a ogni volta che torna visibile: passando da display:none a flex
     le animazioni ricominciano da sole, senza toccarla da JS. */
  .rest{animation:daSotto .34s cubic-bezier(.2,.8,.2,1)}
  @keyframes daSotto{from{transform:translate3d(0,100%,0)} to{transform:none}}
  /* Il tempo che resta, senza leggere il numero: la riga si accorcia da destra.
     Sta SOPRA il bordo smeraldo, quindi non aggiunge altezza alla fascetta. */
  .rest .ln{
    position:absolute;left:0;top:-2px;height:2px;background:var(--accent);
    width:100%;transform-origin:left center;
  }
  .rest .t{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
  .rest .w{flex:1;font-size:12.5px;color:var(--ink-2);line-height:1.3}
  .rest button{
    border:1px solid var(--line-2);border-radius:6px;padding:6px 10px;
    font-size:12.5px;font-family:var(--mono);color:var(--ink-2);
  }

  /* ---------- timer corsa ---------- */
  .runner{text-align:center;padding:22px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
  .runner .phase{
    font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  }
  .runner .big{
    font-family:var(--mono);font-size:66px;line-height:1;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:8px 0 4px;
  }
  /* era [data-kind="corsa"] e non corrispondeva mai: le fasi si chiamano run/walk */
  .runner[data-kind="run"] .big, .runner[data-kind="run"] .phase{color:var(--accent)}
  .figcorsa{max-width:200px; margin:2px auto 8px}
  .figcorsa{max-width:220px}
  .figcorsa .stage{background:none; border:none}
  .figcorsa .stage .bone{stroke:var(--ink)}
  .figcorsa .stage .head{fill:var(--ink)}
  .figcorsa .stage .suolo{stroke:var(--accent); stroke-opacity:.3}
  .runner[data-kind="run"] .figcorsa .stage .bone{stroke:var(--accent)}
  .runner[data-kind="run"] .figcorsa .stage .head{fill:var(--accent)}
  .runner .of{font-family:var(--mono);font-size:13px;color:var(--ink-3)}
  .track{display:flex;gap:3px;margin:14px 0 4px;height:8px}
  .track i{flex:1;background:var(--surface-3);border-radius:2px}
  .track i[data-s="run"]{background:var(--accent);opacity:.28}
  .track i[data-s="run"][data-p="1"]{opacity:1}
  .track i[data-s="walk"][data-p="1"]{background:var(--line-2)}

  /* ---------- barre ---------- */
  .gauge{display:flex;flex-direction:column;gap:6px}
  .gauge .lab{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--ink-2)}
  .gauge .lab b{font-family:var(--mono);font-size:17px;color:var(--ink);font-weight:600}
  .gauge .lab .goal{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
  .bar{position:relative;height:18px;background:var(--surface-3);border-radius:4px;overflow:hidden}
  .bar .fill{
    position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.9;
    transform-origin:left center; animation:riempi .6s cubic-bezier(.2,.8,.2,1);
  }
  /* Regola di valore: il colore dice lo STATO, non la categoria. Sotto il
     bersaglio e sopra il bersaglio sono due stati diversi, e si vedono. */
  .bar .fill[data-s="sotto"]{background:var(--warn)}
  .bar .fill[data-s="dentro"]{background:var(--ok)}
  .bar .fill[data-s="sopra"]{background:var(--warn)}
  .bar .zone{position:absolute;top:0;bottom:0;border-left:1px solid var(--ink-3);border-right:1px solid var(--ink-3);opacity:.5}
  .bar.blue .fill{background:var(--accent)}
  .ticks{display:flex;height:5px;gap:0}
  .ticks i{flex:1;border-left:1px solid var(--line-2)}
  .ticks i:first-child{border-left:none}

  /* ---------- cibo ---------- */
  .foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:7px}
  /* NB: questa classe e dei bottoni-alimento dentro la scheda Cibo. Non darla
     ad altro: il pulsante CIBO della barra in basso l'aveva, e si ritrovava
     addosso bordo, sfondo e padding di un bottone-alimento. */
  .food{
    text-align:left;border:1px solid var(--line-2);border-radius:8px;
    background:var(--surface-2);padding:9px 10px;min-height:56px;
  }
  .food:active{background:var(--ochre-soft);border-color:var(--ochre)}
  .food .fn{font-size:13.5px;line-height:1.25;display:block}
  .food .fv{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:3px;display:block}
  .eaten{display:flex;flex-direction:column;gap:1px}
  .eaten .e{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
  .eaten .e:last-child{border-bottom:none}
  .eaten .e .en{flex:1;min-width:0}
  .eaten .e .qt{color:var(--accent);font-family:var(--mono);font-size:12.5px}
  .eaten .e .v{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
  .qb{display:flex;flex:none;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
  .qb button{width:32px;min-height:32px;font-size:16px;color:var(--ink-2);background:var(--surface-2)}
  .qb button:active{background:var(--accent-soft);color:var(--accent)}
  .mio{position:relative}
  .mio .food{width:100%;padding-right:30px}
  .delmio{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:6px;
    color:var(--ink-3);font-size:15px;display:grid;place-items:center}
  .delmio:active{background:var(--bad-soft);color:var(--bad)}
  .eaten .e .x{width:30px;height:30px;flex:none;border-radius:6px;color:var(--ink-3);font-size:17px;display:grid;place-items:center}

  /* ---------- tabelle e grafici ---------- */
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--ink-3);font-weight:500;
  }
  td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
  svg.chart{width:100%;height:auto;display:block}

  .tag{
    display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-3);
  }
  hr{border:none;border-top:1px solid var(--line);margin:2px 0}
  textarea{
    width:100%;min-height:110px;font-family:var(--mono);font-size:12px;
    background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2);
    border-radius:7px;padding:9px;
  }

  /* ---------- navigazione ---------- */
  .tabs{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    max-width:560px;margin:0 auto;
    display:grid;grid-template-columns:repeat(5,1fr);
    background:linear-gradient(var(--surface),var(--surface)), var(--bg);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .tabs button{
    padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-3);border-top:2px solid transparent;margin-top:-1px;
  }
  .tabs button .g{width:20px;height:20px;display:block}
  /* L'evidenziatore restava incollato all'ultima scheda toccata: era lo stato
     di focus che il browser lascia dopo il tocco, non la scheda corrente. */
  .tabs button{-webkit-tap-highlight-color:transparent; background:transparent}
  .tabs button:focus{outline:none}
  .tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:-3px}
  .tabs button[aria-current="page"]{
    color:var(--accent); background:var(--accent-soft);
  }
  /* Un solo trattino che scorre da una scheda all'altra invece di cinque bordi
     che si accendono e spengono: si vede da dove vieni. --i lo scrive render(). */
  .tabs .cursore{
    position:absolute; top:-1px; left:0; height:2px; width:20%;
    background:var(--accent); border-radius:1px;
    transform:translate3d(calc(var(--i,0) * 100%),0,0);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
  }
  body.in-ses .tabs .cursore{display:none}

  /* ---------- tessere-dato ---------- */
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .tile{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:12px; display:flex; flex-direction:column; gap:7px; min-height:132px;
    box-shadow:var(--ombra); animation:entra .45s ease both;
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .tile:hover{transform:translateY(-3px); border-color:var(--accent-soft); box-shadow:var(--alone)}
  .tile .th{display:flex; align-items:center; gap:8px}
  .tile .ico{
    width:28px; height:28px; border-radius:9px; background:var(--accent-soft);
    display:grid; place-items:center; flex:none;
  }
  .tile .ico svg{width:15px; height:15px; stroke:var(--accent); fill:none; stroke-width:1.8;
    stroke-linecap:round; stroke-linejoin:round}
  .tile .tl{font-size:12.5px; color:var(--ink-2); line-height:1.2}
  .tile .tv{
    font-family:var(--mono); font-size:27px; font-weight:600;
    letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums;
  }
  .tile .tv small{font-size:12.5px; color:var(--ink-3); font-weight:500; margin-left:3px; letter-spacing:0}
  .tile .tf{
    display:flex; align-items:center; gap:6px; margin-top:auto;
    font-size:11.5px; color:var(--ink-3);
  }
  .pill-sm{
    font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 7px; border-radius:999px; background:var(--surface-3); color:var(--ink-2); flex:none;
  }
  .pill-sm.ok{background:var(--ok-soft); color:var(--ok)}
  .pill-sm.warn{background:rgba(239,159,39,.16); color:var(--warn)}
  .spark{width:100%; height:32px; display:block; overflow:visible}

  /* ---------- saluto ---------- */
  .saluto{display:flex; align-items:center; gap:10px}
  .saluto h2{font-size:25px}
  .oggi-cosa{font-size:16px; color:var(--ink-2); margin-top:3px}
  .oggi-cosa strong{color:var(--accent)}
  .figmini{width:104px; flex:none; margin-left:auto}
  .figmini{width:118px}
  .figmini .stage{background:none; border:none; box-shadow:none}
  .figmini .stage .bone{stroke:var(--ink)}
  .figmini .stage .head{fill:var(--ink)}
  .figmini .stage .suolo{stroke:var(--ink-3); stroke-opacity:.5}
  .figmini .stage .attr{fill:var(--ghisa); stroke:var(--ghisa)}
  .figmini .stage .macc{fill:var(--ghisa-2)}
  .riga-dati{font-size:13px; color:var(--ink-3); letter-spacing:.01em}
  .card.riga{display:flex; align-items:center; gap:12px}
  .pallini{display:flex; align-items:center; gap:5px; margin-top:5px}
  .pallini i{width:9px; height:9px; border-radius:50%; background:var(--surface-3)}
  .pallini i[data-on="1"]{background:var(--ok)}
  .pallini .num{margin-left:5px; font-size:12.5px; color:var(--ink-3)}

  /* ---------- calendario del programma ---------- */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal .dow{
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-3);text-align:center;padding-bottom:2px;
  }
  .cal .dd{
    aspect-ratio:1/1;border-radius:7px;border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-family:var(--mono);font-size:12px;color:var(--ink-2);background:var(--surface-2);
  }
  .cal .dd[data-t="pesi"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
  .cal .dd[data-t="corsa"]{background:var(--surface-3);border-color:transparent}
  .cal .dd[data-oggi="1"]{outline:2px solid var(--ink);outline-offset:1px}
  .cal .dd[data-sel="1"]{outline:2px solid var(--accent);outline-offset:1px;background:var(--accent-soft)}
  .cal .dd:active{transform:scale(.94)}
  .chiudi{margin-left:auto;width:28px;height:28px;border-radius:7px;flex:none;
    color:var(--ink-3);font-size:18px;display:grid;place-items:center}
  .chiudi:active{background:var(--surface-3);color:var(--ink)}
  /* Aggiungere o togliere una serie, sotto le righe dell'esercizio. */
  .serie-piu{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:4px}
  .serie-piu .num{font-size:15px;color:var(--ink-2);min-width:16px;text-align:center}
  /* Le frecce per spostare l'esercizio. Staccate dai tasti delle serie, sulla
     destra, perche' non si tocchino per sbaglio: sono due cose diverse. */
  .serie-piu .ordina{margin-left:auto;display:flex;gap:6px}
  .serie-piu .ordina .btn{min-width:44px;padding-left:0;padding-right:0;font-size:15px;line-height:1}
  .serie-piu .ordina .btn[disabled]{opacity:.3}
  /* 44 px su tutta la riga, frecce comprese. Erano 33: sotto la soglia che
     questo progetto dichiara di rispettare, e con le mani sudate si sbaglia. */
  .serie-piu .btn{min-height:44px}
  .avviso-serie{text-align:center;color:var(--warn);margin-top:6px}
  /* ---------- scelta dello stretching ---------- */
  .strescelta hr{border:0;border-top:1px solid var(--line);margin:12px 0 10px}
  .strecat{margin-top:12px}
  .strecat .kicker{display:block;margin-bottom:6px}
  .strevoce{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    padding:9px 11px; margin-bottom:6px; color:var(--ink); font:inherit;
    min-height:44px; cursor:pointer;
  }
  .strevoce[data-on="1"]{border-color:var(--accent); background:var(--accent-soft)}
  .strevoce[disabled]{cursor:default; opacity:.9}
  .strevoce .sn{
    flex:none; width:22px; height:22px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; font-family:var(--mono); font-size:12px;
    background:var(--surface-3); color:var(--ink-3);
  }
  .strevoce[data-on="1"] .sn{background:var(--accent); color:var(--accent-ink)}
  .strevoce .stt{flex:1; display:flex; flex-direction:column; gap:2px; min-width:0}
  .strevoce .stt strong{font-size:13.5px; font-weight:600}
  .strevoce .stt em{font-style:normal; font-size:11.5px; color:var(--ink-3); line-height:1.35}
  .strevoce .std{flex:none; font-size:10.5px; color:var(--ink-3); text-align:right; max-width:88px}
  /* ---------- cambiare la variante di uno slot ---------- */
  /* La figura dentro "come si fa". Altezza legata alla finestra come nella
     seduta: su uno schermo corto si rimpicciolisce invece di spingere il
     testo fuori. Nessuno sfondo e nessun bordo, come dalla v1.9.2. */
  /* Cronometro della tenuta: sta nella colonna dei chili degli esercizi a
     tempo, quindi deve stare nella stessa larghezza dello stepper. */
  /* Due sezioni sotto la stessa scheda. Non sono linguette di navigazione:
     stanno dentro la vista, quindi si distinguono dalla barra in basso. */
  /* La traccia della corsa: nessun fondo e nessuna cornice, come le figure
     dalla v1.9.2. Il percorso e' l'unica cosa disegnata. */
  /* La mappa: tessere in un riquadro con ritaglio, traccia sopra. Le tessere
     sono posizionate in pixel assoluti, quindi il contenitore non scorre. */
  .mappa{position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--line);
    background:var(--surface-2);margin:2px 0 8px}
  .mappa .tess{position:absolute;width:256px;height:256px;
    filter:grayscale(.35) brightness(.72) contrast(1.05)}
  .mappa .sopra{position:absolute;inset:0;width:100%;height:100%}
  .mappa .attrib{position:absolute;right:5px;bottom:4px;font-size:9px;
    color:var(--ink);background:rgba(10,13,16,.62);padding:1px 5px;border-radius:5px}
  /* Interruttore per le strade: e' l'unica scelta dell'app che manda fuori
     qualcosa, quindi sta a vista e non sepolta nelle impostazioni. */
  /* I menu a tendina non prendevano lo stile dei campi di testo: restavano
     alti 19 px, meno della meta della soglia che il progetto si impone.
     Trovato misurando dopo aver aggiunto il doctype, non guardando. */
  .campo select, select{
    width:100%; min-height:44px; padding:0 10px;
    background:var(--surface-2); color:var(--ink);
    border:1px solid var(--line); border-radius:10px;
    font:inherit; font-size:14px; appearance:none; -webkit-appearance:none;
  }
  /* ============================================================
     MODALITA IMMERSIVA DELLA CORSA
     ============================================================
     Una mappa sola nel documento. Lo stato A (schermo pieno) e lo stato B
     (quadranti, mappa piccola) sono lo STESSO nodo con un transform diverso:
     niente dissolvenza fra due set di tessere, niente seconda figura, niente
     offset in pixel cablati su uno schermo preciso.
     Si animano solo transform e opacity. Nessun filter, nessun drop-shadow,
     nessuna prospettiva: il progetto ha gia rifiutato WebGL per il consumo
     durante una seduta di mezz'ora a schermo acceso, e un piano inclinato con
     le tessere dentro costa quanto quello senza esserlo.
     ============================================================ */
  .imm{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:hidden}
  .imm[hidden]{display:none}
  body.in-imm{overflow:hidden}
  body.in-imm .tabs{display:none}
  body.in-imm .fondo{display:none}   /* una griglia sola in scena */

  .imm-mappa{position:absolute;left:0;top:0;width:100%;height:100%;
    transform-origin:0 0;overflow:hidden;border-radius:0;background:var(--bg)}
  .imm[data-scena="b"] .imm-mappa{border-radius:14px}
  /* Il pavimento sta SEMPRE sotto le tessere: se non caricano, sotto c'e' una
     cosa disegnata invece di un buco nero. */
  .imm-griglia{position:absolute;inset:0;opacity:.55;
    background:
      repeating-linear-gradient(0deg, transparent 0 39px, var(--rete) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, var(--rete) 39px 40px)}
  .imm-tess{position:absolute;inset:0}
  .imm-tess img{position:absolute;width:256px;height:256px;
    filter:grayscale(.55) brightness(.46) contrast(1.06)}
  .imm[data-fondo="1"] .imm-tess{opacity:0}
  .imm-traccia{position:absolute;inset:0;width:100%;height:100%}
  /* Il segnalino "sei qui". Ha preso il posto della figura animata: ric la
     voleva via per far spazio alla mappa, e in cambio sparisce l unica
     animazione continua della schermata. La fase resta detta dalla parola e
     dal colore dell occhiello, che erano gia due canali su tre. */
  .imm-omino{position:absolute;left:50%;top:42%;width:26px;height:26px;
    margin:-13px 0 0 -13px;border-radius:50%;
    background:var(--accent);border:3px solid #0A0D10;
    box-shadow:0 0 0 2px rgba(22,232,160,.35)}
  .imm-omino::after{content:"";position:absolute;inset:-14px;border-radius:50%;
    background:radial-gradient(50% 50% at 50% 50%, rgba(22,232,160,.22), transparent 70%)}
  .imm[data-scena="b"] .imm-omino{width:16px;height:16px;margin:-8px 0 0 -8px;border-width:2px}
  /* Il velo: rende leggibile il testo sopra le tessere senza filtri animati.
     Nella fascia centrale non si scrive nulla, per costruzione. */
  .imm-mappa::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,
      rgba(10,13,16,.90) 0, rgba(10,13,16,.86) 14%, rgba(10,13,16,.30) 26%,
      rgba(10,13,16,.32) 54%, rgba(10,13,16,.88) 58%, rgba(10,13,16,.94) 100%)}

  /* L'HUD non riceve tocchi: schermo acceso mezz'ora col telefono addosso. */
  .imm-hud{position:absolute;inset:0;pointer-events:none;padding:0 16px}
  /* Gli unici comandi dell HUD che ricevono tocchi. Stanno a destra, in alto,
     lontani dal piede dove sta Pausa: un tocco cieco non deve cambiare zoom. */
  .imm-zoom{position:absolute;right:16px;top:96px;display:flex;flex-direction:column;gap:8px;
    pointer-events:auto}
  .imm-zoom button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
    background:rgba(10,13,16,.82);color:var(--ink);font:inherit;font-size:19px;font-weight:600;
    line-height:1;padding:0}
  .imm-zoom button[disabled]{opacity:.35}
  .imm-hud .occhiello{position:absolute;left:16px;right:16px;top:476px;
    font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .imm-hud .occhiello[data-f="run"]{color:var(--accent)}
  .imm-hud .grande{position:absolute;left:16px;right:16px;top:500px;
    font-family:var(--mono);font-weight:600;font-size:96px;line-height:.98;
    letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .imm-hud .pan{position:absolute;left:16px;right:16px;top:606px;
    display:flex;gap:10px;background:rgba(10,13,16,.90);border:1px solid var(--line);
    border-radius:14px;padding:11px 13px}
  .imm-hud .pan>div{flex:1;min-width:0}
  .imm-hud .pan .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3)}
  .imm-hud .pan .v{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--ink)}
  .imm-hud .pan .v[data-s="dentro"]{color:var(--accent)}

  /* Lo scorrimento e' nativo, con aggancio. Niente gesto scritto a mano:

  .imm-scroll{position:absolute;inset:0;z-index:2;overflow-y:scroll;
    scroll-snap-type:y mandatory;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}

  .imm-maniglia{height:44px;display:flex;align-items:center;justify-content:center}

  .imm-passo{margin-top:12px}

  .imm-banda{position:relative;height:26px;margin-top:10px;border-radius:6px;

  .imm-banda i{position:absolute;top:0;bottom:0;background:var(--accent-soft)}
  .imm-banda b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}

  /* Il piede e' FISSO e fuori dallo scroller: nessuno scorrimento accidentale
     puo togliere di vista l'unico numero su cui si agisce, e premere i tasti
     non fa scorrere niente. */
  .imm-foot{position:absolute;left:0;right:0;bottom:0;z-index:3;height:84px;
    display:flex;align-items:center;gap:12px;padding:0 16px 12px;

  @media (prefers-reduced-motion: reduce){
    .imm-scroll{scroll-behavior:auto}
  }

  .swi{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
  .swi input{width:22px;height:22px;accent-color:var(--accent);flex:none}

  /* Volume settimanale: numero, barretta con la fascia di riferimento

  .volr{display:flex;align-items:center;gap:9px;margin-bottom:7px;min-height:26px}

  .volr .vb .fascia{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.10)}
  .volr .vb .riemp{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink-3)}
  .volr .vb .riemp[data-s="dentro"]{background:var(--accent)}
  .volr .vb .riemp[data-s="tanto"]{background:var(--warn)}
  .volr .vv{flex:none;width:34px;text-align:right;font-size:13px;color:var(--ink-2)}
  .volr .vv[data-s="dentro"]{color:var(--accent)}
  .volr .vv[data-s="tanto"]{color:var(--warn)}
  .segm{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:12px;padding:4px;margin-bottom:2px}
  .segm button{
    flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;
    color:var(--ink-2);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .segm button.on{background:var(--accent);color:var(--accent-ink)}
  .crono{

    cursor:pointer;

  .varvoce .vt{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .varvoce .va{font-size:11.5px;color:var(--ink-3);margin-top:2px}

  .ses .video{border-top-color:rgba(255,255,255,.16)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ============================================================
     Seduta guidata — palette a sé, non tocca i token dell'app.
     Contrasti calcolati: bianco su blu 9,99:1 · verde su blu 7,46:1 ·
     nero su verde 14,70:1. WCAG chiede 4,5:1. Se cambi una tinta, ricalcola.
     ============================================================ */
  /* La seduta guidata resta SEMPRE notte, come l'immersiva di valore, mentre
     le altre schede seguono il tema. Stessa logica, stessa palette.
     Contrasti ricalcolati su questi colori: inchiostro su notte 16,9:1,
     smeraldo su notte 12,1:1, notte su smeraldo 11,7:1. */
  .ses{
    --blu:#0A0D10; --pan:rgba(13,18,23,0.85); --verde:#16E8A0; --su-verde:#04231A;
    position:fixed; inset:0; z-index:60; background:var(--blu); color:#EAF0EE;
    display:flex; flex-direction:column; overflow:hidden;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  }
  .ses-top{display:flex; align-items:center; gap:10px; padding:10px 16px 6px; white-space:nowrap}
  .ses-top button{
    font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    color:#fff; opacity:.75; padding:8px 6px; min-height:44px;
  }
  .ses-top .who{
    margin-left:auto; font-family:var(--mono); font-size:12px; opacity:.75;
    letter-spacing:.06em; text-transform:uppercase;
  }
  /* barra del percorso: un segmento per serie, l'unica cosa che dice quanto manca */
  .ses-bar{display:flex; gap:2px; padding:0 16px 12px; height:16px}
  .ses-bar i{flex:1; background:rgba(255,255,255,.22); border-radius:2px}
  .ses-bar i[data-f="1"]{background:var(--verde)}
  .ses-bar i[data-f="now"]{background:#fff}
  .ses-body{flex:1; overflow-y:auto; overflow-x:hidden; padding:0 16px 12px; display:flex; flex-direction:column; gap:14px}
  /* Legata alla finestra invece che a una misura fissa: su uno schermo corto
     si rimpicciolisce da sola invece di spingere fuori il pulsante Fatto. */
  .ses-body .stage{height:clamp(140px,34vh,300px); max-width:100%; aspect-ratio:auto}
  .ses-foot{padding:10px 16px 14px; display:flex; flex-direction:column; gap:9px}

  .ses h2{font-size:30px; line-height:1.1; letter-spacing:-.02em; margin:0; color:#fff}
  .ses .kicker{
    font-family:var(--mono); font-size:12px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--verde);
  }
  .ses .cue{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
  .ses .cue li{
    font-size:15.5px; line-height:1.35; padding-left:16px; position:relative; color:rgba(255,255,255,.92);
  }
  .ses .cue li::before{
    content:""; position:absolute; left:0; top:9px; width:7px; height:7px;
    border-radius:50%; background:var(--verde);
  }
  .ses .pan{background:var(--pan); border-radius:12px; padding:14px}
  .ses .pan p{color:rgba(255,255,255,.86); font-size:14px}
  .ses .pan p + p{margin-top:9px}
  .ses .fine2{font-size:12.5px; color:rgba(255,255,255,.6); line-height:1.45}

  .stage{
    background:none; border:none; box-shadow:none; border-radius:0;
    display:block; flex:none; width:100%;
    max-width:330px; margin:0 auto; aspect-ratio:1/1;
  }
  .stage .bone{stroke:#EAF0EE; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; fill:none}
  .stage .head{fill:#EAF0EE}
  /* Azzurro elettrico: l'attrezzo e una cosa diversa dal corpo, e diversa
     anche dallo stato. Il telaio della macchina sta indietro, le parti che
     si muovono col gesto (maniglie, cavo, dischi scelti) stanno avanti. */
  .stage .attr{fill:var(--ghisa); stroke:var(--ghisa)}
  .stage .macc{fill:var(--ghisa-2); stroke:none}
  .stage .macc .vivo{fill:var(--ghisa); stroke:var(--ghisa)}
  .stage .macc .telaio{fill:var(--ghisa-2)}
  /* arti del lato lontano: servono a leggere la profondita, non a competere */
  .stage .bone.lontano{opacity:.32}
  .stage .suolo{stroke:var(--accent); stroke-opacity:.32; stroke-width:1.5}

  .ses .go{
    width:100%; min-height:74px; border-radius:14px;
    background:var(--verde); color:var(--su-verde);
    font-size:22px; font-weight:700; letter-spacing:-.01em;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .ses .go:active{transform:translateY(1px)}

  }
  .ses .go.fatta{background:transparent; color:var(--verde); border:2px solid var(--verde)}
  .ses .ind{font-size:20px; min-width:44px; opacity:.9}
  .ses .ind[disabled]{opacity:.25}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
  .ses input[type=number]{
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.35);
    color:#fff; min-height:64px; font-size:26px; text-align:center;
  }
  .ses .campo{display:flex; flex-direction:column; gap:5px}
  .ses .campo span{
    font-family:var(--mono); font-size:11px; letter-spacing:.09em;
    text-transform:uppercase; color:rgba(255,255,255,.65);
  }
  .ses .cd{
    font-family:var(--mono); font-size:84px; line-height:1; font-weight:600;
    font-variant-numeric:tabular-nums; letter-spacing:-.04em; text-align:center;
    color:var(--verde); margin:6px 0;
  }
  .ses .dopo{text-align:center; font-size:15px; color:rgba(255,255,255,.8)}
  .ses .zone button{
    border:1px solid rgba(255,255,255,.4); color:#fff; background:transparent;
    border-radius:999px; padding:9px 13px; font-size:13.5px; min-height:44px;
  }
  .ses .zone button[data-on="1"]{background:var(--verde); color:var(--su-verde); border-color:var(--verde)}
  .ses table{color:#fff}
  .ses th{color:rgba(255,255,255,.6)}
  .ses td,.ses th{border-bottom-color:rgba(255,255,255,.16)}
  .ses .note{background:rgba(255,255,255,.1); border-left-color:var(--verde); color:rgba(255,255,255,.9)}
  .ses .note strong{color:#fff}
  body.in-ses{overflow:hidden}
  body.in-ses .tabs{display:none}

  /* --- attrezzi, regolazioni, fastidi --- */
  /* Scheda macchina: nessuna immagine, solo cio che non puoi vedere
     guardando l'attrezzo. La regolazione e in azzurro perche e un dato tuo
     sull'attrezzatura, come i carichi: lo smeraldo resta per "fatto". */
  .macchina{display:flex;flex-direction:column;gap:14px;margin:0 0 14px}
  .macchina .mrow{display:flex;flex-direction:column;gap:6px}
  .macchina .mval{
    font-family:var(--mono); font-size:24px; font-weight:600;
    letter-spacing:-.03em; line-height:1.15; color:var(--ghisa);
  }
  .macchina .mvuoto{font-size:14px;color:var(--ink-3)}
  .macchina .mrow > .fine + .fine{margin-top:8px}
  .macchina .passi{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;counter-reset:p}
  .macchina .passi li{
    counter-increment:p; display:grid; grid-template-columns:16px 1fr; gap:11px;
    font-size:14.5px; line-height:1.45; color:var(--ink); text-wrap:pretty;
  }
  /* Il numero e un contatore CSS: se un giorno si aggiunge un passaggio,
     la numerazione si sistema da sola invece di andare fuori posto. */
  .macchina .passi li::before{
    content:counter(p); font-family:var(--mono); font-size:12px;
    color:var(--ghisa); line-height:1.75;
  }
  .reg{display:block;margin:10px 0 2px}
  .reg span{display:block;font-size:12px;color:var(--ink-3);margin-bottom:4px}
  .reg input{width:100%;padding:10px;min-height:42px;border:1px solid var(--line-2);border-radius:var(--r);
    background:var(--surface-2);color:var(--ink);font-family:var(--sans);font-size:15px}
  .regp{color:var(--accent);font-family:var(--mono)}
  .zone{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
  .zone button{min-height:42px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);
    background:var(--surface-2);color:var(--ink-2);font-size:13px;font-family:var(--sans)}
  .zone button[data-on="1"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
</style>

<!-- Modalita immersiva della corsa. Fuori da #view di proposito: e' un

<div class="imm" id="imm" hidden>
  <div class="imm-mappa" id="immMappa">
    <i class="imm-griglia"></i>
    <div class="imm-tess" id="immTess"></div>
    <svg class="imm-traccia" id="immSvg" viewBox="0 0 375 812" preserveAspectRatio="none" aria-hidden="true">
      <path id="immD" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <div class="imm-omino" id="immOmino"></div>
  </div>

/* ============================================================

   ============================================================
   Qui c'erano prima sei fotografie della sala, poi sei disegni tecnici.
   Nessuna delle due strade funzionava, e per lo stesso motivo: l'attrezzo lo
   hai davanti agli occhi mentre leggi. Non serve vederlo su uno schermo —
   serve sapere a che foro stava il perno e in che ordine si fanno le cose.
   Quindi nessuna immagine: le tue regolazioni in grande, e i passaggi
   numerati. E l'unica versione che resta utile anche se cambi palestra.
   ============================================================ */

function schedaAttr(ex){
  var reg = S.regol[ex.id];
  var h = '<div class="macchina">';
  /* La regolazione sta in cima e grande: e la sola cosa che non puoi dedurre
     guardando l'attrezzo, e la sola che cambia da persona a persona. */
  h += '<div class="mrow">' +
    '<span class="kicker">La tua regolazione</span>' +
    (reg ? '<span class="mval">' + esc(reg) + '</span>'
         : '<span class="mvuoto">non l\'hai ancora scritta</span>') +
    '</div>';
  /* I passi numerati vengono da CUE, non da ex.how: how e prosa mista —
     tecnica nel primo paragrafo e poi il perche di quella scelta e quando
     passare al bilanciere. Numerata diventava un ordine da eseguire ("passa
     al bilanciere" come terza cosa da fare nella serie). CUE sono imperativi
     brevi, gia scritti per essere letti in piedi con un peso in mano. */
  var cue = CUE[ex.id] || [];
  if(cue.length) h += '<div class="mrow"><span class="kicker">Nell\'ordine</span><ol class="passi">' +
    cue.map(function(c){ return '<li>' + esc(c) + '</li>'; }).join("") + '</ol></div>';
  /* La prosa resta, ma sotto e senza numeri: e contesto, non istruzione.
     Le varianti aggiunte nella v2.6 non hanno ne CUE ne how — hanno una nota
     breve. Senza questo ripiego l'app CROLLAVA appena sceglievi una variante:
     trovato in collaudo, e valeva da solo tutta la batteria di prove. */
  var prosa = ex.how || (ex.k ? [ex.k] : []);
  if(prosa.length) h += '<div class="mrow">' +
    prosa.map(function(p){ return '<p class="fine">' + esc(p) + '</p>'; }).join("") +
    '</div>';
  return h + '</div>';
}

   mai stato misurato: la prima pesata dice 45. Fonte: output/alimentazione-base.md
   v3. Le calorie non cambiano — a 45 kg il mantenimento a regime e' ~2.050 e
   il target resta 2.400 — cambiano le proteine, che sono 1,6-2,2 g per kg. */
/* ============================================================
   IL PROFILO — da qui in giu' i numeri sono CALCOLATI, non scritti
   ============================================================
   Fino alla v3.3 questi cinque valori erano costanti scritte a mano, tarate
   su una persona sola. Ogni volta che il peso cambiava andavano riallineate
   a mano in cinque file, e due volte in due giorni un numero scritto nel
   testo e' sopravvissuto al cambio della costante che doveva rispecchiare.

   Ora vengono da ricalcola(), che legge il profilo e il peso piu recente.
   Verificato che con il profilo attuale (uomo, 27 anni, 160 cm, 45 kg) le
   formule restituiscano ESATTAMENTE i valori di prima: 1320 / 2050 / 2400 /
   2500 / 70 / 100. Il refactor non sposta nessun numero, li rende derivati.

   ricalcola() gira in cima a render(): costa cinque moltiplicazioni e
   garantisce che non esista mai uno stato in cui il peso e' cambiato ma i
   bersagli no.
   ============================================================ */

var KCAL_MIN, KCAL_MAX, KCAL_MANT, PROT_MIN, PROT_MAX, BASALE;

function basale(){
  var p = (S && S.profilo) || {}, kg = pesoOra();
  var eta = p.eta || 27, alt = p.altezza || 160;
  /* Mifflin-St Jeor. Il termine finale e' l'unica differenza fra i sessi. */
  return Math.round(10*kg + 6.25*alt - 5*eta + (p.sesso === "f" ? -161 : 5));
}
function ricalcola(){
  BASALE = basale();
  var kg = pesoOra();
  /* 1,55 = cinque allenamenti a settimana. Arrotondamenti a 50 kcal e a 5 g:
     una precisione maggiore sarebbe finta, visto che l'equazione stessa e'
     una stima e il numero vero emerge dalla media del peso. */
  KCAL_MANT = Math.round(BASALE * 1.55 / 50) * 50;
  KCAL_MIN  = Math.round((Math.round(BASALE * 1.55) + 350) / 50) * 50;
  KCAL_MAX  = KCAL_MIN + 100;
  PROT_MIN  = Math.round(kg * 1.6 / 5) * 5;
  PROT_MAX  = Math.round(kg * 2.2 / 5) * 5;
}

/* Riempie i campi che una versione piu vecchia non aveva e riallinea v.

function migra(o){
  var base = fresh();
  for(var k in base){ if(!(k in o) || o[k] == null) o[k] = base[k]; }
  /* Da 1 a 2: i campi entrati dopo che SCHEMA era stato fissato — lastExport,
     mieiCibi, serie, ordine, ordineBase, streSel, kw. Il ciclo qui sopra li
     riempie gia' da fresh(), quindi il passaggio non richiede altro codice.
     Il numero sale lo stesso, ed e' il punto: un campo nuovo nello stato e'
     un incremento di SCHEMA, sempre, anche quando la migrazione e' banale.
     Altrimenti il numero smette di significare qualcosa — ed era successo. */
  o.v = SCHEMA;
  return o;

var KEY_BK = "palestra-copie";

    /* si salva lo stato COM'ERA all'apertura, non quello che scriverai oggi:
       serve a tornare indietro, e tornare a com'era stamattina e' l'utile */
    c.push({ d:d, s:JSON.stringify(S) });

  var c = copie(), v = null;
  c.forEach(function(x){ if(x.d === d) v = x.s; });
  if(!v) return false;

/* ============================================================

   ============================================================

   Non e' un difetto dell'app: la chiave non e' mai cambiata in nessuna
   versione pubblicata e nessuna riga di codice azzera niente — e' iOS che
   fa pulizia quando gli pare. Finche' i dati stavano solo li', ogni
   sparizione era definitiva, e il rimedio era un pulsante di backup che
   bisognava ricordarsi di premere. Un'app normale non lo chiede.

   COM'E' FATTA. Un repository GitHub PRIVATO fa da cartella; dentro un solo
   file, stato.json. Ogni salvataggio e' un commit, quindi la storia e'
   completa e per sempre — non sette copie che scorrono via: tutto.

   QUATTRO REGOLE, in ordine di importanza.

   1. PRIMA IL TELEFONO. save() scrive in locale e ritorna subito. La rete
      viene dopo, in sottofondo. Un'app che si pianta a meta' serie perche'
      manca il campo sarebbe peggio di quella di prima.
   2. NON SOVRASCRIVE MAI, FONDE. E' il punto pericoloso di tutta la
      faccenda: se il telefono si fosse svuotato e pubblicasse il suo stato
      vuoto, distruggerebbe i dati veri. Si LEGGE sempre prima di scrivere,

   4. NESSUN PULSANTE. Una riga in testa dice come sta, e non chiede niente.
