<title>Palestra — settimane 1-4</title>
<style>
  /* ============================================================
     Palette presa da "valore" (finanza-personale/valore/stile.css), per
     famiglia visiva fra i due progetti. Valori dal codice, non dal documento.
     Concetto: Osservatorio — fondo notte, pannelli di vetro che ci galleggiano
     sopra, smeraldo come firma. La notte e il default, come li.
     REGOLA VINCOLANTE di valore: il verde-firma non coincide col verde-stato,
     altrimenti il cervello confonde decorazione e stato.
     Firma #16E8A0 · stato ok #97C459. Non avvicinarli.
     ============================================================ */
  :root{
    --bg:#0A0D10; --surface:rgba(13,18,23,0.85);
    --surface-2:rgba(255,255,255,0.04); --surface-3:rgba(255,255,255,0.09);
    --ink:#EAF0EE; --ink-2:#B6C3C7; --ink-3:#93A4AE;
    --line:rgba(255,255,255,0.10); --line-2:rgba(234,240,238,0.22);
    --accent:#16E8A0; --accent-ink:#04231A; --accent-soft:rgba(22,232,160,0.14);
    --ochre:#16E8A0; --ochre-soft:rgba(22,232,160,0.14);
    --ok:#97C459; --ok-soft:rgba(151,196,89,0.16);
    --warn:#EF9F27;
    --bad:#E24B4A; --bad-soft:rgba(226,75,74,0.16);
    /* Azzurro elettrico: la ghisa e le macchine. Non e un colore di stato —
       lo smeraldo resta l'unico che vuol dire qualcosa. --ghisa e cio che si
       muove col tuo gesto, --ghisa-2 il telaio che sta fermo. */
    --ghisa:#2E8BFF; --ghisa-2:#1B4C86;
    --ombra:0 8px 30px rgba(0,0,0,0.4);
    --alone:0 14px 36px rgba(0,0,0,0.28), 0 0 22px rgba(22,232,160,0.18);
    --rete:rgba(22,232,160,0.14); --alone-oriz:rgba(22,232,160,0.13);
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --r:16px;
  }
  :root[data-theme="dark"]{
    --bg:#0A0D10; --surface:rgba(13,18,23,0.85);
    --surface-2:rgba(255,255,255,0.04); --surface-3:rgba(255,255,255,0.09);
    --ink:#EAF0EE; --ink-2:#B6C3C7; --ink-3:#93A4AE;
    --line:rgba(255,255,255,0.10); --line-2:rgba(234,240,238,0.22);
    --accent:#16E8A0; --accent-ink:#04231A; --accent-soft:rgba(22,232,160,0.14);
    --ochre:#16E8A0; --ochre-soft:rgba(22,232,160,0.14);
    --ok:#97C459; --ok-soft:rgba(151,196,89,0.16);
    --warn:#EF9F27;
    --bad:#E24B4A; --bad-soft:rgba(226,75,74,0.16);
    --ghisa:#2E8BFF; --ghisa-2:#1B4C86;
    --ombra:0 8px 30px rgba(0,0,0,0.4);
    --alone:0 14px 36px rgba(0,0,0,0.28), 0 0 22px rgba(22,232,160,0.18);
    --rete:rgba(22,232,160,0.14); --alone-oriz:rgba(22,232,160,0.13);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.5;
    -webkit-text-size-adjust:100%;
    padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));
  }
  #app{max-width:560px;margin:0 auto; position:relative; z-index:1}

  /* ---------- fondale in profondita ----------
     Un pavimento che scorre verso di te, in prospettiva: le tessere smettono
     di stare su una parete piatta e galleggiano sopra uno spazio.
     E CSS 3D e non WebGL per un motivo preciso: durante la seduta lo schermo
     resta acceso col wake lock, e un contesto WebGL che gira per un'ora di
     palestra si mangia la batteria. Qui si animano solo transform e opacity,
     quindi il lavoro lo fa la GPU e il thread principale resta ai timer. */
  .fondo{
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
    perspective:640px; perspective-origin:50% 30%;
    -webkit-mask-image:linear-gradient(to bottom, transparent 24%, #000 42%, #000 90%, transparent);
    mask-image:linear-gradient(to bottom, transparent 24%, #000 42%, #000 90%, transparent);
  }
  .fondo .piano{
    position:absolute; left:-70%; right:-70%; top:30%; bottom:-70%;
    transform:rotateX(69deg); transform-origin:50% 0;
  }
  .fondo .griglia{
    position:absolute; inset:-64px 0 0 0;
    background-image:
      repeating-linear-gradient(to right, var(--rete) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(to bottom, var(--rete) 0 1px, transparent 1px 64px);
    animation:scorre 9s linear infinite;
  }
  @keyframes scorre{from{transform:translate3d(0,0,0)} to{transform:translate3d(0,64px,0)}}
  .fondo .orizz{
    position:absolute; left:50%; top:30%; width:160%; height:260px;
    transform:translate(-50%,-70%);
    background:radial-gradient(50% 50% at 50% 50%, var(--alone-oriz), transparent 72%);
    animation:respiro 13s ease-in-out infinite;
  }
  @keyframes respiro{0%,100%{opacity:.5} 50%{opacity:1}}
  /* Durante la seduta il pannello copre tutto e lo schermo e forzato acceso:
     far girare il fondale sotto una cosa che non si vede e solo batteria. */
  body.in-ses .fondo .griglia, body.in-ses .fondo .orizz{animation-play-state:paused}

  /* ---------- testata ---------- */
  .top{
    position:sticky; top:0; z-index:30;
    background:var(--bg); border-bottom:1px solid var(--line);
    padding:10px 16px 8px; display:flex; align-items:baseline; gap:10px;
  }
  .top h1{font-size:15px;font-weight:650;margin:0;letter-spacing:-.01em}
  .top .wk{
    margin-left:auto; font-family:var(--mono); font-size:12px;
    color:var(--ink-2); letter-spacing:.04em; text-transform:uppercase;
  }

  main{padding:14px 16px 24px; display:flex; flex-direction:column; gap:14px}

  /* ---------- blocchi ---------- */
  /* I pannelli di "vetro" di valore: galleggiano sul fondo notte, si sollevano
     di 3px e si illuminano di smeraldo quando li tocchi. Stessi valori. */
  .card, .today, .ex, .runner{
    box-shadow:var(--ombra);
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease, opacity .6s ease;
  }
  .card:hover, .today:hover, .ex:hover, .runner:hover{
    transform:translateY(-3px); border-color:var(--accent-soft); box-shadow:var(--alone);
  }
  .card:active, .ex:active{transform:translateY(-1px)}
  /* dissolvenza in entrata. In valore e una coppia di classi perche il DOM resta;
     qui render() ricostruisce la vista ogni volta, quindi basta l'animazione:
     riparte da sola a ogni cambio di scheda e non puo lasciare niente nascosto. */
  /* --dx la scrive render(): la vista entra dal lato da cui sei arrivato. */
  @keyframes entra{
    from{opacity:0; transform:translate3d(var(--dx,0px),6px,0)}
    to{opacity:1; transform:none}
  }
  .card, .today, .ex, .runner, .ses{animation:entra .45s cubic-bezier(.2,.8,.2,1) both}
  .ses{animation-duration:.34s}
  /* Scaglionate: l'occhio segue l'ordine di lettura invece di ricevere tutto
     in faccia. Oltre la quinta il ritardo si sentirebbe come lentezza. */
  #view > *:nth-child(2){animation-delay:.05s}
  #view > *:nth-child(3){animation-delay:.10s}
  #view > *:nth-child(4){animation-delay:.15s}
  #view > *:nth-child(5){animation-delay:.20s}
  /* le barre si riempiono invece di saltare al valore */
  @keyframes riempi{from{transform:scaleX(0)} to{transform:scaleX(1)}}
  /* i grafici si tracciano da sinistra a destra */
  @keyframes traccia{from{stroke-dashoffset:1} to{stroke-dashoffset:0}}
  @keyframes appari{from{opacity:0} to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.4)} to{opacity:1;transform:none}}
  /* Cinque pallini che compaiono in fila: si conta con l'occhio, non leggendo. */
  .pallini i{animation:pop .3s cubic-bezier(.34,1.56,.64,1) both}
  .pallini i:nth-child(2){animation-delay:.04s}
  .pallini i:nth-child(3){animation-delay:.08s}
  .pallini i:nth-child(4){animation-delay:.12s}
  .pallini i:nth-child(5){animation-delay:.16s}
  /* Conferma di una serie: e il gesto che si ripete 21 volte a seduta, con le
     mani sudate e senza guardare. Il rimbalzo dice "preso" prima che si legga
     qualsiasi cosa. E l'unico rimbalzo di tutta l'app, e sta qui di proposito. */
  @keyframes botto{0%{transform:scale(1)} 38%{transform:scale(1.22)} 100%{transform:scale(1)}}
  @keyframes anello{from{transform:scale(.6);opacity:.8} to{transform:scale(2.1);opacity:0}}
  .botto{animation:botto .42s cubic-bezier(.34,1.56,.64,1)}
  /* L'anello nasce al centro di cio che hai toccato e muore fuori: non occupa
     spazio, non sposta niente, non si puo toccare. */
  .anello{
    position:fixed;z-index:60;pointer-events:none;border-radius:50%;
    border:2px solid var(--accent); animation:anello .6s ease-out forwards;
  }

  .card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r); padding:15px;
  }
  .card > * + *{margin-top:10px}
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.09em;
    text-transform:uppercase; color:var(--ink-3);
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
  h2{font-size:19px;line-height:1.25;margin:0;font-weight:640;text-wrap:balance;letter-spacing:-.015em}
  h3{font-size:15px;margin:0;font-weight:620;letter-spacing:-.01em}
  p{margin:0;color:var(--ink-2);font-size:14px}
  .fine{font-size:12.5px;color:var(--ink-3);line-height:1.45}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------- controlli ---------- */
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    min-height:44px;padding:0 16px;border-radius:8px;
    background:var(--surface-2);border:1px solid var(--line-2);
    font-size:15px;font-weight:560;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.food{background:var(--ochre);border-color:var(--ochre);color:var(--bg)}
  .btn.ghost{background:transparent}
  .btn.wide{width:100%}
  .btn.sm{min-height:34px;padding:0 11px;font-size:13.5px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  input[type=number],input[type=date],input[type=text]{
    font:inherit;font-family:var(--mono);font-variant-numeric:tabular-nums;
    background:var(--surface-2);color:var(--ink);
    border:1px solid var(--line-2);border-radius:7px;
    padding:8px 9px;min-height:42px;width:100%;
  }
  input[type=number]{-moz-appearance:textfield;text-align:center}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  .stepper{display:flex;align-items:stretch;gap:0;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;background:var(--surface-2)}
  .stepper button{width:38px;flex:none;font-size:19px;color:var(--ink-2);background:var(--surface-3)}
  .stepper button:active{background:var(--accent-soft);color:var(--accent)}
  .stepper input{border:none;border-radius:0;background:transparent;min-height:42px;width:100%;padding:0}

  /* ---------- pillole di stato ---------- */
  .pill{
    display:inline-flex;align-items:center;gap:5px;
    font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);
  }
  .pill.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
  .pill.up{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
  .pill.alert{background:var(--bad-soft);border-color:transparent;color:var(--bad)}

  /* ---------- avvisi ---------- */
  .note{
    border-left:3px solid var(--accent);background:var(--accent-soft);
    padding:11px 13px;border-radius:0 8px 8px 0;font-size:13.5px;color:var(--ink-2);
  }
  .note strong{color:var(--ink)}
  /* Regola di valore: il rosso e una scorciatoia all'amigdala, rosso ovunque
     vuol dire ansia costante. Resta solo per gli allarmi veri — dolore che
     torna tre volte, dati che non si salvano. Tutto il resto e ambra. */
  .note.alert{border-color:var(--bad);background:var(--bad-soft)}
  .note.warn{border-color:var(--warn);background:rgba(239,159,39,0.13)}

  /* ---------- oggi ---------- */
  .today{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:16px;display:flex;flex-direction:column;gap:12px;
  }
  .today .date{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink-3);
  }
  .today h2{font-size:26px}
  .checklist{display:flex;flex-direction:column;gap:2px}
  .check{
    display:flex;align-items:center;gap:11px;padding:9px 2px;
    border-bottom:1px solid var(--line);text-align:left;width:100%;
  }
  .checklist .check:last-child{border-bottom:none}
  .box{
    width:22px;height:22px;flex:none;border:1.5px solid var(--line-2);border-radius:5px;
    display:grid;place-items:center;font-size:13px;color:transparent;
  }
  .check[data-on="1"] .box{background:var(--ok);border-color:var(--ok);color:#fff}
  .check[data-on="1"] .lbl{color:var(--ink-3);text-decoration:line-through}
  .lbl{font-size:14.5px;flex:1}
  .sub{font-size:12px;color:var(--ink-3);display:block;text-decoration:none!important}

  /* ---------- esercizi ---------- */
  .ex{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
  .ex + .ex{margin-top:10px}
  .ex-h{padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
  .ex-h .idx{
    font-family:var(--mono);font-size:12px;color:var(--ink-3);
    padding-top:2px;min-width:16px;
  }
  .ex-h .meta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .ex-body{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
  .set{display:grid;grid-template-columns:52px 1fr 1fr 46px;gap:7px;align-items:center}
  .set .sn{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
  .set .tick{
    min-height:42px;border:1px solid var(--line-2);border-radius:7px;
    background:var(--surface-2);display:grid;place-items:center;font-size:16px;color:var(--ink-3);
  }
  .set[data-done="1"] .tick{background:var(--ok);border-color:var(--ok);color:#fff}
  /* proposta non ancora confermata: numero in grigio, si distingue da un dato vero */
  .set[data-prop="1"] input{color:var(--ink-3)}
  .set[data-prop="1"] .tick{border-color:var(--accent);color:var(--accent)}
  .set-head{display:grid;grid-template-columns:52px 1fr 1fr 46px;gap:7px}
  .set-head span{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:center}
  .set-head span:first-child{text-align:left}
  .how{
    font-size:13.5px;color:var(--ink-2);line-height:1.55;
    background:var(--surface-2);border-top:1px solid var(--line);padding:12px 14px;
  }
  .how p + p{margin-top:8px}

  /* ---------- spiegazioni richiudibili ----------
     Le ragioni contano, ma non ogni volta: in sala pesi si legge la riga che
     dice cosa fare, il perche si apre quando serve. Nessun testo e stato
     tagliato — e tutto qui dentro, coi numeri e le fonti intatte.
     <details> nativo: si apre senza JS, e leggibile dai lettori di schermo,
     e resta aperto finche non lo richiudi. */
  .perche{border-top:1px solid var(--line);margin-top:10px;padding-top:2px}
  .perche summary{
    list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
    min-height:44px;font-size:13.5px;color:var(--ink-3);
  }
  .perche summary::-webkit-details-marker{display:none}
  /* Il testo va in uno span: un nodo di testo nudo in un flex si restringe
     e va a capo anche con mezzo schermo libero. */
  .perche summary > span{flex:1;min-width:0}
  .perche summary::after{
    content:"›";margin-left:auto;font-size:17px;line-height:1;
    transition:transform .18s ease;
  }
  .perche[open] summary::after{transform:rotate(90deg)}
  .perche[open] summary{color:var(--ink-2)}
  .perche > p{margin:0 0 10px}
  .perche > p:first-of-type{margin-top:2px}
  /* Dentro la seduta guidata il fondo e smeraldo pieno: la riga e il chevron
     vanno sul bianco, altrimenti sparisce tutto. */
  .perche.su-blu{border-top-color:rgba(255,255,255,.28)}
  .perche.su-blu summary{color:rgba(255,255,255,.82)}
  .perche.su-blu[open] summary{color:#fff}

  /* ---------- timer riposo ---------- */
  .rest{
    position:fixed;left:0;right:0;z-index:40;
    bottom:calc(60px + env(safe-area-inset-bottom,0px));
    /* pannello di vetro con lo smeraldo sul numero, non un blocco pieno:
       sta a schermo per minuti interi e in tinta unita e troppo rumore */
    background:var(--surface);color:var(--ink);
    /* Il bordo e il BINARIO su cui corre la riga del riposo, quindi va spento:
       con lo smeraldo su tutta la larghezza la riga che si accorcia sopra era
       invisibile, sotto restava una linea piena dello stesso colore. */
    border-top:2px solid var(--line-2); box-shadow:var(--ombra);
    padding:9px 16px;display:flex;align-items:center;gap:12px;
    max-width:560px;margin:0 auto;
  }
  /* l'attributo hidden nasconde con display:none, ma il display:flex qui sopra
     lo batteva per specificita: la barra restava a schermo con 0:00 sempre */
  .rest[hidden]{display:none}
  /* Riparte ogni volta che torna visibile: passando da display:none a flex
     le animazioni ricominciano da sole, senza toccarla da JS. */
  .rest{animation:daSotto .34s cubic-bezier(.2,.8,.2,1)}
  @keyframes daSotto{from{transform:translate3d(0,100%,0)} to{transform:none}}
  /* Il tempo che resta, senza leggere il numero: la riga si accorcia da destra.
     Sta SOPRA il bordo smeraldo, quindi non aggiunge altezza alla fascetta. */
  .rest .ln{
    position:absolute;left:0;top:-2px;height:2px;background:var(--accent);
    width:100%;transform-origin:left center;
  }
  .rest .t{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
  .rest .w{flex:1;font-size:12.5px;color:var(--ink-2);line-height:1.3}
  .rest button{
    border:1px solid var(--line-2);border-radius:6px;padding:6px 10px;
    font-size:12.5px;font-family:var(--mono);color:var(--ink-2);
  }

  /* ---------- timer corsa ---------- */
  .runner{text-align:center;padding:22px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
  .runner .phase{
    font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  }
  .runner .big{
    font-family:var(--mono);font-size:66px;line-height:1;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:8px 0 4px;
  }
  /* era [data-kind="corsa"] e non corrispondeva mai: le fasi si chiamano run/walk */
  .runner[data-kind="run"] .big, .runner[data-kind="run"] .phase{color:var(--accent)}
  .figcorsa{max-width:220px; margin:2px auto 8px}
  .figcorsa .stage{background:none; border:none}
  .figcorsa .stage .bone{stroke:var(--ink)}
  .figcorsa .stage .head{fill:var(--ink)}
  .figcorsa .stage .suolo{stroke:var(--accent); stroke-opacity:.3}
  .runner[data-kind="run"] .figcorsa .stage .bone{stroke:var(--accent)}
  .runner[data-kind="run"] .figcorsa .stage .head{fill:var(--accent)}
  .runner .of{font-family:var(--mono);font-size:13px;color:var(--ink-3)}
  .track{display:flex;gap:3px;margin:14px 0 4px;height:8px}
  .track i{flex:1;background:var(--surface-3);border-radius:2px}
  .track i[data-s="run"]{background:var(--accent);opacity:.28}
  .track i[data-s="run"][data-p="1"]{opacity:1}
  .track i[data-s="walk"][data-p="1"]{background:var(--line-2)}

  /* ---------- barre ---------- */
  .gauge{display:flex;flex-direction:column;gap:6px}
  .gauge .lab{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--ink-2)}
  .gauge .lab b{font-family:var(--mono);font-size:17px;color:var(--ink);font-weight:600}
  .gauge .lab .goal{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
  .bar{position:relative;height:18px;background:var(--surface-3);border-radius:4px;overflow:hidden}
  .bar .fill{
    position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.9;
    transform-origin:left center; animation:riempi .6s cubic-bezier(.2,.8,.2,1);
  }
  /* Regola di valore: il colore dice lo STATO, non la categoria. Sotto il
     bersaglio e sopra il bersaglio sono due stati diversi, e si vedono. */
  .bar .fill[data-s="sotto"]{background:var(--warn)}
  .bar .fill[data-s="dentro"]{background:var(--ok)}
  .bar .fill[data-s="sopra"]{background:var(--warn)}
  .bar .zone{position:absolute;top:0;bottom:0;border-left:1px solid var(--ink-3);border-right:1px solid var(--ink-3);opacity:.5}
  .bar.blue .fill{background:var(--accent)}
  .ticks{display:flex;height:5px;gap:0}
  .ticks i{flex:1;border-left:1px solid var(--line-2)}
  .ticks i:first-child{border-left:none}

  /* ---------- cibo ---------- */
  .foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:7px}
  /* NB: questa classe e dei bottoni-alimento dentro la scheda Cibo. Non darla
     ad altro: il pulsante CIBO della barra in basso l'aveva, e si ritrovava
     addosso bordo, sfondo e padding di un bottone-alimento. */
  .food{
    text-align:left;border:1px solid var(--line-2);border-radius:8px;
    background:var(--surface-2);padding:9px 10px;min-height:56px;
  }
  .food:active{background:var(--ochre-soft);border-color:var(--ochre)}
  .food .fn{font-size:13.5px;line-height:1.25;display:block}
  .food .fv{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:3px;display:block}
  .eaten{display:flex;flex-direction:column;gap:1px}
  .eaten .e{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
  .eaten .e:last-child{border-bottom:none}
  .eaten .e .en{flex:1;min-width:0}
  .eaten .e .qt{color:var(--accent);font-family:var(--mono);font-size:12.5px}
  .eaten .e .v{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
  /* mezza porzione e doppia porzione, sulla voce gia inserita */
  .qb{display:flex;flex:none;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
  .qb button{width:32px;min-height:32px;font-size:16px;color:var(--ink-2);background:var(--surface-2)}
  .qb button:active{background:var(--accent-soft);color:var(--accent)}
  /* i cibi tuoi: bottone piu la crocetta per toglierli dall'elenco */
  .mio{position:relative}
  .mio .food{width:100%;padding-right:30px}
  .delmio{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:6px;
    color:var(--ink-3);font-size:15px;display:grid;place-items:center}
  .delmio:active{background:var(--bad-soft);color:var(--bad)}
  .eaten .e .x{width:30px;height:30px;flex:none;border-radius:6px;color:var(--ink-3);font-size:17px;display:grid;place-items:center}

  /* ---------- tabelle e grafici ---------- */
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--ink-3);font-weight:500;
  }
  td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
  svg.chart{width:100%;height:auto;display:block}

  .tag{
    display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-3);
  }
  hr{border:none;border-top:1px solid var(--line);margin:2px 0}
  textarea{
    width:100%;min-height:110px;font-family:var(--mono);font-size:12px;
    background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2);
    border-radius:7px;padding:9px;
  }

  /* ---------- navigazione ---------- */
  .tabs{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    max-width:560px;margin:0 auto;
    display:grid;grid-template-columns:repeat(5,1fr);
    background:linear-gradient(var(--surface),var(--surface)), var(--bg);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .tabs button{
    padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-3);border-top:2px solid transparent;margin-top:-1px;
  }
  .tabs button .g{width:20px;height:20px;display:block}
  /* L'evidenziatore restava incollato all'ultima scheda toccata: era lo stato
     di focus che il browser lascia dopo il tocco, non la scheda corrente. */
  .tabs button{-webkit-tap-highlight-color:transparent; background:transparent}
  .tabs button:focus{outline:none}
  .tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:-3px}
  .tabs button[aria-current="page"]{
    color:var(--accent); background:var(--accent-soft);
  }
  /* Un solo trattino che scorre da una scheda all'altra invece di cinque bordi
     che si accendono e spengono: si vede da dove vieni. --i lo scrive render(). */
  .tabs .cursore{
    position:absolute; top:-1px; left:0; height:2px; width:20%;
    background:var(--accent); border-radius:1px;
    transform:translate3d(calc(var(--i,0) * 100%),0,0);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
  }
  body.in-ses .tabs .cursore{display:none}

  /* ---------- tessere-dato ---------- */
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .tile{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:12px; display:flex; flex-direction:column; gap:7px; min-height:132px;
    box-shadow:var(--ombra); animation:entra .45s ease both;
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .tile:hover{transform:translateY(-3px); border-color:var(--accent-soft); box-shadow:var(--alone)}
  .tile .th{display:flex; align-items:center; gap:8px}
  .tile .ico{
    width:28px; height:28px; border-radius:9px; background:var(--accent-soft);
    display:grid; place-items:center; flex:none;
  }
  .tile .ico svg{width:15px; height:15px; stroke:var(--accent); fill:none; stroke-width:1.8;
    stroke-linecap:round; stroke-linejoin:round}
  .tile .tl{font-size:12.5px; color:var(--ink-2); line-height:1.2}
  .tile .tv{
    font-family:var(--mono); font-size:27px; font-weight:600;
    letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums;
  }
  .tile .tv small{font-size:12.5px; color:var(--ink-3); font-weight:500; margin-left:3px; letter-spacing:0}
  .tile .tf{
    display:flex; align-items:center; gap:6px; margin-top:auto;
    font-size:11.5px; color:var(--ink-3);
  }
  .pill-sm{
    font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 7px; border-radius:999px; background:var(--surface-3); color:var(--ink-2); flex:none;
  }
  .pill-sm.ok{background:var(--ok-soft); color:var(--ok)}
  .pill-sm.warn{background:rgba(239,159,39,.16); color:var(--warn)}
  .spark{width:100%; height:32px; display:block; overflow:visible}

  /* ---------- saluto ---------- */
  .saluto{display:flex; align-items:center; gap:10px}
  .saluto h2{font-size:25px}
  .oggi-cosa{font-size:16px; color:var(--ink-2); margin-top:3px}
  .oggi-cosa strong{color:var(--accent)}
  .figmini{width:118px; flex:none; margin-left:auto}
  .figmini .stage{background:none; border:none; box-shadow:none}
  .figmini .stage .bone{stroke:var(--ink)}
  .figmini .stage .head{fill:var(--ink)}
  .figmini .stage .suolo{stroke:var(--accent); stroke-opacity:.3}
  .figmini .stage .attr{fill:var(--ghisa); stroke:var(--ghisa)}
  .figmini .stage .macc{fill:var(--ghisa-2)}
  .riga-dati{font-size:13px; color:var(--ink-3); letter-spacing:.01em}
  .card.riga{display:flex; align-items:center; gap:12px}
  .pallini{display:flex; align-items:center; gap:5px; margin-top:5px}
  .pallini i{width:9px; height:9px; border-radius:50%; background:var(--surface-3)}
  .pallini i[data-on="1"]{background:var(--ok)}
  .pallini .num{margin-left:5px; font-size:12.5px; color:var(--ink-3)}

  /* ---------- calendario del programma ---------- */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal .dow{
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-3);text-align:center;padding-bottom:2px;
  }
  .cal .dd{
    aspect-ratio:1/1;border-radius:7px;border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-family:var(--mono);font-size:12px;color:var(--ink-2);background:var(--surface-2);
  }
  .cal .dd[data-t="pesi"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
  .cal .dd[data-t="corsa"]{background:var(--surface-3);border-color:transparent}
  .cal .dd[data-oggi="1"]{outline:2px solid var(--ink);outline-offset:1px}
  .cal .dd[data-sel="1"]{outline:2px solid var(--accent);outline-offset:1px;background:var(--accent-soft)}
  .cal .dd:active{transform:scale(.94)}
  .chiudi{margin-left:auto;width:28px;height:28px;border-radius:7px;flex:none;
    color:var(--ink-3);font-size:18px;display:grid;place-items:center}
  .chiudi:active{background:var(--surface-3);color:var(--ink)}
  .cal .dd i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45;font-style:normal}
  .cal .dd[data-fatto="1"] i{background:var(--ok);opacity:1;width:8px;height:8px}
  .calleg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
  .calleg span{display:inline-flex;align-items:center;gap:5px}
  .calleg b{width:11px;height:11px;border-radius:3px;display:inline-block}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ============================================================
     Seduta guidata — palette a sé, non tocca i token dell'app.
     Contrasti calcolati: bianco su blu 9,99:1 · verde su blu 7,46:1 ·
     nero su verde 14,70:1. WCAG chiede 4,5:1. Se cambi una tinta, ricalcola.
     ============================================================ */
  /* La seduta guidata resta SEMPRE notte, come l'immersiva di valore, mentre
     le altre schede seguono il tema. Stessa logica, stessa palette.
     Contrasti ricalcolati su questi colori: inchiostro su notte 16,9:1,
     smeraldo su notte 12,1:1, notte su smeraldo 11,7:1. */
  .ses{
    --blu:#0A0D10; --pan:rgba(13,18,23,0.85); --verde:#16E8A0; --su-verde:#04231A;
    position:fixed; inset:0; z-index:60; background:var(--blu); color:#EAF0EE;
    display:flex; flex-direction:column; overflow:hidden;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  }
  .ses-top{display:flex; align-items:center; gap:10px; padding:10px 16px 6px; white-space:nowrap}
  .ses-top button{
    font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    color:#fff; opacity:.75; padding:8px 6px; min-height:44px;
  }
  .ses-top .who{
    margin-left:auto; font-family:var(--mono); font-size:12px; opacity:.75;
    letter-spacing:.06em; text-transform:uppercase;
  }
  /* barra del percorso: un segmento per serie, l'unica cosa che dice quanto manca */
  .ses-bar{display:flex; gap:2px; padding:0 16px 12px; height:16px}
  .ses-bar i{flex:1; background:rgba(255,255,255,.22); border-radius:2px}
  .ses-bar i[data-f="1"]{background:var(--verde)}
  .ses-bar i[data-f="now"]{background:#fff}
  .ses-body{flex:1; overflow-y:auto; overflow-x:hidden; padding:0 16px 12px; display:flex; flex-direction:column; gap:14px}
  /* Legata alla finestra invece che a una misura fissa: su uno schermo corto
     si rimpicciolisce da sola invece di spingere fuori il pulsante Fatto. */
  .ses-body .stage{height:clamp(140px,34vh,300px); max-width:100%; aspect-ratio:auto}
  .ses-foot{padding:10px 16px 14px; display:flex; flex-direction:column; gap:9px}

  .ses h2{font-size:30px; line-height:1.1; letter-spacing:-.02em; margin:0; color:#fff}
  .ses .kicker{
    font-family:var(--mono); font-size:12px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--verde);
  }
  .ses .cue{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
  .ses .cue li{
    font-size:15.5px; line-height:1.35; padding-left:16px; position:relative; color:rgba(255,255,255,.92);
  }
  .ses .cue li::before{
    content:""; position:absolute; left:0; top:9px; width:7px; height:7px;
    border-radius:50%; background:var(--verde);
  }
  .ses .pan{background:var(--pan); border-radius:12px; padding:14px}
  .ses .pan p{color:rgba(255,255,255,.86); font-size:14px}
  .ses .pan p + p{margin-top:9px}
  .ses .fine2{font-size:12.5px; color:rgba(255,255,255,.6); line-height:1.45}

  .stage{
    background:none; border:none; box-shadow:none; border-radius:0;
    display:block; flex:none; width:100%;
    max-width:330px; margin:0 auto; aspect-ratio:1/1;
  }
  .stage .bone{stroke:#EAF0EE; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; fill:none}
  .stage .head{fill:#EAF0EE}
  /* Azzurro elettrico: l'attrezzo e una cosa diversa dal corpo, e diversa
     anche dallo stato. Il telaio della macchina sta indietro, le parti che
     si muovono col gesto (maniglie, cavo, dischi scelti) stanno avanti. */
  .stage .attr{fill:var(--ghisa); stroke:var(--ghisa)}
  .stage .macc{fill:var(--ghisa-2); stroke:none}
  .stage .macc .vivo{fill:var(--ghisa); stroke:var(--ghisa)}
  .stage .macc .telaio{fill:var(--ghisa-2)}
  /* arti del lato lontano: servono a leggere la profondita, non a competere */
  .stage .bone.lontano{opacity:.32}
  .attrezzo{text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-3);margin-top:8px}
  .ses .attrezzo{color:rgba(255,255,255,.65)}
  .stage .suolo{stroke:var(--accent); stroke-opacity:.32; stroke-width:1.5}

  .ses .go{
    width:100%; min-height:74px; border-radius:14px;
    background:var(--verde); color:var(--su-verde);
    font-size:22px; font-weight:700; letter-spacing:-.01em;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .ses .go:active{transform:translateY(1px)}
  .ses .alt{
    width:100%; min-height:48px; border-radius:10px; color:#fff;
    border:1px solid rgba(255,255,255,.4); font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .ses .go.fatta{background:transparent; color:var(--verde); border:2px solid var(--verde)}
  .ses .ind{font-size:20px; min-width:44px; opacity:.9}
  .ses .ind[disabled]{opacity:.25}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
  .ses .duo{display:flex; gap:9px}
  .ses .duo > *{flex:1}
  .ses input[type=number]{
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.35);
    color:#fff; min-height:64px; font-size:26px; text-align:center;
  }
  .ses .campo{display:flex; flex-direction:column; gap:5px}
  .ses .campo span{
    font-family:var(--mono); font-size:11px; letter-spacing:.09em;
    text-transform:uppercase; color:rgba(255,255,255,.65);
  }
  .ses .cd{
    font-family:var(--mono); font-size:84px; line-height:1; font-weight:600;
    font-variant-numeric:tabular-nums; letter-spacing:-.04em; text-align:center;
    color:var(--verde); margin:6px 0;
  }
  .ses .dopo{text-align:center; font-size:15px; color:rgba(255,255,255,.8)}
  .ses .zone button{
    border:1px solid rgba(255,255,255,.4); color:#fff; background:transparent;
    border-radius:999px; padding:9px 13px; font-size:13.5px; min-height:44px;
  }
  .ses .zone button[data-on="1"]{background:var(--verde); color:var(--su-verde); border-color:var(--verde)}
  .ses table{color:#fff}
  .ses th{color:rgba(255,255,255,.6)}
  .ses td,.ses th{border-bottom-color:rgba(255,255,255,.16)}
  .ses .note{background:rgba(255,255,255,.1); border-left-color:var(--verde); color:rgba(255,255,255,.9)}
  .ses .note strong{color:#fff}
  body.in-ses{overflow:hidden}
  body.in-ses .tabs{display:none}

  /* --- attrezzi, regolazioni, fastidi --- */
  /* Disegno dell'attrezzo, non fotografia: stessa regola del resto dell'app —
     telaio spento, in azzurro pieno solo cio che si regola o si muove.
     Niente cornice: sta sul fondo del pannello come la figura animata. */
  .disegno{width:100%;max-width:300px;margin:0 auto 12px;display:block}
  .disegno .telaio{fill:var(--ghisa-2)}
  .disegno .vivo{fill:var(--ghisa)}
  .disegno .imb{fill:var(--ink-3);opacity:.55}
  .disegno .suolo{stroke:var(--ink-3);stroke-opacity:.45;stroke-width:1.5}
  .disegno .quota{stroke:var(--ghisa);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
  /* I tratti vanno tenuti separati dalle campiture: una classe che riempie,
     applicata a un path pensato come linea, lo trasforma in una macchia. */
  .disegno .tratto{fill:none;stroke:var(--ghisa);stroke-linecap:round}
  .disegno .tratto-2{fill:none;stroke:var(--ghisa-2);stroke-linecap:round}
  /* Cerca un video: il tasto e i segni che squalificano quello che trovi. */
  .video{margin:12px 0 4px; padding-top:10px; border-top:1px solid var(--line)}
  .video .btn{margin-bottom:8px}
  .cue-no{list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:5px}
  .cue-no li{
    font-size:13px; line-height:1.4; padding-left:17px; position:relative; color:var(--ink-2);
  }
  .cue-no li::before{
    content:"×"; position:absolute; left:2px; top:-1px; color:var(--bad); font-weight:700;
  }
  .ses .video{border-top-color:rgba(255,255,255,.16)}
  .ses .cue-no li{color:rgba(255,255,255,.85)}
  .ses .video .fine{color:rgba(255,255,255,.6)}
  .reg{display:block;margin:10px 0 2px}
  .reg span{display:block;font-size:12px;color:var(--ink-3);margin-bottom:4px}
  .reg input{width:100%;padding:10px;min-height:42px;border:1px solid var(--line-2);border-radius:var(--r);
    background:var(--surface-2);color:var(--ink);font-family:var(--sans);font-size:15px}
  .regp{color:var(--accent);font-family:var(--mono)}
  .zone{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
  .zone button{min-height:42px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);

var PESO_TARGET_SETT = 0.25, PESO_META = 53, FTF_META = 15;

var GIORNI = ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
var MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
var PIANO = ["riposo","pesi","corsa","pesi","riposo","pesi","corsa"]; // dom → sab

/* ============================================================
   Stato
   ============================================================ */

var KEY = "palestra-v1";
var storageOK = true;

function fresh(){
  return {
    v:1,
    start:null,               // lunedì della settimana 1, ISO
    setup:{ fermi:false, attrezzi:false },
    weights:[],               // {d, kg}
    ftf:[{ d:"2026-07-31", cm:30 }],
    sessions:{},              // ISO → { goblet:[{kg,reps,done}], ... }
    runs:[],                  // {d, week, kind, rpe}
    stretch:{},               // ISO → { done:true, items:{id:true} }
    food:{},                  // ISO → [{n,k,p}]
    regol:{},                 // esercizio → regolazioni scritte da te
    pain:{},                  // ISO → [zona, ...]
    lastExport:null,          // ISO dell'ultimo backup riuscito
    mieiCibi:[]               // cibi aggiunti da te, riusabili {n,k,p}
  };
}
var SCHEMA = 1;
var schemaFuturo = false;
/* Riempie i campi che una versione piu vecchia non aveva e riallinea v.
   Non tocca mai i dati esistenti: aggiunge soltanto cio che manca. */
function migra(o){
  var base = fresh();
  for(var k in base){ if(!(k in o) || o[k] == null) o[k] = base[k]; }
  o.v = SCHEMA;
  return o;
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o && typeof o.v === "number"){
        if(o.v > SCHEMA){ schemaFuturo = true; return o; }
        return migra(o);
      }
    }
  }catch(e){ storageOK = false; }
  return fresh();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ storageOK = false; }
}
var S = load();

/* ============================================================
   Date e settimane
   ============================================================ */

function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parseISO(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function oggiISO(){ return iso(new Date()); }
function mondayOf(d){
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var w = x.getDay(); var diff = (w === 0 ? -6 : 1 - w);
  x.setDate(x.getDate() + diff); return x;
}
function weekOf(isoDate){
  if(!S.start) return null;
  var a = parseISO(S.start), b = parseISO(isoDate);
  var days = Math.floor((b - a) / 86400000);
  return Math.floor(days / 7) + 1;
}
function weekNow(){ var w = weekOf(oggiISO()); return w; }
function weekClamped(){ var w = weekNow(); if(w === null) return 1; return Math.max(1, Math.min(4, w)); }
function serieCount(){ return weekNow() === 1 ? 2 : 3; }
function dataLunga(d){ return GIORNI[d.getDay()] + " " + d.getDate() + " " + MESI[d.getMonth()]; }
function mmss(s){
  s = Math.max(0, Math.round(s));
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ============================================================
   Accessori sullo stato
   ============================================================ */

function sessionOf(d){ if(!S.sessions[d]) S.sessions[d] = {}; return S.sessions[d]; }
function setsOf(d, exId){
  var s = sessionOf(d);
  var need = serieCount();
  if(!s[exId]) s[exId] = [];
  while(s[exId].length < need) s[exId].push({ kg:null, reps:null, done:false });
  return s[exId];
}
function lastSession(exId, beforeISO){
  var keys = Object.keys(S.sessions).filter(function(k){ return k < beforeISO; }).sort();
  for(var i = keys.length - 1; i >= 0; i--){
    var arr = S.sessions[keys[i]][exId];
    if(arr && arr.some(function(x){ return x.done; })) return { d:keys[i], sets:arr.filter(function(x){ return x.done; }) };
  }
  return null;
}
function suggerimento(exId, beforeISO){
  var ex = EX.filter(function(e){ return e.id === exId; })[0];
  var last = lastSession(exId, beforeISO);
  if(!last) return null;
  var soglia = ex.secs ? 30 : 12;
  var tutte = last.sets.length >= 2 && last.sets.every(function(s){ return (s.reps || 0) >= soglia; });
  var kg = last.sets[0].kg;
  if(tutte && kg != null) return { kg: Math.round((kg + ex.step) * 100) / 100, base:kg };
  return null;
}
/* Cosa scrivere nei campi di una serie non ancora registrata.
   Il pattern e quello di Strong e Hevy: i numeri dell'ultima volta sono gia
   dentro, si tocca la spunta e basta. Nella revisione JMIR 2024 (18 studi,
   525.824 partecipanti) l'esperienza d'uso scomoda e la prima ragione di
   abbandono su sei e il costo di inserimento dati e la quarta.
   Se l'ultima volta erano chiuse tutte al massimo, la proposta e gia il
   carico salito: la regola "prima ripetizioni, poi peso" applicata da sola. */
function proposta(exId, beforeISO){
  var ex = EX.filter(function(e){ return e.id === exId; })[0];
  var last = lastSession(exId, beforeISO);
  if(!last) return null;
  var soglia = ex.secs ? 30 : 12;
  var base = ex.secs ? 20 : 10;
  var ultime = last.sets[last.sets.length - 1].reps || base;
  var chiuse = last.sets.length >= 2 && last.sets.every(function(s){ return (s.reps || 0) >= soglia; });
  if(ex.secs) return { kg:null, reps: chiuse ? ultime + ex.step : ultime, salito:chiuse };
  var kg = last.sets[0].kg;
  if(kg == null) return { kg:null, reps:ultime, salito:false };
  return {
    kg: chiuse ? Math.round((kg + ex.step) * 100) / 100 : kg,
    reps: chiuse ? base : ultime,
    salito: chiuse
  };
}

function stretchDay(d){ if(!S.stretch[d]) S.stretch[d] = { items:{} }; return S.stretch[d]; }
function stretchDone(d){
  var s = S.stretch[d]; if(!s) return false;
  return STRETCH.every(function(x){ return s.items && s.items[x.id]; });
}
function foodDay(d){ if(!S.food[d]) S.food[d] = []; return S.food[d]; }
/* q = quantita, 1 se assente: le voci scritte prima della v1.8 non ce l'hanno. */
function foodTot(d){
  return foodDay(d).reduce(function(a, x){
    var q = x.q || 1;
    return { k:a.k + x.k * q, p:a.p + x.p * q };
  }, { k:0, p:0 });
}

/* Backup. La perdita di dati e fra le sei ragioni di abbandono censite dalla
   revisione JMIR 2024, e su iPhone Safari cancella la memoria dei siti dopo
   sette giorni senza aprirli: la stessa soglia vale per il promemoria. */
function giorniDaExport(){
  if(!S.lastExport) return null;
  return Math.floor((parseISO(oggiISO()) - parseISO(S.lastExport)) / 86400000);
}
function exportScaduto(){
  if(sedute().length < 2 && S.weights.length < 2) return false;
  var g = giorniDaExport();
  return g === null || g >= 7;
}

/* Sedute di pesi davvero svolte, in ordine di data. Una seduta conta se ha
   almeno una serie spuntata: le righe vuote create al volo non contano. */
function sedute(){
  return Object.keys(S.sessions).filter(function(dd){
    var s = S.sessions[dd];
    for(var k in s){
      for(var i = 0; i < s[k].length; i++){ if(s[k][i].done) return true; }
    }
    return false;
  }).sort();
}
/* Regola del brief: stesso dolore, stesso punto, tre sedute di fila -> ci si ferma.
   E l'unica regola del progetto che protegge da qualcosa di non reversibile. */
function painAlert(){
  var ds = sedute().slice(-3);
  if(ds.length < 3) return [];
  return ZONE.filter(function(z){
    return ds.every(function(dd){ return (S.pain[dd] || []).indexOf(z) >= 0; });
  });
}

/* medie settimanali del peso */
function pesoSettimane(){
  if(!S.weights.length) return [];
  var anchor = S.start ? parseISO(S.start) : mondayOf(parseISO(S.weights.slice().sort(function(a,b){ return a.d < b.d ? -1 : 1; })[0].d));
  var m = {};
  S.weights.forEach(function(w){
    var idx = Math.floor((parseISO(w.d) - anchor) / 604800000) + 1;
    if(!m[idx]) m[idx] = [];
    m[idx].push(w.kg);
  });
  return Object.keys(m).map(Number).sort(function(a,b){ return a-b; }).map(function(i){
    var a = m[i];
    return { w:i, n:a.length, media: a.reduce(function(x,y){ return x+y; },0) / a.length };
  });
}
function consiglioPeso(){
  var ws = pesoSettimane();
  if(ws.length < 3) return null;
  var ult = ws[ws.length-1], pre = ws[ws.length-3];
  if(ult.w - pre.w > 3) return null;
  var d = ult.media - pre.media;
  if(d < 0.15) return { t:"su", txt:"La media del peso è ferma da due settimane (" + d.toFixed(2).replace(".",",") + " kg). Regola del diario: <strong>+200 kcal al giorno</strong>, poi ricontrolla fra due settimane." };
  var settimanale = d / (ult.w - pre.w);
  if(settimanale > 0.4) return { t:"giu", txt:"Stai salendo di " + settimanale.toFixed(2).replace(".",",") + " kg a settimana, oltre i 400 g. Regola del diario: <strong>−150 kcal al giorno</strong>." };
  return { t:"ok", txt:"Ritmo dentro il bersaglio: " + settimanale.toFixed(2).replace(".",",") + " kg a settimana contro i 250 g previsti. Non toccare niente." };
}

/* ============================================================
   Audio e vibrazione
   ============================================================ */

var actx = null;
function beep(n){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    for(var i = 0; i < (n||1); i++){
      var o = actx.createOscillator(), g = actx.createGain();
      var t = actx.currentTime + i * 0.22;
      o.frequency.value = 760; o.type = "sine";
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.2);
    }
  }catch(e){}
}
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

/* Schermo acceso per tutta la seduta, non solo dentro i timer: fra un
   esercizio e l'altro il telefono si spegneva e andava sbloccato con le mani
   sudate. Il wake lock viene rilasciato dal browser ogni volta che la pagina
   passa in secondo piano, quindi va richiesto di nuovo al ritorno — altrimenti
   dura solo fino alla prima notifica che ti porta fuori dall'app.
   Nessun conteggio di chi lo ha chiesto: syncWake() ricalcola dallo stato. */
var wake = null, wakeWanted = false;
function wakeNeeded(){
  return ses.on || tab === "pesi" || tab === "corsa" || rest.on || run.playing;
}
function syncWake(){
  wakeWanted = wakeNeeded();
  applyWake();
}
function applyWake(){
  try{
    if(wakeWanted && navigator.wakeLock && !wake && document.visibilityState === "visible"){
      navigator.wakeLock.request("screen").then(function(w){
        wake = w;
        w.addEventListener("release", function(){ wake = null; });
      }).catch(function(){});
    } else if(!wakeWanted && wake){ wake.release(); wake = null; }
  }catch(e){}
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible") applyWake();
});

/* ============================================================
   Timer di riposo
   ============================================================ */

var rest = { end:0, tot:0, label:"", on:false };
function restStart(sec, label){
  rest.end = Date.now() + sec * 1000; rest.tot = sec; rest.label = label; rest.on = true;
  syncWake(); tickRest();
}
function restStop(){ rest.on = false; document.getElementById("rest").hidden = true; syncWake(); }
function tickRest(){
  var el = document.getElementById("rest");
  if(!rest.on){ el.hidden = true; return; }
  var left = (rest.end - Date.now()) / 1000;
  /* Nella seduta guidata il conto alla rovescia sta a schermo intero: la
     fascetta in basso resterebbe nascosta sotto la schermata blu. */
  var cd = document.getElementById("sesCd");
  if(cd) cd.textContent = mmss(Math.max(0, left));
  /* Chi usa un lettore di schermo non vede il numero che scorre. Si annuncia
     solo negli ultimi 10 secondi: un annuncio al secondo per due minuti
     renderebbe l'app inascoltabile (WCAG 4.1.3). */
  var live = document.getElementById("sesLive");
  if(live){
    var L = Math.ceil(Math.max(0, left));
    live.textContent = left <= 0 ? "Riposo finito" : (L <= 10 ? L + " secondi" : "");
  }
  el.hidden = ses.on;
  if(!ses.on){
    var ln = document.getElementById("restLn");
    if(ln) ln.style.width = (Math.max(0, Math.min(1, left / (rest.tot || 1))) * 100).toFixed(2) + "%";
    document.getElementById("restT").textContent = mmss(Math.max(0, left));
    document.getElementById("restW").innerHTML = left <= 0
      ? "Riposo finito — vai con la serie"
      : "Riposo · " + esc(rest.label);
  }
  if(left <= 0 && !rest.done){ rest.done = true; beep(2); buzz([160,80,160]); }
  if(left > 0) rest.done = false;
  /* "lui conta il tempo, poi parte l'altra": a zero il percorso avanza da solo. */
  if(left <= 0 && ses.on && !ses.avanzato && (ses.steps[ses.i] || {}).t === "riposo"){
    ses.avanzato = true; restStop(); sesVai(1); return;
  }
  if(left < -20) restStop();
}

/* ============================================================
   Timer della corsa
   ============================================================ */

var run = { seq:[], i:0, end:0, playing:false, started:false };
function buildSeq(week){
  var cfg = RUN_WEEKS[Math.max(0, Math.min(3, week - 1))];
  var seq = [{ k:"warm", n:"Riscaldamento", s:WARMUP }];
  for(var i = 0; i < cfg.reps; i++){
    seq.push({ k:"run", n:"Corsa", s:cfg.run, b:i+1, tot:cfg.reps });
    if(i < cfg.reps - 1) seq.push({ k:"walk", n:"Cammino", s:cfg.walk, b:i+1, tot:cfg.reps });
  }
  seq.push({ k:"cool", n:"Defaticamento", s:COOLDOWN });
  return seq;
}
function runStart(){
  if(!run.started){ run.seq = buildSeq(weekClamped()); run.i = 0; run.started = true; }
  run.end = Date.now() + run.seq[run.i].s * 1000;
  run.playing = true; syncWake(); beep(1);
}
function runPause(){
  if(!run.playing) return;
  run.seq[run.i].s = Math.max(1, Math.round((run.end - Date.now()) / 1000));
  run.playing = false; syncWake();
}
function runNext(){
  run.i++;
  if(run.i >= run.seq.length){ runFinish(); return; }
  run.end = Date.now() + run.seq[run.i].s * 1000;
  var k = run.seq[run.i].k;
  beep(k === "run" ? 2 : 1);
  buzz(k === "run" ? [200,90,200] : [220]);
}
function runFinish(){
  run.playing = false; run.started = false; syncWake();
  beep(3); buzz([300,120,300,120,300]);
  var rpe = prompt("Sessione finita. Sensazione da 1 a 5?\n1 = facile, potevo continuare · 3 = giusta · 5 = ho finito a fatica");
  var n = parseInt(rpe, 10);
  S.runs.push({ d:oggiISO(), week:weekClamped(), kind:"corsa", rpe:(n >= 1 && n <= 5) ? n : null });
  save(); render();
}
function tickRun(){
  if(!run.started) return;
  var box = document.getElementById("runner");
  if(!box) return;
  var ph = run.seq[run.i];
  var left = run.playing ? (run.end - Date.now()) / 1000 : ph.s;
  if(run.playing && left <= 0){ runNext(); return; }
  box.setAttribute("data-kind", ph.k);
  /* La figura cambia col cambio di fase: corre nei blocchi, cammina nei recuperi. */
  var vuole = ph.k === "run" ? "corre" : "cammina";
  if(anim.id !== vuole){
    var w = box.querySelector(".figcorsa");
    if(w){ w.innerHTML = figuraSVG(vuole); animaOn(vuole); }
  }
  box.querySelector(".phase").textContent = ph.n;
  box.querySelector(".big").textContent = mmss(left);
  box.querySelector(".of").textContent = ph.b ? ("blocco " + ph.b + " di " + ph.tot) : (run.playing ? "in corso" : "in pausa");
  var tr = box.querySelector(".track");
  if(tr) Array.prototype.forEach.call(tr.children, function(el, idx){
    el.setAttribute("data-p", idx <= run.i ? "1" : "0");
  });
}

setInterval(function(){ tickRest(); tickRun(); }, 250);

/* ============================================================
   Grafici
   ============================================================ */

function lineChart(pts, opts){
  opts = opts || {};
  if(pts.length === 0) return "";
  var W = 320, H = 96, pl = 30, pr = 8, pt = 10, pb = 18;
  var ys = pts.map(function(p){ return p.y; });
  var extra = (opts.guide || []).reduce(function(a,g){ return a.concat(g.map(function(p){ return p.y; })); }, []);
  var all = ys.concat(extra, opts.goal != null ? [opts.goal] : []);
  var min = Math.min.apply(null, all), max = Math.max.apply(null, all);
  if(max - min < 0.6){ max += 0.4; min -= 0.4; }
  var pad = (max - min) * 0.12; min -= pad; max += pad;
  var n = Math.max(1, pts.length - 1);
  var X = function(i){ return pl + (i / n) * (W - pl - pr); };
  var Y = function(v){ return pt + (1 - (v - min) / (max - min)) * (H - pt - pb); };
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.alt || "grafico") + '">';
  [0, 0.5, 1].forEach(function(f){
    var y = pt + f * (H - pt - pb);
    s += '<line x1="' + pl + '" y1="' + y + '" x2="' + (W - pr) + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>';
  });
  s += '<text x="2" y="' + (pt + 4) + '" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">' + max.toFixed(0) + '</text>';
  s += '<text x="2" y="' + (H - pb + 4) + '" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">' + min.toFixed(0) + '</text>';
  if(opts.goal != null){
    s += '<line x1="' + pl + '" y1="' + Y(opts.goal) + '" x2="' + (W - pr) + '" y2="' + Y(opts.goal) + '" stroke="' + (opts.goalColor || "var(--ok)") + '" stroke-width="1.2" stroke-dasharray="3 3"/>';
  }
  (opts.guide || []).forEach(function(g){
    var d = g.map(function(p, i){ return (i ? "L" : "M") + X(p.x) + " " + Y(p.y); }).join(" ");
    s += '<path d="' + d + '" fill="none" stroke="var(--ink-3)" stroke-width="1.2" stroke-dasharray="4 3" opacity=".7"/>';
  });
  var col = opts.color || "var(--accent)";
  var d = pts.map(function(p, i){ return (i ? "L" : "M") + X(i) + " " + Y(p.y); }).join(" ");
  if(pts.length > 1){
    s += '<path d="' + d + ' L' + X(pts.length-1) + ' ' + (H - pb) + ' L' + X(0) + ' ' + (H - pb) + ' Z" fill="' + col + '" opacity=".10" style="animation:appari .8s .5s ease both"/>';
    /* pathLength="1" normalizza la lunghezza: cosi il tratteggio vale 1 e la
       linea si disegna da sinistra a destra senza doverla misurare. */
    s += '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"' +
      ' pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="animation:traccia .9s cubic-bezier(.3,.7,.3,1) forwards"/>';
  }
  pts.forEach(function(p, i){
    var last = i === pts.length - 1;
    var ritardo = (0.15 + 0.75 * (i / Math.max(1, pts.length - 1))).toFixed(2);
    s += '<circle cx="' + X(i) + '" cy="' + Y(p.y) + '" r="' + (last ? 4 : 2.4) + '" fill="' + (last ? col : "var(--bg)") + '" stroke="' + col + '" stroke-width="1.6"' +
      ' style="animation:appari .3s ' + ritardo + 's ease both"/>';
  });
  var lp = pts[pts.length-1];
  s += '<text x="' + Math.min(W - pr, X(pts.length-1)) + '" y="' + Math.max(10, Y(lp.y) - 8) + '" font-size="10" text-anchor="end" fill="' + col + '" font-family="var(--mono)" font-weight="600">' + esc(lp.lab || lp.y) + '</text>';
  s += '</svg>';
  return s;
}

/* ============================================================
   Viste
   ============================================================ */

var tab = "oggi";
var TABS = ["oggi", "pesi", "corsa", "cibo", "dati"];
/* Da dove entra la prossima vista. Lo scrive chi cambia scheda o passo, e
   render() lo consuma una volta sola: se restasse, ogni ridisegno (una spunta,
   un numero) farebbe scivolare tutto di lato senza motivo. */
var verso = 0;

function render(){
  var w = weekNow();
  document.getElementById("wkLabel").textContent = S.start
    ? (w > 4 ? "settimana " + w + " · oltre scheda" : "settimana " + w + " di 4")
    : "non avviato";
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
    if(b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  var cur = document.querySelector("#tabs .cursore");
  if(cur) cur.style.setProperty("--i", String(Math.max(0, TABS.indexOf(tab))));
  var v = document.getElementById("view");
  v.style.setProperty("--dx", verso ? (verso > 0 ? "22px" : "-22px") : "0px");
  verso = 0;
  if(ses.on){
    v.innerHTML = vSessione();
    var s = ses.steps[ses.i];
    /* "avvic" mancava: la serie di avvicinamento mostrava un riquadro vuoto.
       Il movimento serve proprio lì, perché è il primo che vedi. */
    var fig = s.t === "intro" || s.t === "serie" || s.t === "avvic" ? s.ex.id : s.t === "stre" ? s.st.id : null;
    if(fig) animaOn(fig); else animaOff();
  } else {

function nuova(id){ return !!CICLO[id] || !!PESI[id]; }
function xy(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); }
function daAngolo(x, y, gradi, len){
  var r = gradi * Math.PI / 180;
  return [x + Math.sin(r) * len, y + Math.cos(r) * len];
}

/* Chiavi cicliche col coseno: continua in valore e in derivata, e il ciclo
   si richiude sulla prima chiave. E un giro, non un pendolo. */
function chiave(keys, p){
  p = p - Math.floor(p);
  for(var i = 0; i < keys.length; i++){
    var a = keys[i], b = keys[(i + 1) % keys.length];
    var p0 = a[0], p1 = b[0]; if(p1 <= p0) p1 += 1;
    var q = p; if(q < p0) q += 1;
    if(q >= p0 && q <= p1){
      var u = (1 - Math.cos(Math.PI * (q - p0) / (p1 - p0))) / 2;
      return [a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
    }
  }
  return [keys[0][1], keys[0][2]];
}

/* Due ossa, un bersaglio. Se il bersaglio e piu lontano della somma delle
   ossa lo tira dentro, invece di spezzare l'arto per arrivarci. */
function ik(a, b, l1, l2, dir){
  var dx = b[0] - a[0], dy = b[1] - a[1], d = Math.sqrt(dx * dx + dy * dy) || 0.01;
  var max = l1 + l2 - 0.6;
  if(d > max){ var s = max / d; dx *= s; dy *= s; d = max; b = [a[0] + dx, a[1] + dy]; }
  var ang = Math.atan2(dy, dx);
  var c = (d * d + l1 * l1 - l2 * l2) / (2 * d * l1);
  c = Math.max(-1, Math.min(1, c));
  var off = Math.acos(c) * dir;
  return [[a[0] + Math.cos(ang + off) * l1, a[1] + Math.sin(ang + off) * l1], b];
}

function falcata(id, p){
  var c = CICLO[id], ancaX = 100;
  var ancaY = c.ancaY - c.bob * Math.cos(4 * Math.PI * (p - 0.13));
  var lr = c.inclina * Math.PI / 180;
  var sp = [ancaX + Math.sin(lr) * OSSO.tronco, ancaY - Math.cos(lr) * OSSO.tronco];
  var te = [sp[0] + Math.sin(lr) * OSSO.collo, sp[1] - Math.cos(lr) * OSSO.collo];
  function gamba(q){
    var k = chiave(c.gamba, q);
    var gin = daAngolo(ancaX, ancaY, k[0], OSSO.coscia);
    return [[ancaX, ancaY], gin, daAngolo(gin[0], gin[1], k[0] - k[1], OSSO.stinco)];
  }
  function braccio(q){
    var k = chiave(c.braccio, q);
    var gom = daAngolo(sp[0], sp[1], k[0], OSSO.braccio);
    return [sp, gom, daAngolo(gom[0], gom[1], k[0] + k[1], OSSO.avambr)];
  }
  var gV = gamba(p), gL = gamba(p + 0.5), bV = braccio(p + 0.5), bL = braccio(p);
  /* Nessuna caviglia sotto il pavimento: si alza tutto di quanto serve.
     In volo non corregge niente, quindi l'oscillazione resta intatta. */
  var basso = Math.max(gV[2][1], gL[2][1]), dy = basso > SUOLO_Y ? basso - SUOLO_Y : 0;
  if(dy){
    [gV, gL, bV, bL].forEach(function(l){ l.forEach(function(q){ q[1] -= dy; }); });
    ancaY -= dy; sp = [sp[0], sp[1] - dy]; te = [te[0], te[1] - dy];
  }
  return { anca:[ancaX, ancaY], sp:sp, te:te, gamba:gV, gambaF:gL,
           braccio:bV, braccioF:bL, mani:bV[2], maniF:bL[2] };
}

function ossa(id, u){
  var E = PESI[id], A = E.a, B = E.b;
  var anca = [A.anca[0] + (B.anca[0] - A.anca[0]) * u, A.anca[1] + (B.anca[1] - A.anca[1]) * u];
  var lean = A.lean + (B.lean - A.lean) * u;
  var mani = [A.mani[0] + (B.mani[0] - A.mani[0]) * u, A.mani[1] + (B.mani[1] - A.mani[1]) * u];
  var lr = lean * Math.PI / 180;
  var sp = [anca[0] + Math.sin(lr) * OSSO.tronco, anca[1] - Math.cos(lr) * OSSO.tronco];
  var te = [sp[0] + Math.sin(lr) * OSSO.collo, sp[1] - Math.cos(lr) * OSSO.collo];
  var maniF = [mani[0] - 9, Math.min(mani[1] + 3, SUOLO_Y)];
  var G1 = ik(anca, A.piedi[0], OSSO.coscia, OSSO.stinco, -1);
  var G2 = ik(anca, A.piedi[1], OSSO.coscia, OSSO.stinco, -1);
  var B1 = ik(sp, mani, OSSO.braccio, OSSO.avambr, E.gomito);
  var B2 = ik(sp, maniF, OSSO.braccio, OSSO.avambr, E.gomito);
  return { anca:anca, sp:sp, te:te, mani:B1[1], maniF:B2[1],
    gamba:[anca, G1[0], G1[1]], gambaF:[anca, G2[0], G2[1]],
    braccio:[sp, B1[0], B1[1]], braccioF:[sp, B2[0], B2[1]] };
}

/* Discesa lenta, breve fermata, risalita rapida: e il profilo di un

function tempoLift(t){
  if(t < 0.44) return (1 - Math.cos(Math.PI * (t / 0.44))) / 2;
  if(t < 0.54) return 1;
  if(t < 0.82) return 1 - (1 - Math.cos(Math.PI * ((t - 0.54) / 0.28))) / 2;
  return 0;
}

function disegnaNuova(id, u){
  var T = document.getElementById("fgT"); if(!T) return;
  var f = CICLO[id] ? falcata(id, u) : ossa(id, u);
  T.setAttribute("d", "M" + f.anca[0].toFixed(1) + " " + f.anca[1].toFixed(1) +
    " Q" + (f.anca[0] + (f.sp[0] - f.anca[0]) * 0.45 + 3).toFixed(1) + " " + ((f.anca[1] + f.sp[1]) / 2).toFixed(1) +
    " " + f.sp[0].toFixed(1) + " " + f.sp[1].toFixed(1));
  var H = document.getElementById("fgH");
  H.setAttribute("cx", f.te[0].toFixed(1)); H.setAttribute("cy", f.te[1].toFixed(1));
  document.getElementById("fgG").setAttribute("points", f.gamba.map(xy).join(" "));
  document.getElementById("fgB").setAttribute("points", f.braccio.map(xy).join(" "));
  var g2 = document.getElementById("fgG2"), b2 = document.getElementById("fgB2");
  if(g2) g2.setAttribute("points", f.gambaF.map(xy).join(" "));
  if(b2) b2.setAttribute("points", f.braccioF.map(xy).join(" "));
  var M = document.getElementById("fgM");
  if(M) M.innerHTML = (PESI[id] && PESI[id].mac) ? macch(PESI[id].mac, u, f.mani) : "";
  var A = document.getElementById("fgA");
  if(A) A.innerHTML = PESI[id] ? attrezzo(PESI[id].peso, f.mani, f.maniF) : "";
}

/* ---------- la figura ---------- */
function lerp(a, b, u){ return a + (b - a) * u; }
function poseAt(id, u){
  var p = POSE[id]; if(!p) return null;
  return p.a.map(function(pt, i){
    return [lerp(pt[0], p.b[i][0], u), lerp(pt[1], p.b[i][1], u)];
  });
}
/* Riquadro stretto attorno alla figura: nel riquadro piccolo della schermata
   Oggi un viewBox da 200x200 lascia la figura grande un dito e illeggibile.
   Il ritaglio si calcola dalle due pose, cosi vale per qualsiasi esercizio. */
function riquadro(id){
  var P = POSE[id].a.concat(POSE[id].b);
  var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  P.forEach(function(p){
    if(p[0] < x0) x0 = p[0]; if(p[0] > x1) x1 = p[0];
    if(p[1] < y0) y0 = p[1]; if(p[1] > y1) y1 = p[1];
  });
  var m = 22, w = x1 - x0 + m * 2, hh = y1 - y0 + m * 2, l = Math.max(w, hh);
  return (x0 - m - (l - w) / 2).toFixed(0) + " " + (y0 - m - (l - hh) / 2).toFixed(0) + " " + l.toFixed(0) + " " + l.toFixed(0);
}
function figuraSVG(id, stretto){
  var nuovo = nuova(id);
  if(!POSE[id] && !nuovo) return "";
  /* Il motore nuovo non ha due pose da cui calcolare il ritaglio: il suo
     riquadro e fisso, tarato sull'ingombro del ciclo. */
  var vb = CICLO[id] ? "28 34 154 154"
         : nuovo ? "20 16 172 172"
         : (stretto ? riquadro(id) : "0 0 200 200");
  return '<svg class="stage" id="stage" viewBox="' + vb + '" role="img" aria-label="dimostrazione del movimento">' +
    '<line class="suolo" x1="10" y1="181" x2="190" y2="181"></line>' +
    '<g class="macc" id="fgM">' + (nuovo ? "" : (MACC[id] || "")) + '</g>' +
    (nuovo ? '<polyline class="bone lontano" id="fgG2"></polyline><polyline class="bone lontano" id="fgB2"></polyline>' : "") +
    '<path class="bone" id="fgT"></path>' +
    '<polyline class="bone" id="fgG"></polyline>' +
    '<polyline class="bone" id="fgB"></polyline>' +
    '<circle class="head" id="fgH" r="11"></circle>' +
    '<g class="attr" id="fgA"></g>' +
    '</svg>';
}
function disegna(id, u){
  if(nuova(id)) return disegnaNuova(id, u);
  var P = poseAt(id, u); if(!P) return;
  var T = document.getElementById("fgT"); if(!T) return;
  T.setAttribute("d", "M" + P[0][0] + " " + P[0][1] + " Q" + P[8][0] + " " + P[8][1] + " " + P[1][0] + " " + P[1][1]);
  document.getElementById("fgB").setAttribute("points", P[1] + " " + P[3] + " " + P[4]);
  document.getElementById("fgG").setAttribute("points", P[0] + " " + P[5] + " " + P[6] + " " + P[7]);
  var H = document.getElementById("fgH");
  H.setAttribute("cx", P[2][0]); H.setAttribute("cy", P[2][1]);
  var A = document.getElementById("fgA"), t = POSE[id].attr, m = P[4];
  if(!A) return;
  if(t === "kb") A.innerHTML = '<path d="M' + (m[0]-7) + ' ' + (m[1]+4) + ' q7 -10 14 0" fill="none" stroke-width="4"></path>' +
      '<circle cx="' + m[0] + '" cy="' + (m[1]+13) + '" r="10"></circle>';
  else if(t === "db") A.innerHTML = '<rect x="' + (m[0]-3.5) + '" y="' + (m[1]-12) + '" width="7" height="24" rx="2"></rect>';
  else if(t === "bar") A.innerHTML = '<rect x="' + (m[0]-4) + '" y="' + (m[1]-14) + '" width="8" height="28" rx="3"></rect>' +
      (id === "lat" ? '<line x1="47.5" y1="34" x2="' + m[0] + '" y2="' + m[1] + '" stroke-width="3"></line>' : "");
  else A.innerHTML = "";
}
/* Interpolazione in JS invece che con animazioni CSS: identica su ogni browser,
   si ferma di colpo quando l'utente apre un campo, e si spegne del tutto con
   prefers-reduced-motion (WCAG 2.3.3) mostrando la posa finale ferma. */
var anim = { raf:0, id:null, ferma:false };
var pocoMoto = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function animaOn(id){
  animaOff();
  anim.id = id;
  if(!POSE[id] && !nuova(id)) return;
  var gait = !!CICLO[id], pesi = !!PESI[id];
  /* Posa ferma leggibile: meta volo per la corsa, meta discesa per un peso. */
  var fermo = gait ? 0.7 : pesi ? 0.55 : 1;
  if(pocoMoto){ disegna(id, fermo); return; }
  /* Un fotogramma subito: a pagina nascosta rAF non parte e il riquadro
     resterebbe vuoto invece che con la figura ferma. */
  disegna(id, fermo);
  var dur = gait ? CICLO[id].durata : pesi ? 4200 : 3000;
  var t0 = performance.now(), ultimo = 0;
  (function ciclo(now){
    if(anim.id !== id) return;
    /* ~25 fps invece di 60: sotto si vedono gli scatti, sopra non si guadagna
       niente di visibile e si consuma batteria col wake lock acceso.
       Resta rAF e non setInterval: si sospende da solo a pagina nascosta. */
    if(!anim.ferma && now - ultimo >= 40){
      ultimo = now;
      var t = ((now - t0) % dur) / dur;
      disegna(id, gait ? t : pesi ? tempoLift(t) : (1 - Math.cos(2 * Math.PI * t)) / 2);
    }
    anim.raf = requestAnimationFrame(ciclo);
  })(t0);
}
function animaOff(){ if(anim.raf) cancelAnimationFrame(anim.raf); anim.raf = 0; anim.id = null; }

/* Conferma di un gesto: pulsazione sull'elemento toccato piu un anello che
   si espande e muore. Non e decorazione — in sala pesi si tocca senza
   guardare, e la vibrazione da sola non basta col telefono su una panca.
   Si spegne con prefers-reduced-motion come tutto il resto (WCAG 2.3.3). */
function festaSpunta(el){
  if(!el || pocoMoto) return;
  el.classList.remove("botto"); void el.offsetWidth; el.classList.add("botto");
  var r = el.getBoundingClientRect(), d = Math.max(r.width, r.height);
  var a = document.createElement("i");
  a.className = "anello";
  a.style.width = a.style.height = d + "px";
  a.style.left = (r.left + r.width / 2 - d / 2) + "px";
  a.style.top = (r.top + r.height / 2 - d / 2) + "px";
  document.body.appendChild(a);
  setTimeout(function(){ a.remove(); }, 640);
}

/* Numeri che salgono da zero. Stessa curva e stessa durata di valore
   (comune.js: 1300 ms, 1-(1-t)^3, parte veloce e rallenta alla fine). */
function contaSu(el){
  var target = parseFloat(el.dataset.target);
  if(isNaN(target)) return;
  /* Se la pagina non e visibile rAF non parte e il numero resterebbe a zero
     per sempre: in quel caso si scrive e basta. Stesso per chi vuole meno moto. */
  if(pocoMoto || document.visibilityState !== "visible"){ el.textContent = Math.round(target); return; }
  var t0 = performance.now();
  (function passo(ora){
    var t = Math.min((ora - t0) / 1300, 1);
    el.textContent = Math.round(target * (1 - Math.pow(1 - t, 3)));
    if(t < 1) requestAnimationFrame(passo);
    else el.textContent = Math.round(target);
  })(t0);
}
function animaConta(){
  Array.prototype.forEach.call(document.querySelectorAll(".conta"), contaSu);
}

/* ---------- il percorso ---------- */
var ses = { on:false, i:0, steps:[], kind:"pesi", avanzato:false };

function buildSteps(kind){
  var out = [];
  if(kind === "stretch"){
    STRETCH.forEach(function(st){ out.push({ t:"stre", st:st }); });
    out.push({ t:"sfine" });
    return out;
  }
  var n = serieCount();
  /* Una serie di avvicinamento, solo prima del primo esercizio. Non si
     registra e non conta nel volume: vedi vincoli.md §1-quater per come
     va raccontata — l'evidenza è più debole di quanto si dica in palestra. */
  out.push({ t:"avvic", ex:EX[0] });
  EX.forEach(function(ex, xi){
    out.push({ t:"intro", ex:ex });
    for(var si = 0; si < n; si++){
      out.push({ t:"serie", ex:ex, si:si });
      if(si < n - 1) out.push({ t:"riposo", ex:ex, sec:ex.rest, dopo:"Serie " + (si+2) + " · " + ex.n });
      /* Riposo anche fra un esercizio e l'altro: la scheda prescrive 90-120
         secondi anche lì, e saltarlo sarebbe cambiare un parametro. */
      else if(xi < EX.length - 1) out.push({ t:"riposo", ex:ex, sec:100, dopo:EX[xi+1].n });
    }
  });
  out.push({ t:"fastidi" });
  out.push({ t:"fine" });
  return out;
}
function sesStart(kind){
  ses.kind = kind; ses.steps = buildSteps(kind); ses.on = true; ses.i = 0;
  /* Riprende dal primo passo non ancora fatto invece che dall'inizio, e vale
     per entrambi i percorsi: sullo stretching l'asimmetria sembrava un guasto.
     Sul passo stesso, non su quello prima: rientrare dentro un riposo farebbe
     partire un conto alla rovescia che nessuno ha chiesto. */
  var d = oggiISO();
  /* Solo se la seduta di oggi e gia stata cominciata: altrimenti il salto
     mangerebbe l'avvicinamento e l'introduzione del primo esercizio. */
  var iniziata = kind === "pesi"
    ? EX.some(function(e){ return (((S.sessions[d] || {})[e.id]) || []).some(function(x){ return x.done; }); })
    : STRETCH.some(function(x){ return stretchDay(d).items[x.id]; });
  if(iniziata) for(var k = 0; k < ses.steps.length; k++){
    var s = ses.steps[k];
    if(kind === "pesi" && s.t === "serie" && !(setsOf(d, s.ex.id)[s.si] || {}).done){ ses.i = k; break; }
    if(kind === "stretch" && s.t === "stre" && !stretchDay(d).items[s.st.id]){ ses.i = k; break; }
  }
  document.body.classList.add("in-ses");
  render();
}
function sesExit(){
  ses.on = false; animaOff(); restStop();
  document.body.classList.remove("in-ses");
  render();
}
function sesVai(d){
  /* Avanti entra da destra, indietro da sinistra: nella seduta guidata e
     l'unica cosa che dice se sei andato avanti o tornato su una serie. */
  verso = d > 0 ? 1 : d < 0 ? -1 : 0;
  ses.i = Math.max(0, Math.min(ses.steps.length - 1, ses.i + d));
  ses.avanzato = false;
  var s = ses.steps[ses.i];
  /* Il riposo parte da solo appena ci arrivi: e il punto di tutta la modalita. */
  if(s.t === "riposo") restStart(s.sec, s.dopo); else if(rest.on) restStop();
  render();
}

/* Segmenti della barra: uno per ogni serie (o per ogni esercizio di stretching) */
function sesConteggio(){
  var tot = [], now = -1;
  ses.steps.forEach(function(s, k){
    if(s.t === "serie" || s.t === "stre"){ if(k <= ses.i) now = tot.length; tot.push(k); }
  });
  return { tot:tot.length, now:now };
}
function sesBarra(){
  var c = sesConteggio(), nome = ses.kind === "pesi" ? "serie" : "esercizi";
  var h = '<div class="ses-bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + c.tot +
    '" aria-valuenow="' + Math.max(0, c.now) + '" aria-label="' + nome + ' ' + Math.max(1, c.now + 1) + ' di ' + c.tot + '">';
  for(var j = 0; j < c.tot; j++) h += '<i data-f="' + (j < c.now ? "1" : j === c.now ? "now" : "0") + '"></i>';
  return h + '</div>';
}

/* Penultima seduta di quell'esercizio: serve al confronto del riepilogo. */
function lastSessionPrima(exId, d){
  var keys = Object.keys(S.sessions).filter(function(k){ return k < d; }).sort();
  for(var i = keys.length - 1; i >= 0; i--){
    var arr = S.sessions[keys[i]][exId];
    if(arr && arr.some(function(x){ return x.done; })) return { d:keys[i], sets:arr.filter(function(x){ return x.done; }) };
  }
  return null;
}

/* Promemoria veri: un file di calendario da importare nel telefono.
   Una pagina web non può mandare notifiche su iPhone — il Calendario sì. */
function pad2(n){ return String(n).padStart(2, "0"); }
function icsEsc(s){ return String(s).replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n"); }
/* Lo standard iCalendar vuole righe non oltre 75 ottetti, spezzate con una
   riga di continuazione che inizia con uno spazio. Si conta in byte UTF-8,
   non in caratteri: accenti, · e — ne occupano piu di uno. */
function bLen(ch){ var c = ch.charCodeAt(0); return c < 0x80 ? 1 : c < 0x800 ? 2 : 3; }
function piega(l){
  var res = [], cur = "", n = 0;
  for(var i = 0; i < l.length; i++){
    var b = bLen(l[i]);
    if(n + b > 74){ res.push(cur); cur = " "; n = 1; }
    cur += l[i]; n += b;
  }
  res.push(cur);
  return res.join("\r\n");
}
function generaICS(ora){
  var hh = (ora || "07:30").split(":");
  var L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//palestra//scheda settimane 1-4//IT", "CALSCALE:GREGORIAN"];
  for(var k = 0; k < 28; k++){
    var dt = giornoDelProgramma(k), iso2 = iso(dt), sett = Math.floor(k / 7) + 1;
    var tipo = PIANO[dt.getDay()], cfg = RUN_WEEKS[Math.min(3, sett - 1)];
    var tit, des;
    if(tipo === "pesi"){
      tit = "Pesi — full body";
      des = (sett === 1 ? 2 : 3) + " serie per esercizio, 7 esercizi. " +
        "Ogni serie finisce con 1-3 ripetizioni ancora in canna, mai a cedimento. " +
        "Riposo 90 secondi, 2 minuti su goblet squat e stacco rumeno.";
    } else if(tipo === "corsa"){
      tit = "Corsa — " + cfg.label;
      des = "5 minuti di camminata veloce prima, 5 di camminata lenta dopo. " +
        "Ritmo facile: quello in cui riesci a dire una frase intera.";
    } else {
      tit = "Riposo — solo stretching";
      des = "Riposo o camminata. Lo stretching si fa lo stesso: 10 minuti, mai a freddo.";
    }
    /* Lunedì e giovedì: pesata. Conta la media settimanale, non il singolo giorno. */
    var dow = dt.getDay();
    if(dow === 1 || dow === 4){ tit = "Pesati · " + tit; des = "PRIMA DI TUTTO: pesati appena sveglio, prima di mangiare. " + des; }
    var stamp = iso2.replace(/-/g, "") + "T" + pad2(+hh[0]) + pad2(+hh[1]) + "00";
    L.push("BEGIN:VEVENT",
      "UID:palestra-" + iso2 + "@locale",
      "DTSTAMP:" + iso2.replace(/-/g, "") + "T000000Z",
      "DTSTART:" + stamp,
      "DURATION:PT15M",
      "SUMMARY:" + icsEsc("Settimana " + sett + " · " + tit),
      "DESCRIPTION:" + icsEsc(des),
      "BEGIN:VALARM", "TRIGGER:PT0S", "ACTION:DISPLAY",
      "DESCRIPTION:" + icsEsc(tit), "END:VALARM",
      "END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return L.map(piega).join("\r\n") + "\r\n";
}
function scaricaICS(){
  var ora = (document.getElementById("icsOra") || {}).value || "07:30";
  var testo = generaICS(ora), nome = "palestra-settimane-1-4.ics";
  if(window.claude && window.claude.downloads && window.claude.downloads.save){
    window.claude.downloads.save({ filename:nome, data:testo }).catch(function(){ fallbackExport(testo, nome); });
  } else fallbackExport(testo, nome);
}

var ICONE = {

  pesi:  '<path d="M2.5 6v4M4.6 4.4v7.2M11.4 4.4v7.2M13.5 6v4M4.6 8h6.8"/>',
