};
function tileIco(k){ return '<span class="ico"><svg viewBox="0 0 16 16">' + (ICONE[k] || "") + '</svg></span>'; }

/* Sparkline: solo la forma, niente assi. Tufte — sta accanto al numero e il
   trend si "vede" senza leggerlo (regola 4 del design di valore). */
function spark(vals, col){
  if(!vals || vals.length < 2) return '<div class="spark"></div>';
  var W = 100, H = 32, min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if(max - min < 0.0001){ min -= 1; max += 1; }
  var n = vals.length - 1;
  var pt = vals.map(function(v, i){
    return [ (i / n) * W, 3 + (1 - (v - min) / (max - min)) * (H - 8) ];
  });
  var d = pt.map(function(p, i){ return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
  var u = pt[pt.length - 1];
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="' + d + ' L' + W + ' ' + H + ' L0 ' + H + ' Z" fill="' + col + '" opacity=".12"/>' +
    '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2" vector-effect="non-scaling-stroke"' +
      ' stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"' +
      ' style="animation:traccia .9s cubic-bezier(.3,.7,.3,1) forwards"/>' +
    '<circle cx="' + u[0].toFixed(1) + '" cy="' + u[1].toFixed(1) + '" r="2.6" fill="' + col + '"' +
      ' vector-effect="non-scaling-stroke" style="animation:appari .3s .8s ease both"/></svg>';
}
/* Sette barrette: i giorni della settimana. */
function barrette(v){
  return '<svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true">' +
    v.map(function(on, i){
      var w = 100 / v.length, x = i * w + 1.5;
      return '<rect x="' + x.toFixed(1) + '" y="' + (on ? 4 : 18) + '" width="' + (w - 3).toFixed(1) + '" height="' + (on ? 28 : 14) + '" rx="2" ' +
        'fill="' + (on ? "var(--ok)" : "var(--surface-3)") + '" style="animation:appari .3s ' + (0.1 + i * 0.05).toFixed(2) + 's ease both"/>';
    }).join("") + '</svg>';
}
function tile(ic, lab, val, unita, grafico, piede, pill, pillTipo){
  return '<div class="tile"><div class="th">' + tileIco(ic) + '<span class="tl">' + esc(lab) + '</span></div>' +
    '<div class="tv">' + val + (unita ? '<small>' + esc(unita) + '</small>' : "") + '</div>' +
    (grafico || "") +
    '<div class="tf">' + (pill ? '<span class="pill-sm ' + (pillTipo || "") + '">' + esc(pill) + '</span>' : "") +
    '<span>' + esc(piede) + '</span></div></div>';
}

/* ---------- OGGI ---------- */
function vOggi(){

    var lun = iso(mondayOf(now));

      '<div class="eyebrow">Prima di cominciare</div>' +

  var ora = now.getHours();

    Math.round(ft.p) + " g proteine",
    ft.k >= KCAL_MIN ? "in linea" : "mancano " + Math.max(0, Math.round(KCAL_MIN - ft.k)),
    ft.k >= KCAL_MIN ? "ok" : "warn");

  if(!(pesato && S.setup.fermi && S.setup.attrezzi)){
    h += '<div class="card"><div class="eyebrow">Una volta sola</div><div class="checklist">' +
      '<div class="check" data-on="' + (pesato ? 1 : 0) + '"><span class="box">✓</span><span class="lbl">Pesarsi appena sveglio</span></div>' +
      '<button type="button" class="check" data-act="setup" data-id="fermi" data-on="' + (S.setup.fermi ? 1 : 0) + '"><span class="box">✓</span><span class="lbl">Collaudare i fermi del rack<span class="sub">Bilanciere scarico, lasciati cadere sopra apposta</span></span></button>' +
      '<button type="button" class="check" data-act="setup" data-id="attrezzi" data-on="' + (S.setup.attrezzi ? 1 : 0) + '"><span class="box">✓</span><span class="lbl">Identificare i due attacchi<span class="sub">Rullo sotto i polpacci = leg curl · sopra le caviglie = leg extension</span></span></button>' +
      '</div></div>';
  }

  if(w > 4){
    h += '<div class="note warn"><strong>La scheda copre le settimane 1-4.</strong> Da qui in poi ripete la quarta.</div>';
  }
  return h;
}

function gauge(val, scala, min, max, unita, goal){
  var pct = Math.min(100, (val / scala) * 100);
  var z1 = (min / scala) * 100, z2 = (max / scala) * 100;
  var stato = val < min ? "sotto" : val > max ? "sopra" : "dentro";
  return '<div class="gauge">' +
    '<span class="lab"><b class="conta num" data-target="' + Math.round(val) + '">0</b> ' + esc(unita) +
    '<span class="goal">obiettivo ' + esc(goal) + '</span></span>' +
    '<div class="bar"><span class="fill" data-s="' + stato + '" style="width:' + pct.toFixed(1) + '%"></span>' +
    '<span class="zone" style="left:' + z1.toFixed(1) + '%;width:' + (z2-z1).toFixed(1) + '%"></span></div>' +
    '<div class="ticks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>' +
    '</div>';
}

/* ---------- PESI ---------- */

    '<p class="fine">I numeri <strong>in grigio</strong> sono quelli dell\'ultima volta, già pronti: se il peso è quello, tocca solo la spunta e non scrivere niente. Se cambi un numero diventa nero, ed è un dato tuo. Lo schermo resta acceso finché sei su questa scheda.</p>' +

    sets.forEach(function(st, si){

      '" placeholder="es. sedile foro 3 · manubri da 6 kg"></label>' +

      : '<p class="fine">Nessuna zona ripetuta per tre sedute.</p>') +
    '</div>';

  h += '<div class="card"><div class="eyebrow">Come si progredisce</div>' +
    '<p class="fine">Prima le ripetizioni, poi il peso: porti tutte le serie a 12 pulite, <em>solo allora</em> aggiungi carico. Coi manubri e il bilanciere si sale di 2,5 kg grazie ai dischi piccoli; sulle macchine a pila il gradino è 5 kg, che a 50 kg di peso corporeo è tanto — lì riparti da 8 ripetizioni invece che da 10. L\'app te lo propone da sola quando la seduta precedente è chiusa a 12.</p></div>';
  return h;
}

/* ---------- CIBO ---------- */
function vCibo(){
  var d = oggiISO(), t = foodTot(d), lista = foodDay(d);
  var h = bannerStorage();

  h += '<div class="card">' +
    '<div class="eyebrow">Oggi · grana grossa, non bilancia</div>' +
    gauge(t.k, KCAL_MAX + 400, KCAL_MIN, KCAL_MAX, "kcal", "2.400-2.500") +
    gauge(t.p, 140, PROT_MIN, PROT_MAX, "g proteine", "80-110") +
    '<p class="fine">Le due barre dicono se sei sopra o sotto, non contano i grammi.</p>';

  var manca = KCAL_MIN - t.k;
  if(lista.length && manca > 250){
    h += '<div class="note">Mancano <strong>' + Math.round(manca) + ' kcal</strong>. La leva più efficace quando il problema è l\'appetito sono le calorie liquide: un frullato da 650 non attiva la sazietà come lo stesso valore in forma solida. In alternativa due cucchiai d\'olio a crudo e 30 g di frutta secca fanno 370 senza riempirti.</div>';
  } else if(lista.length && t.p < PROT_MIN){
    h += '<div class="note">Sei a <strong>' + Math.round(t.p) + ' g di proteine</strong> contro un minimo di 80. L\'allenamento rompe, il recupero ricostruisce, le proteine sono il materiale: con tre sedute a settimana il cantiere è aperto quasi sempre.</div>';
  }
  h += '</div>';

  if(lista.length){
    h += '<div class="card"><div class="eyebrow">Mangiato oggi</div><div class="eaten">';
    lista.forEach(function(x, i){
      var q = x.q || 1;

  /* Ripeti ieri: quando la giornata si assomiglia, un tocco invece di otto. */
  var ieri = iso(new Date(Date.now() - 86400000));
  if((S.food[ieri] || []).length){
    var ti = (S.food[ieri] || []).reduce(function(a, x){ return a + x.k * (x.q || 1); }, 0);
    h += '<button class="btn wide" data-act="ripetiIeri">Ripeti ieri — ' + S.food[ieri].length + ' voci, ' + Math.round(ti) + ' kcal</button>';
  }

  h += '<div class="card"><div class="eyebrow">Cerca</div>' +
    '<input type="text" id="cerca" placeholder="Scrivi le prime lettere" autocomplete="off"></div>';

  /* I cibi che si e aggiunto da solo, in cima: sono i suoi, li usa piu spesso. */

    h += '<div class="card gruppo" data-g="i tuoi"><div class="eyebrow">I tuoi</div><div class="foods">';
    S.mieiCibi.forEach(function(f, i){
      h += '<div class="mio"><button type="button" class="food" data-act="addFood" data-n="' + esc(f.n) + '" data-k="' + f.k + '" data-p="' + f.p + '">' +
        '<span class="fn">' + esc(f.n) + '</span><span class="fv">' + f.k + ' kcal · ' + f.p + ' g prot</span></button>' +
        '<button type="button" class="delmio" data-act="delMio" data-i="' + i + '" aria-label="togli dai tuoi">×</button></div>';
    });
    h += '</div></div>';
  }

  var gruppi = {};
  FOODS.forEach(function(f){ (gruppi[f.g] = gruppi[f.g] || []).push(f); });
  Object.keys(gruppi).forEach(function(g){
    h += '<div class="card gruppo" data-g="' + esc(g.toLowerCase()) + '"><div class="eyebrow">' + esc(g) + '</div><div class="foods">';
    gruppi[g].forEach(function(f){
      h += '<button type="button" class="food" data-act="addFood" data-n="' + esc(f.n) + '" data-k="' + f.k + '" data-p="' + f.p + '">' +
        '<span class="fn">' + esc(f.n) + '</span><span class="fv">' + f.k + ' kcal · ' + f.p + ' g prot</span></button>';
    });
    h += '</div></div>';
  });

  h += '<div class="card"><div class="eyebrow">Aggiungi una cosa tua</div>' +
    '<div class="row"><input type="text" id="cN" placeholder="Cosa" style="flex:2;min-width:120px">' +
    '<input type="number" id="cK" inputmode="numeric" placeholder="kcal" style="flex:1;min-width:70px">' +
    '<input type="number" id="cP" inputmode="numeric" placeholder="prot" style="flex:1;min-width:70px"></div>' +
    '<button class="btn wide" data-act="addCustom">Aggiungi</button>' +
    '<p class="fine">Resta salvata fra <strong>I tuoi</strong>: la prossima volta è un tocco solo. Vai a occhio — 100 kcal in più o in meno non cambiano niente.</p></div>';

  h += '<div class="card"><div class="eyebrow">Da sapere</div>' +
    '<p class="fine">Il mantenimento stimato è <span class="num">2.100</span> kcal: sotto quella soglia non stai costruendo niente.</p>' +
    '<details class="perche"><summary><span>Perché i numeri qui sono approssimativi</span></summary>' +
    '<p class="fine">Il brief del progetto vieta il conteggio calorico dettagliato, e i valori qui sopra sono indicativi: un petto di pollo vero non fa esattamente 165 kcal. Non serve. Il tuo collo di bottiglia non è la precisione, è <strong>arrivare a 2.400</strong> con un appetito che non è ancora salito. Il numero vero del tuo metabolismo non lo dà nessuna tabella: esce dalla media settimanale del peso, nella scheda Dati.</p>' +
    '<p class="fine">Su questi accorgimenti pratici — densità calorica, pasti piccoli e frequenti — non esistono studi randomizzati, è prassi consolidata. Il meccanismo delle calorie liquide, quello sì, ha supporto sperimentale.</p>' +
    '</details></div>';
  return h;
}

    h += '<p class="fine">La linea tratteggiata è l\'obiettivo dei tre mesi: <strong>15 cm</strong>.</p>' +
      '<details class="perche"><summary><span>Perché non c\'è un valore "normale"</span></summary>' +
      '<p class="fine">Non esistono valori normativi per questo test — in uno studio la media maschile era 21,5 cm ma con deviazione standard di 21,7 e intervallo 0-48. Serve a misurare te nel tempo, non a confrontarti con una tabella.</p>' +
      '</details>';
  }
  h += '</div>';

  /* pesi: storico carichi */
  var storico = EX.map(function(ex){
    var l = lastSession(ex.id, "9999-99-99");
    return { ex:ex, l:l };
  }).filter(function(x){ return x.l; });
  if(storico.length){
    h += '<div class="card"><div class="eyebrow">Carichi attuali</div><div class="scroll"><table><thead><tr><th>Esercizio</th><th>Carico</th><th>Ripetizioni</th><th>Data</th></tr></thead><tbody>';
    storico.forEach(function(x){
      h += '<tr><td>' + esc(x.ex.n) + '</td><td class="n">' + (x.l.sets[0].kg != null ? x.l.sets[0].kg + (x.ex.secs ? "" : " kg") : "corpo") + '</td>' +
        '<td class="n">' + x.l.sets.map(function(s){ return s.reps || 0; }).join("/") + '</td>' +
        '<td class="n">' + esc(x.l.d.slice(8) + "/" + x.l.d.slice(5,7)) + '</td></tr>';
    });
    h += '</tbody></table></div></div>';
  }

  /* stretching settimana */
  var lun = mondayOf(new Date()), xs = 0;
  for(var k = 0; k < 7; k++){
    var dd = new Date(lun); dd.setDate(lun.getDate() + k);
    if(stretchDone(iso(dd))) xs++;
  }
  h += '<div class="card"><div class="eyebrow">Stretching di questa settimana</div>' +
    '<p><span class="conta num" data-target="' + xs + '" style="font-size:26px;font-weight:600">0</span> giorni completi su 7 — obiettivo 5-7.</p></div>';

  /* calendario e promemoria */
  h += vCalendario();
  if(S.start){
    h += '<div class="card"><div class="eyebrow">Promemoria al mattino</div>' +
      '<p class="fine">Questa pagina non può mandarti notifiche: su iPhone servono meccanismi che una pagina web non ha. Quelle vere le dà il <strong>Calendario del telefono</strong>. Qui sotto generi un file con le quattro settimane già dentro — cosa tocca ogni giorno, e nei giorni giusti il promemoria di pesarti. Lo apri e il telefono ti chiede se aggiungerlo.</p>' +
      '<div class="row"><label class="campo" style="flex:1"><input type="time" id="icsOra" value="07:30" style="width:100%"></label>' +
      '<button class="btn primary" data-act="ics" style="flex:2">Genera il calendario</button></div>' +
      '<p class="fine">28 promemoria, uno al giorno all\'ora che scegli. Quando la scheda arriverà alle settimane 5-8 ne rigeneri uno nuovo.</p></div>';
  }

  /* esporta */
  var gEx = giorniDaExport();
  h += '<div class="card"><div class="eyebrow">Backup</div>' +
    '<p class="fine">I dati stanno solo su questo telefono. Esporta ogni tanto e metti il file in <span class="num">app/</span> del progetto: così i numeri sopravvivono al browser.</p>' +
    (exportScaduto()
      ? '<div class="note warn"><strong>' + (gEx === null ? "Non hai mai fatto un backup." : "Ultimo backup " + gEx + " giorni fa.") + '</strong> ' +
        'La perdita di dati è una delle ragioni per cui la gente smette di usare queste app, e su iPhone Safari cancella la memoria dei siti dopo sette giorni senza aprirli. Due tap adesso.</div>'
      : (gEx !== null ? '<p class="fine">Ultimo backup: <span class="num">' + (gEx === 0 ? "oggi" : gEx === 1 ? "ieri" : gEx + " giorni fa") + '</span>.</p>' : "")) +
    '<div class="row"><button class="btn wide" data-act="export">Esporta i dati</button></div>' +
    '<div class="row"><button class="btn ghost wide sm" data-act="showImport">Ripristina da un backup</button></div>' +
    '<div id="importBox" hidden><textarea id="impT" placeholder="Incolla qui il contenuto del file"></textarea><button class="btn wide sm" data-act="import">Ripristina</button></div>' +
    '</div>';

  h += '<div class="card"><div class="eyebrow">Programma</div>' +
    '<p class="fine">Settimana 1 iniziata il <span class="num">' + (S.start ? esc(S.start) : "—") + '</span>.</p>' +
    '<div class="row"><input type="date" id="startD2" value="' + (S.start || oggiISO()) + '" style="flex:1"><button class="btn sm" data-act="setStart2">Cambia</button></div></div>';
  return h;
}

/* ============================================================
   Eventi
   ============================================================ */

document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-tab]"); if(!b) return;
  verso = TABS.indexOf(b.dataset.tab) - TABS.indexOf(tab);
  tab = b.dataset.tab; render();
});

document.getElementById("rest").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.act === "rest-stop") restStop();
  if(b.dataset.act === "rest-add"){ rest.end += 30000; rest.done = false; tickRest(); }
});

document.getElementById("view").addEventListener("click", function(e){
  var el = e.target.closest("[data-act]"); if(!el) return;
  var a = el.dataset.act, d = oggiISO();

  /* ---- seduta guidata ---- */
  if(a === "sesStart"){ sesStart(el.dataset.kind || "pesi"); return; }
  if(a === "sesExit"){ sesExit(); return; }
  if(a === "sesNext"){ sesVai(1); return; }
  if(a === "sesBack"){ sesVai(-1); return; }
  /* Annulla la spunta senza avanzare: stesso comportamento della lista lunga. */
  if(a === "sesToggle"){
    var sT = ses.steps[ses.i];
    setsOf(d, sT.ex.id)[sT.si].done = false;
    save(); render(); return;
  }
  if(a === "sesLista"){ ses.on = false; animaOff(); document.body.classList.remove("in-ses"); tab = "pesi"; render(); return; }
  if(a === "sesPiu30"){ rest.end += 30000; rest.done = false; tickRest(); return; }
  if(a === "sesTimer"){ restStart(+el.dataset.sec, "Tenuta"); return; }
  if(a === "sesHow" || a === "sesFoto"){
    var exH = EX.filter(function(x){ return x.id === el.dataset.id; })[0];
    var box = document.getElementById("sesPop");
    if(box){ box.remove(); return; }
    var corpo = a === "sesFoto"
      ? (DIS[exH.id] ? disegnoAttr(exH.id) + '<p class="fine">' + esc(DIS[exH.id].t) + '</p>' : '<p>Questo è a corpo libero: non c\'è un attrezzo da regolare.</p>')
      : exH.how.map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("") + cercaVideo(exH.id);
    var pan = document.createElement("div");
    pan.className = "pan"; pan.id = "sesPop";
    pan.innerHTML = '<span class="kicker">' + (a === "sesFoto" ? "L'attrezzo" : "Come si fa") + '</span>' + corpo;
    document.querySelector(".ses-body").appendChild(pan);
    /* scrollIntoView spostava l'intera app: si porta in fondo il solo
       contenitore scorrevole. */
    var corpoSes = document.querySelector(".ses-body");
    corpoSes.scrollTop = corpoSes.scrollHeight;
    return;
  }
  if(a === "sesFatto"){
    festaSpunta(el);
    var sf = ses.steps[ses.i], setsF = setsOf(d, sf.ex.id), stF = setsF[sf.si];
    var ik = document.getElementById("sKg"), ir = document.getElementById("sRp");
    var kgF = ik ? parseFloat(ik.value) : NaN, rpF = ir ? parseFloat(ir.value) : NaN;
    stF.kg = isNaN(kgF) ? null : kgF;
    stF.reps = isNaN(rpF) ? (sf.ex.secs ? 20 : 10) : rpF;
    stF.done = true;
    save(); buzz(40);
    sesVai(1); return;
  }
  if(a === "sesStreFatto"){
    stretchDay(d).items[el.dataset.id] = true; save(); buzz(25);
    sesVai(1); return;
  }

  if(a === "go"){ verso = TABS.indexOf(el.dataset.to) - TABS.indexOf(tab); tab = el.dataset.to; render(); return; }

  if(a === "setStart" || a === "setStart2"){
    var inp = document.getElementById(a === "setStart" ? "startD" : "startD2");
    if(!inp.value) return;
    S.start = iso(mondayOf(parseISO(inp.value))); save(); render(); return;
  }

  if(a === "stretch"){
    var sd = stretchDay(d), id = el.dataset.id;
    sd.items[id] = !sd.items[id]; save();
    el.setAttribute("data-on", sd.items[id] ? "1" : "0");
    var box = el.closest(".card").querySelector(".eyebrow");
    var n = STRETCH.filter(function(x){ return sd.items[x.id]; }).length;
    box.textContent = "Stretching · ogni giorno · " + n + " di " + STRETCH.length;
    return;
  }
  if(a === "timer30"){ e.stopPropagation(); restStart(+el.dataset.sec, el.dataset.label); return; }

  if(a === "setup"){ S.setup[el.dataset.id] = !S.setup[el.dataset.id]; save(); render(); return; }

  if(a === "how"){
    var box2 = document.getElementById("how-" + el.dataset.id);
    box2.hidden = !box2.hidden;
    el.textContent = box2.hidden ? "Come si fa" : "Chiudi";
    return;
  }

  if(a === "st"){
    var inp2 = el.parentElement.querySelector("input");
    var step = parseFloat(el.dataset.dl);
    var cur = parseFloat(inp2.value);
    if(isNaN(cur)) cur = el.dataset.f === "reps" ? (step > 0 ? 10 : 10) : 0;
    else cur = cur + step;
    if(cur < 0) cur = 0;
    inp2.value = Math.round(cur * 100) / 100;
    writeSet(inp2); return;
  }

  if(a === "done"){
    var row = el.closest(".set");
    var exId = row.dataset.ex, i = +row.dataset.i;
    var ex = EX.filter(function(x){ return x.id === exId; })[0];
    var sets = setsOf(d, exId);
    sets[i].done = !sets[i].done;
    if(sets[i].done){
      row.querySelectorAll("input").forEach(function(inp3){ writeSet(inp3); });
      if(sets[i].reps == null) sets[i].reps = ex.secs ? 20 : 10;
      restStart(ex.rest, ex.n + " · serie " + (i+1));
      buzz(40); festaSpunta(el);
    }
    save();
    row.setAttribute("data-done", sets[i].done ? "1" : "0");
    row.setAttribute("data-prop", "0");
    row.querySelectorAll("input").forEach(function(inp4){
      if(inp4.dataset.f === "reps" && !inp4.value) inp4.value = sets[i].reps;
    });
    return;
  }

  if(a === "zona"){
    if(!S.pain[d]) S.pain[d] = [];
    var z = el.dataset.z, k = S.pain[d].indexOf(z);
    if(k >= 0) S.pain[d].splice(k, 1); else S.pain[d].push(z);
    save(); render(); return;
  }

  if(a === "runPlay"){ runStart(); render(); return; }
  if(a === "runPause"){ runPause(); render(); return; }
  if(a === "runSkip"){ if(!run.started){ run.seq = buildSeq(weekClamped()); run.i = 0; run.started = true; } runNext(); render(); return; }
  if(a === "runStop"){ run.started = false; run.playing = false; syncWake(); render(); return; }
  if(a === "ellittica"){
    S.runs.push({ d:d, week:weekClamped(), kind:"ellittica", rpe:null }); save(); render(); return;
  }

  if(a === "addFood"){
    foodDay(d).push({ n:el.dataset.n, k:+el.dataset.k, p:+el.dataset.p });
    save(); buzz(25); render(); return;
  }
  if(a === "delFood"){ foodDay(d).splice(+el.dataset.i, 1); save(); render(); return; }
  /* Mezza porzione e doppia porzione: il piatto cambia piu spesso del cibo. */
  if(a === "qPiu" || a === "qMeno"){
    var vx = foodDay(d)[+el.dataset.i];
    var q = (vx.q || 1) + (a === "qPiu" ? 0.5 : -0.5);
    if(q < 0.5) q = 0.5;
    vx.q = Math.round(q * 10) / 10;
    save(); render(); return;
  }
  if(a === "ripetiIeri"){
    var ie = S.food[iso(new Date(Date.now() - 86400000))] || [];
    ie.forEach(function(x){ foodDay(d).push({ n:x.n, k:x.k, p:x.p, q:x.q || 1 }); });
    save(); buzz(30); render(); return;
  }
  if(a === "delMio"){ S.mieiCibi.splice(+el.dataset.i, 1); save(); render(); return; }
  if(a === "addCustom"){
    var n2 = document.getElementById("cN").value.trim();
    var k2 = parseFloat(document.getElementById("cK").value);
    var p2 = parseFloat(document.getElementById("cP").value);
    if(!n2 || isNaN(k2)) return;
    var voce = { n:n2, k:Math.round(k2), p:isNaN(p2) ? 0 : Math.round(p2) };
    foodDay(d).push({ n:voce.n, k:voce.k, p:voce.p });
    /* e resta: la prossima volta e un tocco solo */
    if(!S.mieiCibi.some(function(x){ return x.n.toLowerCase() === voce.n.toLowerCase(); })) S.mieiCibi.push(voce);
    save(); render(); return;
  }

  if(a === "addPeso"){
    var wd = document.getElementById("wD").value, wk2 = parseFloat(document.getElementById("wK").value);
    if(!wd || isNaN(wk2)) return;
    S.weights = S.weights.filter(function(x){ return x.d !== wd; });
    S.weights.push({ d:wd, kg:wk2 }); save(); render(); return;
  }
  if(a === "addFtf"){
    var fd = document.getElementById("fD").value, fc = parseFloat(document.getElementById("fC").value);
    if(!fd || isNaN(fc)) return;
    S.ftf = S.ftf.filter(function(x){ return x.d !== fd; });
    S.ftf.push({ d:fd, cm:fc }); save(); render(); return;
  }

  /* Tocca un giorno del calendario: si apre il dettaglio, ritoccalo e si chiude. */
  if(a === "giorno"){ giornoSel = (giornoSel === el.dataset.d) ? null : el.dataset.d; render(); return; }
  if(a === "giornoChiudi"){ giornoSel = null; render(); return; }
  if(a === "ics"){ scaricaICS(); return; }
  if(a === "export"){ doExport(); return; }
  if(a === "showImport"){ var ib = document.getElementById("importBox"); ib.hidden = !ib.hidden; return; }
  if(a === "import"){
    try{
      var o = JSON.parse(document.getElementById("impT").value);
      if(!o || typeof o.v !== "number") throw 0;
      if(o.v > SCHEMA){ alert("Questo backup viene da una versione piu recente dell'app. Aggiorna l'app prima di ripristinarlo."); return; }
      S = migra(o); save(); render();
    }catch(err){ alert("Il testo incollato non è un backup valido. Deve iniziare con una graffa e contenere tutti i dati del file esportato."); }
    return;
  }
});

document.getElementById("view").addEventListener("change", function(e){
  if(e.target.matches(".set input")) writeSet(e.target);
  if(e.target.matches("[data-reg]")){ S.regol[e.target.dataset.reg] = e.target.value.trim(); save(); }
});
document.getElementById("view").addEventListener("input", function(e){
  if(e.target.matches("[data-reg]")){ S.regol[e.target.dataset.reg] = e.target.value.trim(); save(); }
});
/* Il movimento accanto a un campo aperto e solo disturbo: la figura si ferma. */
document.getElementById("view").addEventListener("focusin", function(e){
  if(e.target.matches("input")) anim.ferma = true;
});
document.getElementById("view").addEventListener("focusout", function(e){
  if(e.target.matches("input")) anim.ferma = false;
});

/* Filtro dei cibi. Non passa da render(): riscrivere la vista a ogni lettera
   farebbe perdere il campo mentre scrivi. Si nascondono i bottoni e basta. */
document.getElementById("view").addEventListener("input", function(e){
  if(e.target.id !== "cerca") return;
  var q = e.target.value.trim().toLowerCase();
  Array.prototype.forEach.call(document.querySelectorAll(".gruppo"), function(g){
    var visti = 0;
    Array.prototype.forEach.call(g.querySelectorAll(".foods .food"), function(b){
      var ok = !q || b.dataset.n.toLowerCase().indexOf(q) >= 0;
      var riga = b.parentElement.classList.contains("mio") ? b.parentElement : b;
      riga.style.display = ok ? "" : "none";
      if(ok) visti++;
    });
    g.style.display = visti ? "" : "none";
  });
});

function writeSet(inp){
  var row = inp.closest(".set"); if(!row) return;
  var sets = setsOf(oggiISO(), row.dataset.ex);
  var i = +row.dataset.i;
  /* Se la riga era ancora una proposta, toccarla la promuove per intero: si
     scrivono tutti i campi visibili, non solo quello modificato, altrimenti
     resterebbe mezza registrata e mezza suggerita. */
  var campi = row.dataset.prop === "1" ? row.querySelectorAll("input") : [inp];
  Array.prototype.forEach.call(campi, function(x){
    var v = parseFloat(x.value);
    sets[i][x.dataset.f] = isNaN(v) ? null : v;
  });
  row.setAttribute("data-prop", "0");
  save();
}

function doExport(){
  var payload = JSON.stringify(S, null, 1);
  var name = "palestra-" + oggiISO() + ".json";
  if(window.claude && window.claude.downloads && window.claude.downloads.save){
    window.claude.downloads.save({ filename:name, data:payload })
      .then(function(){ segnaExport(); })
      .catch(function(){ fallbackExport(payload, name); });
  } else fallbackExport(payload, name);
}
/* Segnato solo quando il salvataggio e andato a buon fine: se l'utente annulla
   il download il promemoria deve restare acceso. */
function segnaExport(){
  S.lastExport = oggiISO(); save();
  if(tab === "dati") render();
}
function fallbackExport(payload, name){
  try{
    var blob = new Blob([payload], { type:"application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    segnaExport();
  }catch(e){
    var ib = document.getElementById("importBox");
    if(ib){ ib.hidden = false; document.getElementById("impT").value = payload; }
    alert("Non riesco a scaricare il file da qui. Ho messo i dati nel riquadro di testo qui sotto: copiali e incollali in un file.");
  }
}

render();
</script>
