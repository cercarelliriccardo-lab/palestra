/* Il JSON e' pieno di accenti e di "·". btoa() da solo si strozza su
   qualunque byte sopra 255, quindi si passa per i byte veri. */
function b64enc(s){
  var b = new TextEncoder().encode(s), t = "", i;
  for(i = 0; i < b.length; i++) t += String.fromCharCode(b[i]);
  return btoa(t);
}
function b64dec(s){
  var t = atob(String(s).replace(/\s/g, "")), b = new Uint8Array(t.length), i;
  for(i = 0; i < t.length; i++) b[i] = t.charCodeAt(i);
  return new TextDecoder().decode(b);
}

/* ---------- la fusione: non toglie mai niente ---------- */

/* Quanto "contiene" un valore. Serve solo a scegliere fra due versioni dello
   stesso giorno: vince la piu' piena. Grezzo di proposito — sbagliare in
   eccesso qui costa un dato di troppo, sbagliare in difetto costa un dato. */
function quanto(x){ try{ return JSON.stringify(x).length; }catch(e){ return 0; } }
function piuPieno(a, b){ return quanto(a) >= quanto(b) ? a : b; }

function fondiMappa(loc, rem, scegli){
  var out = {}, k;
  loc = loc || {}; rem = rem || {};
  for(k in rem) if(Object.prototype.hasOwnProperty.call(rem, k)) out[k] = rem[k];
  for(k in loc) if(Object.prototype.hasOwnProperty.call(loc, k)){
    out[k] = Object.prototype.hasOwnProperty.call(rem, k) ? scegli(loc[k], rem[k]) : loc[k];
  }
  return out;
}

/* Liste indicizzate da una chiave, di solito la data. A parita' di chiave
   vince il LOCALE: e' il telefono dove hai appena scritto, quindi se hai
   corretto un peso la correzione e' quella buona. E niente va perso davvero
   comunque — il valore di prima resta nella storia del repository. */
function fondiLista(loc, rem, chiave){
  var m = {}, ord = [], i, k;
  function metti(x){
    if(!x) return;
    k = chiave(x);
    if(!Object.prototype.hasOwnProperty.call(m, k)) ord.push(k);
    m[k] = x;
  }
  for(i = 0; i < (rem || []).length; i++) metti(rem[i]);
  for(i = 0; i < (loc || []).length; i++) metti(loc[i]);
  ord.sort();
  return ord.map(function(x){ return m[x]; });
}

/* "Vuoto" vuol dire: niente che tu abbia mai scritto. ftf resta fuori dal
   conto perche' fresh() ci mette dentro la misura del 31/07 come punto di
   partenza, e quella c'e' anche in uno stato appena nato. */
function vuoto(o){
  if(!o) return true;
  return !(o.weights || []).length
      && !(o.runs || []).length
      && !Object.keys(o.sessions || {}).length
      && !Object.keys(o.stretch || {}).length
      && !Object.keys(o.food || {}).length
      && !Object.keys(o.pain || {}).length;
}

function fondi(loc, rem){
  if(!rem) return loc;
  if(!loc) return migra(rem);
  /* Il caso che conta davvero: il telefono si e' svuotato e in rete ci sono
     i tuoi dati. Si adotta il remoto intero senza fondere, altrimenti i
     valori di partenza di fresh() si metterebbero sopra quelli veri. */
  if(vuoto(loc) && !vuoto(rem)) return migra(rem);
  var o = migra(JSON.parse(JSON.stringify(loc)));
  var r = migra(JSON.parse(JSON.stringify(rem)));
  o.sessions = fondiMappa(o.sessions, r.sessions, piuPieno);
  o.stretch  = fondiMappa(o.stretch,  r.stretch,  piuPieno);
  o.food     = fondiMappa(o.food,     r.food,     piuPieno);
  o.pain     = fondiMappa(o.pain,     r.pain,     piuPieno);
  o.serie    = fondiMappa(o.serie,    r.serie,    piuPieno);
  /* L'ordine di un giorno non si "fonde": e' una sequenza, e mescolarne due
     darebbe una terza che nessuno ha scelto. Vince il locale, cioe' il
     telefono su cui hai spostato le cose. */
  o.ordine   = fondiMappa(o.ordine,   r.ordine,   function(a, b){ return a || b; });
  /* La scelta di un giorno e' un fatto di quel giorno, come le serie. */
  o.scelta   = fondiMappa(o.scelta,   r.scelta,   piuPieno);
  o.extra    = fondiMappa(o.extra,    r.extra,    function(a, b){ return (a && a.length) ? a : b; });
  o["default"]  = fondiMappa(o["default"],  r["default"],  function(a, b){ return a || b; });
  o.rifiutati   = fondiMappa(o.rifiutati,   r.rifiutati,   function(a, b){ return a || b; });
  /* I passi sono un dato del giorno, come il peso: vince il piu recente
     scritto a mano, cioe il locale. */
  o.passi    = fondiMappa(o.passi,    r.passi,    function(a, b){ return a != null ? a : b; });
  o.tessere  = (o.tessere !== undefined) ? o.tessere : r.tessere;
  /* Il profilo e uno: vince quello locale se e stato confermato, altrimenti
     arriva dalla rete. Fonderlo campo per campo darebbe una persona che non
     esiste. */
  o.profilo  = (o.profilo && o.profilo.fatto) ? o.profilo : (r.profilo || o.profilo);
  /* Le regolazioni sono testo scritto da te: vince quello che c'e', non il
     piu' lungo — "foro 3" non deve perdere contro una frase vecchia. */
  o.regol = fondiMappa(o.regol, r.regol, function(a, b){
    return (a && String(a).trim()) ? a : b;
  });
  o.weights  = fondiLista(o.weights,  r.weights,  function(x){ return x.d; });
  o.ftf      = fondiLista(o.ftf,      r.ftf,      function(x){ return x.d; });
  o.kw       = fondiLista(o.kw,       r.kw,       function(x){ return x.d; });
  o.runs     = fondiLista(o.runs,     r.runs,     function(x){ return x.d + "|" + (x.kind || ""); });
  o.mieiCibi = fondiLista(o.mieiCibi, r.mieiCibi, function(x){ return String(x.n || "").toLowerCase(); });
  o.ordineBase = (o.ordineBase && o.ordineBase.length) ? o.ordineBase : (r.ordineBase || []);
  /* Come l'ordine: e' una selezione, non un insieme. Fonderla darebbe quattro
     o cinque esercizi al posto di tre. Vince il telefono su cui hai scelto. */
  o.streSel = (o.streSel && o.streSel.length) ? o.streSel : (r.streSel || STRE_DIFETTO.slice());
  o.start = o.start || r.start;
  o.setup = {
    fermi:    !!((o.setup || {}).fermi    || (r.setup || {}).fermi),
    attrezzi: !!((o.setup || {}).attrezzi || (r.setup || {}).attrezzi)
  };
  o.lastExport = (o.lastExport && r.lastExport)
    ? (o.lastExport > r.lastExport ? o.lastExport : r.lastExport)
    : (o.lastExport || r.lastExport);
  o.v = SCHEMA;
  return o;
}

/* ---------- GitHub ---------- */

function ghUrl(c){
  return "https://api.github.com/repos/" + encodeURIComponent(c.owner) +
         "/" + encodeURIComponent(c.repo) + "/contents/" + (c.file || "stato.json");
}
function ghHead(c){
  return {
    "Authorization": "Bearer " + c.token,
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  };
}
function ghErr(r){
  if(r.status === 401 || r.status === 403) return { t:"auth", s:r.status };
  if(r.status === 404) return { t:"manca", s:404 };
  if(r.status === 409 || r.status === 422) return { t:"conflitto", s:r.status };
  return { t:"rete", s:r.status };
}
/* Il repository dei dati DEVE essere privato: dentro stato.json finiscono
   peso, misure e le zone dove hai male. Si chiede una volta sola per sessione
   e si urla se e pubblico — un backup che espone i tuoi dati sanitari e
   peggio di nessun backup, perche non lo sai. */
function ghControllaPrivato(c){
  if(sy.privChk) return;
  sy.privChk = true;
  fetch("https://api.github.com/repos/" + encodeURIComponent(c.owner) + "/" + encodeURIComponent(c.repo),
        { headers: ghHead(c), cache: "no-store" })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if(j && j.private === false){ sy.pubblico = true; render(); }
    })
    .catch(function(){});
}
function ghLeggi(c){
  /* no-store piu' un parametro buttato dentro: il telefono mette in cache
     anche le risposte dell'API, e fondere con una versione vecchia sarebbe
     esattamente il modo di riesumare dati sorpassati. */
  return fetch(ghUrl(c) + "?t=" + Date.now(), { headers:ghHead(c), cache:"no-store" })
    .then(function(r){
      if(r.status === 404) return { dati:null, sha:null };   /* prima volta: il file non c'e' ancora */
      if(!r.ok) throw ghErr(r);
      return r.json().then(function(j){
        var o = null;
        try{ o = JSON.parse(b64dec(j.content || "")); }catch(e){ o = null; }
        return { dati:o, sha:j.sha };
      });
    });
}
function ghScrivi(c, testo, sha){
  var body = {
    message: "palestra " + new Date().toISOString().slice(0, 16).replace("T", " "),
    content: b64enc(testo)
  };
  if(sha) body.sha = sha;   /* senza sha GitHub crea; con lo sha sbagliato rifiuta, ed e' cio che vogliamo */
  return fetch(ghUrl(c), { method:"PUT", headers:ghHead(c), body:JSON.stringify(body) })
    .then(function(r){
      if(!r.ok) throw ghErr(r);
      return r.json().then(function(j){ return (j.content || {}).sha || null; });
    });
}

/* ---------- lo stato, e la riga che lo dice ---------- */

var sy = { s:"off", quando:null, msg:"", sha:null, inCorso:false, ancora:false, timer:null, tentativi:0, privChk:false, pubblico:false };
/* Errore del collegamento, mostrato dentro la pagina e non con alert(): sul
   telefono le finestre di sistema a volte non compaiono affatto — imparato
   nella v1.9.5, dove un messaggio importante non si vedeva mai. */
var syErr = "";

function syncStato(s, msg){
  sy.s = s; sy.msg = msg || "";
  if(s === "ok"){ sy.quando = new Date(); sy.tentativi = 0; }
  disegnaSy();
}
function oraBreve(d){
  return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}
function syTesto(){
  if(sy.s === "off")     return "";
  if(sy.s === "lavoro")  return "salvo…";
  if(sy.s === "attesa")  return "da salvare";
  if(sy.s === "offline") return "senza rete";
  if(sy.s === "auth")    return "token scaduto";
  if(sy.s === "errore")  return "non salvato";
  return sy.quando ? "salvato " + oraBreve(sy.quando) : "salvato";
}
function disegnaSy(){
  var el = document.getElementById("syBar");
  if(!el) return;
  var t = syTesto();
  el.hidden = !t;
  el.textContent = t;
  el.setAttribute("data-s", sy.s);
}

/* Un giro intero: leggi, fondi, riscrivi. Leggere PRIMA di scrivere e' cio
   che rende sicura tutta la faccenda: senza, un telefono appena svuotato
   pubblicherebbe il vuoto sopra i dati veri. */
function syncOra(){
  var c = syncCfg();
  if(!c){ syncStato("off"); return Promise.resolve(); }
  if(sy.inCorso){ sy.ancora = true; return Promise.resolve(); }
  if(navigator.onLine === false){ syncStato("offline"); return Promise.resolve(); }
  sy.inCorso = true;
  syncStato("lavoro");
  ghControllaPrivato(c);
  return ghLeggi(c).then(function(r){
    var unito = r.dati ? fondi(S, r.dati) : S;
    var prima = JSON.stringify(S);
    var dopo  = JSON.stringify(unito);
    var cambiato = dopo !== prima;
    if(cambiato){ S = unito; salvaLocale(); }
    /* Gia' identico la' sopra: nessun commit inutile. */
    if(r.dati && JSON.stringify(r.dati) === dopo){
      sy.sha = r.sha; syncStato("ok");
      if(cambiato) render();
      return;
    }
    return ghScrivi(c, JSON.stringify(S, null, 1), r.sha).then(function(nuovo){
      sy.sha = nuovo; syncStato("ok");
      if(cambiato) render();
    });
  }).catch(function(e){
    var t = (e && e.t) || "rete";
    if(t === "auth"){
      syncStato("auth", "GitHub ha rifiutato il token (" + e.s + "). Se e' scaduto va rifatto e reincollato.");
      return;
    }
    if(t === "manca"){
      syncStato("errore", "Repository non trovato: controlla proprietario e nome, e che il token veda proprio quello.");
      return;
    }
    /* Conflitto o rete che non va: si riprova, con attese sempre piu' lunghe.
       Il conflitto si risolve da se' — al giro dopo si rilegge lo sha nuovo
       e si rifonde, che e' esattamente la cosa giusta da fare. */
    syncStato("errore", "Non sono riuscito a salvare in rete. Riprovo da solo.");
    sy.tentativi++;
    if(sy.tentativi <= 4){
      clearTimeout(sy.timer);
      sy.timer = setTimeout(syncOra, Math.min(60000, 3000 * Math.pow(2, sy.tentativi)));
    }
  }).then(function(){
    sy.inCorso = false;
    if(sy.ancora){
      sy.ancora = false;
      clearTimeout(sy.timer);
      sy.timer = setTimeout(syncOra, 1200);
    }
  });
}

/* Chiamata da save(), cioe' da ogni singola modifica. Aspetta che tu abbia
   smesso di toccare lo schermo invece di sparare una richiesta per ogni
   spunta: fra una serie e l'altra ne partirebbero decine. */
function syncTocca(){
  if(!syncCfg()) return;
  if(sy.s !== "lavoro") syncStato("attesa");
  clearTimeout(sy.timer);
  sy.timer = setTimeout(function(){ sy.tentativi = 0; syncOra(); }, 4000);
}

window.addEventListener("online",  function(){ sy.tentativi = 0; syncOra(); });
window.addEventListener("offline", function(){ syncStato("offline"); });
/* Tornando sull'app dopo averla lasciata: puo' aver scritto un altro
   dispositivo, e comunque un invio rimasto in sospeso va chiuso. */
document.addEventListener("visibilitychange", function(){
  if(!document.hidden) syncOra();
});

/* Dopo il primo render, non prima: all'apertura si scarica quello che c'e'
   in rete e si fonde. E' il momento in cui un telefono svuotato si
   ripopola da solo, senza che tu debba fare niente. */
setTimeout(function(){ if(syncCfg()) syncOra(); else disegnaSy(); }, 0);

/* ============================================================
   Date e settimane
   ============================================================ */

function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parseISO(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function oggiISO(){ return iso(new Date()); }
function mondayOf(d){
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var w = x.getDay(); var diff = (w === 0 ? -6 : 1 - w);
  x.setDate(x.getDate() + diff); return x;
}
function weekOf(isoDate){
  if(!S.start) return null;
  var a = parseISO(S.start), b = parseISO(isoDate);
  var days = Math.floor((b - a) / 86400000);
  return Math.floor(days / 7) + 1;
}
function weekNow(){ var w = weekOf(oggiISO()); return w; }
function weekClamped(){ var w = weekNow(); if(w === null) return 1; return Math.max(1, Math.min(4, w)); }
function serieCount(){ return weekNow() === 1 ? 2 : 3; }
/* Quante serie oggi per questo esercizio. Di regola quelle della scheda, ma
   se le hai cambiate a mano vince il tuo numero: alcuni giorni ne hai una in
   piu nelle gambe, altri no, e il piano non deve impedirtelo. */
function nSerie(d, exId){
  var m = S.serie[d];
  return (m && m[exId]) || serieCount();
}
/* Non si toglie una serie gia registrata: prima si annulla la spunta.
   Altrimenti un tocco sbagliato cancella un numero vero. */
function cambiaSerie(d, exId, delta){
  var arr = setsOf(d, exId);
  if(delta < 0){
    if(arr.length <= 1) return "minimo";
    if(arr[arr.length - 1].done) return "spuntata";
    arr.pop();
  }
  if(!S.serie[d]) S.serie[d] = {};
  S.serie[d][exId] = arr.length + (delta > 0 ? delta : 0);
  save(); return true;
}
/* ---------- L'ORDINE DEGLI ESERCIZI ----------
   Tre livelli, dal piu specifico: quello che hai spostato oggi, il tuo ordine
   abituale, e in fondo la scheda. Stessa idea di nSerie(): la scheda e' il
   valore di riferimento, non una gabbia. Serve perche' in sala la macchina
   che ti tocca puo' essere occupata, e aspettare non e' allenarsi. */
function exDi(id){ var t = null; EXALL.forEach(function(x){ if(x.id === id) t = x; }); return t; }
function slotDi(sid){ var t = null; SLOT.forEach(function(s){ if(s.id === sid) t = s; }); return t; }
/* Dall'id di un esercizio allo slot che lo contiene. */
function slotDiEx(exId){
  var t = null;
  SLOT.forEach(function(s){ if(s.def === exId || s.alt.indexOf(exId) >= 0) t = s; });
  return t;
}
function variantiSlot(s){
  return [s.def].concat(s.alt).map(exDi)
    .filter(Boolean).filter(function(v){ return haiAttrezzi(v.id); });
}
/* Tutte, anche quelle che non puoi fare: serve alla schermata di scelta per
   dire "questa ci sarebbe, ma ti manca l attrezzo" invece di nasconderla. */
function variantiTutte(s){ return [s.def].concat(s.alt).map(exDi).filter(Boolean); }

/* Le varianti si aprono dalla settimana 5, e non e' prudenza generica: lo
   studio che le autorizza (Baz-Valle 2019) e' su uomini GIA' ALLENATI. Al
   primo mese il guadagno e' nervoso — il cervello impara il movimento
   ripetendolo — e cambiare esercizio ogni volta fa ricominciare da capo.
   vincoli.md 1-quinquies. Sullo stretching questo blocco NON c'e', ed e'
   voluto: li' non c'e' nessuna progressione di carico da proteggere. */
function variantiAperte(){ var w = weekNow(); return w !== null && w >= 5; }

/* Quale esercizio occupa quello slot in quel giorno. La scelta di un giorno
   passato vale sempre, anche se oggi le varianti fossero chiuse: riaprire una
   seduta vecchia deve mostrare cio' che avevi fatto davvero quel giorno. */
function exDelloSlot(d, sid){
  var s = slotDi(sid); if(!s) return null;
  var scelta = (S.scelta && S.scelta[d] && S.scelta[d][sid]) || null;
  var pref = variantiAperte() ? ((S.default && S.default[sid]) || null) : null;
  var id = scelta || pref || s.def;
  /* Se non hai l attrezzo del predefinito, si scende alla prima variante che
     puoi davvero fare. Se non ce n e nessuna lo slot resta vuoto e la seduta
     lo salta: meglio un pattern mancante e detto che un esercizio che non
     puoi eseguire. */
  if(!haiAttrezzi(id)){
    var d1 = variantiSlot(s)[0];
    return d1 || null;
  }
  return exDi(id) || exDi(s.def);
}

function ordineIds(d){
  var salvato = (S.ordine && S.ordine[d])
    || ((S.ordineBase && S.ordineBase.length) ? S.ordineBase : null)
    || [];
  var out = [];
  salvato.forEach(function(x){
    /* Fino alla v2.2 qui c'erano id di ESERCIZIO. Con le varianti l'ordine
       deve essere per SLOT, altrimenti cambiando esercizio un ordine salvato
       non troverebbe piu' nulla. Si accettano tutte e due le forme. */
    var sid = slotDi(x) ? x : (slotDiEx(x) || {}).id;
    if(sid && out.indexOf(sid) < 0) out.push(sid);
  });
  /* Difesa: uno slot mancante dall'ordine salvato viene accodato invece che
     perso. Senza, cambiare SLOT farebbe sparire un pattern dalla settimana. */
  SLOT.forEach(function(s){ if(out.indexOf(s.id) < 0) out.push(s.id); });
  return out;
}

/* Le voci della seduta: slot piu esercizio. Gli AGGIUNTIVI (leg curl, alzate
   laterali) hanno sid null — non prendono il posto di nulla e stanno in fondo. */
function vociOggi(d){
  var out = ordineIds(d).map(function(sid){ return { sid:sid, ex:exDelloSlot(d, sid) }; })
                        .filter(function(v){ return v.ex; });
  ((((S.extra || {})[d]) || [])).forEach(function(id){
    var e = exDi(id);
    if(e && !out.some(function(v){ return v.ex.id === id; })) out.push({ sid:null, ex:e });
  });
  return out;
}
function exOggi(d){ return vociOggi(d).map(function(v){ return v.ex; }); }
/* Posizione dell'esercizio nella seduta di quel giorno, aggiuntivi compresi.
   Non si puo' piu' cercare l'id dell'esercizio dentro ordineIds(), che ora
   contiene slot. */
function posEx(d, exId){
  var i = -1;
  vociOggi(d).forEach(function(v, k){ if(v.ex.id === exId) i = k; });
  return i;
}
function scriviOrdine(d, ids){
  if(!S.ordine) S.ordine = {};
  S.ordine[d] = ids;
  save();
}
/* Da qui in giu' si lavora su id di SLOT, non di esercizio. */
function spostaEx(d, sid, delta){
  var ids = ordineIds(d), i = ids.indexOf(sid), j = i + delta;
  if(i < 0 || j < 0 || j >= ids.length) return false;
  ids.splice(j, 0, ids.splice(i, 1)[0]);
  scriviOrdine(d, ids);
  return true;
}
/* "Rimanda a dopo": in mezzo a una seduta e' l'unico gesto che serve davvero
   quando trovi la macchina occupata. Sposta in fondo, non di un posto. */
function rimandaEx(d, sid){
  var ids = ordineIds(d), i = ids.indexOf(sid);
  if(i < 0 || i === ids.length - 1) return false;
  ids.splice(i, 1); ids.push(sid);
  scriviOrdine(d, ids);
  return true;
}
function fissaOrdine(d){ S.ordineBase = ordineIds(d).slice(); save(); }
function ordineDiRiferimento(){
  if(S.ordineBase && S.ordineBase.length){
    var n = [];
    S.ordineBase.forEach(function(x){
      var sid = slotDi(x) ? x : (slotDiEx(x) || {}).id;
      if(sid && n.indexOf(sid) < 0) n.push(sid);
    });
    SLOT.forEach(function(s){ if(n.indexOf(s.id) < 0) n.push(s.id); });
    return n.join(",");
  }
  return SLOT.map(function(s){ return s.id; }).join(",");
}

/* ---------- la scelta della variante ---------- */

/* Vale per il giorno, non per sempre. */
function scegliVariante(d, sid, exId){
  if(!S.scelta) S.scelta = {};
  if(!S.scelta[d]) S.scelta[d] = {};
  S.scelta[d][sid] = exId;
  save();
}
/* Gli aggiuntivi: si accodano, non sostituiscono. */
function togliExtra(d, exId){
  if(!S.extra || !S.extra[d]) return;
  S.extra[d] = S.extra[d].filter(function(x){ return x !== exId; });
  save();
}
function aggiungiExtra(d, exId){
  if(!S.extra) S.extra = {};
  if(!S.extra[d]) S.extra[d] = [];
  if(S.extra[d].indexOf(exId) < 0) S.extra[d].push(exId);
  save();
}
/* Dopo tre sedute di fila con la stessa variante l'app propone di renderla
   predefinita. Una domanda sola: se la rifiuti non torna, perche' un
   promemoria ricorrente su una preferenza e' esattamente il tipo di rumore
   che fa smettere di usare queste app. */
function treVolteDiFila(sid){
  var gg = sedute().slice(-3);
  if(gg.length < 3) return null;
  var primi = gg.map(function(g){ return ((S.scelta || {})[g] || {})[sid]; });
  if(!primi[0] || primi[0] !== primi[1] || primi[1] !== primi[2]) return null;
  if(((S.default || {})[sid]) === primi[0]) return null;
  if(((S.rifiutati || {})[sid]) === primi[0]) return null;
  return primi[0];
}
function ordineSpostatoOggi(d){ return ordineIds(d).join(",") !== ordineDiRiferimento(); }

function dataLunga(d){ return GIORNI[d.getDay()] + " " + d.getDate() + " " + MESI[d.getMonth()]; }
function mmss(s){
  s = Math.max(0, Math.round(s));
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ============================================================
   Accessori sullo stato
   ============================================================ */

function sessionOf(d){ if(!S.sessions[d]) S.sessions[d] = {}; return S.sessions[d]; }
function setsOf(d, exId){
  var s = sessionOf(d);
  var need = nSerie(d, exId);
  if(!s[exId]) s[exId] = [];
  while(s[exId].length < need) s[exId].push({ kg:null, reps:null, done:false });
  return s[exId];
}
function lastSession(exId, beforeISO){
  var keys = Object.keys(S.sessions).filter(function(k){ return k < beforeISO; }).sort();
  for(var i = keys.length - 1; i >= 0; i--){
    var arr = S.sessions[keys[i]][exId];
    if(arr && arr.some(function(x){ return x.done; })) return { d:keys[i], sets:arr.filter(function(x){ return x.done; }) };
  }
  return null;
}
function suggerimento(exId, beforeISO){
  var ex = exDi(exId);
  var last = lastSession(exId, beforeISO);
  if(!last) return null;
  var soglia = ex.secs ? 30 : 12;
  var tutte = last.sets.length >= 2 && last.sets.every(function(s){ return (s.reps || 0) >= soglia; });
  var kg = last.sets[0].kg;
  if(tutte && kg != null) return { kg: Math.round((kg + ex.step) * 100) / 100, base:kg };
  return null;
}
/* Cosa scrivere nei campi di una serie non ancora registrata.
   Il pattern e quello di Strong e Hevy: i numeri dell'ultima volta sono gia
   dentro, si tocca la spunta e basta. Nella revisione JMIR 2024 (18 studi,
   525.824 partecipanti) l'esperienza d'uso scomoda e la prima ragione di
   abbandono su sei e il costo di inserimento dati e la quarta.
   Se l'ultima volta erano chiuse tutte al massimo, la proposta e gia il
   carico salito: la regola "prima ripetizioni, poi peso" applicata da sola. */
function proposta(exId, beforeISO){
  var ex = exDi(exId);
  var last = lastSession(exId, beforeISO);
  if(!last) return null;
  var soglia = ex.secs ? 30 : 12;
  var base = ex.secs ? 20 : 10;
  var ultime = last.sets[last.sets.length - 1].reps || base;
  var chiuse = last.sets.length >= 2 && last.sets.every(function(s){ return (s.reps || 0) >= soglia; });
  if(ex.secs) return { kg:null, reps: chiuse ? ultime + ex.step : ultime, salito:chiuse };
  var kg = last.sets[0].kg;
  if(kg == null) return { kg:null, reps:ultime, salito:false };
  return {
    kg: chiuse ? Math.round((kg + ex.step) * 100) / 100 : kg,
    reps: chiuse ? base : ultime,
    salito: chiuse
  };
}

function stretchDay(d){ if(!S.stretch[d]) S.stretch[d] = { items:{} }; return S.stretch[d]; }

function streDi(id){
  var t = null;
  STRE_LIB.forEach(function(x){ if(x.id === id) t = x; });
  return t;
}
/* Quello che hai scelto davvero, e puo' essere meno di tre: mentre stai
   scegliendo devi poterne togliere uno senza che l'app te lo rimetta subito.
   Si scartano gli id spariti dalla libreria e quelli gia' fra i fissi. */
function streScelti(){
  var out = [];
  (S.streSel || []).forEach(function(id){
    if(out.length < 3 && out.indexOf(id) < 0 && STRE_FISSI.indexOf(id) < 0 && streDi(id)) out.push(id);
  });
  return out;
}
/* Completati coi tre di sempre. Serve solo alla seduta: una preferenza
   lasciata a meta' non deve produrre uno stretching monco. */
function strePieni(){
  var out = streScelti();
  STRE_DIFETTO.forEach(function(id){
    if(out.length < 3 && out.indexOf(id) < 0) out.push(id);
  });
  return out;
}
/* I cinque di oggi: prima i due fissi, poi i tre. */
function streOggi(){
  return STRE_FISSI.concat(strePieni()).map(streDi).filter(Boolean);
}
/* Quanti ne hai spuntati in quel giorno. Si contano le spunte vere invece di
   filtrare sulla selezione di oggi: la selezione cambia nel tempo, e un
   giorno passato va letto con quello che avevi fatto allora. */
function streFatti(d){
  var it = (S.stretch[d] || {}).items || {};
  return Object.keys(it).filter(function(k){ return it[k]; }).length;
}
function stretchDone(d){
  if(!S.stretch[d]) return false;
  return streFatti(d) >= streOggi().length;
}
/* Si mescolano le CATEGORIE, non gli esercizi: pescare tre volte dalla stessa
   darebbe varieta' apparente e stimolo ridondante — che e' esattamente cio
   che Kassiano 2022 dice di evitare. */
function mescolaStre(){
  var cats = STRE_CAT.map(function(c){ return c.id; });
  for(var i = cats.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = cats[i];
    cats[i] = cats[j]; cats[j] = t;
  }
  var out = [];
  cats.forEach(function(c){
    if(out.length >= 3) return;
    var pool = STRE_LIB.filter(function(x){ return x.c === c && !x.fisso; });
    if(pool.length) out.push(pool[Math.floor(Math.random() * pool.length)].id);
  });
  S.streSel = out;
  save();
}
/* Tre esercizi tutti dalla stessa categoria non sono un errore, ma vale la
   pena dirlo: il documento suggerisce di mescolare, non lo impone. */
function streMonotono(){
  var c = streScelti().map(function(id){ return (streDi(id) || {}).c; });
  return c.length === 3 && c[0] === c[1] && c[1] === c[2];
}

function foodDay(d){ if(!S.food[d]) S.food[d] = []; return S.food[d]; }
/* q = quantita, 1 se assente: le voci scritte prima della v1.8 non ce l hanno. */
function foodTot(d){
  return foodDay(d).reduce(function(a, x){
    var q = x.q || 1;
    return { k:a.k + x.k * q, p:a.p + x.p * q };
  }, { k:0, p:0 });
}

/* Backup. La perdita di dati e fra le sei ragioni di abbandono censite dalla
   revisione JMIR 2024, e su iPhone Safari cancella la memoria dei siti dopo
   sette giorni senza aprirli: la stessa soglia vale per il promemoria. */
function giorniDaExport(){
  if(!S.lastExport) return null;
  return Math.floor((parseISO(oggiISO()) - parseISO(S.lastExport)) / 86400000);
}
function exportScaduto(){
  if(sedute().length < 2 && S.weights.length < 2) return false;
  var g = giorniDaExport();
  return g === null || g >= 7;
}

/* Sedute di pesi davvero svolte, in ordine di data. Una seduta conta se ha
   almeno una serie spuntata: le righe vuote create al volo non contano. */
function sedute(){
  return Object.keys(S.sessions).filter(function(dd){
    var s = S.sessions[dd];
    for(var k in s){
      for(var i = 0; i < s[k].length; i++){ if(s[k][i].done) return true; }
    }
    return false;
  }).sort();
}
/* Regola del brief: stesso dolore, stesso punto, tre sedute di fila -> ci si ferma.
   E l'unica regola del progetto che protegge da qualcosa di non reversibile. */
function painAlert(){
  var ds = sedute().slice(-3);
  if(ds.length < 3) return [];
  return ZONE.filter(function(z){
    return ds.every(function(dd){ return (S.pain[dd] || []).indexOf(z) >= 0; });
  });
}

/* medie settimanali del peso */
function pesoSettimane(){
  if(!S.weights.length) return [];
  var anchor = S.start ? parseISO(S.start) : mondayOf(parseISO(S.weights.slice().sort(function(a,b){ return a.d < b.d ? -1 : 1; })[0].d));
  var m = {};
  S.weights.forEach(function(w){
    var idx = Math.floor((parseISO(w.d) - anchor) / 604800000) + 1;
    if(!m[idx]) m[idx] = [];
    m[idx].push(w.kg);
  });
  return Object.keys(m).map(Number).sort(function(a,b){ return a-b; }).map(function(i){
    var a = m[i];
    return { w:i, n:a.length, media: a.reduce(function(x,y){ return x+y; },0) / a.length };
  });
}
function consiglioPeso(){
  var ws = pesoSettimane();
  if(ws.length < 3) return null;
  var ult = ws[ws.length-1], pre = ws[ws.length-3];
  if(ult.w - pre.w > 3) return null;
  var d = ult.media - pre.media;
  if(d < 0.15) return { t:"su", txt:"La media del peso è ferma da due settimane (" + d.toFixed(2).replace(".",",") + " kg). Regola del diario: <strong>+200 kcal al giorno</strong>, poi ricontrolla fra due settimane." };
  var settimanale = d / (ult.w - pre.w);
  if(settimanale > 0.4) return { t:"giu", txt:"Stai salendo di " + settimanale.toFixed(2).replace(".",",") + " kg a settimana, oltre i 400 g. Regola del diario: <strong>−150 kcal al giorno</strong>." };
  return { t:"ok", txt:"Ritmo dentro il bersaglio: " + settimanale.toFixed(2).replace(".",",") + " kg a settimana contro i 250 g previsti. Non toccare niente." };
}

/* ============================================================
   Audio e vibrazione
   ============================================================ */

var actx = null;
function beep(n){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    for(var i = 0; i < (n||1); i++){
      var o = actx.createOscillator(), g = actx.createGain();
      var t = actx.currentTime + i * 0.22;
      o.frequency.value = 760; o.type = "sine";
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.2);
    }
  }catch(e){}
}
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

/* Schermo acceso per tutta la seduta, non solo dentro i timer: fra un
   esercizio e l'altro il telefono si spegneva e andava sbloccato con le mani
   sudate. Il wake lock viene rilasciato dal browser ogni volta che la pagina
   passa in secondo piano, quindi va richiesto di nuovo al ritorno — altrimenti
   dura solo fino alla prima notifica che ti porta fuori dall'app.
   Nessun conteggio di chi lo ha chiesto: syncWake() ricalcola dallo stato. */
var wake = null, wakeWanted = false;
function wakeNeeded(){
  return imm.on || ses.on || tab === "pesi" || tab === "corsa" || rest.on || run.playing;
}
function syncWake(){
  wakeWanted = wakeNeeded();
  applyWake();
}
function applyWake(){
  try{
    if(wakeWanted && navigator.wakeLock && !wake && document.visibilityState === "visible"){
      navigator.wakeLock.request("screen").then(function(w){
        wake = w;
        w.addEventListener("release", function(){ wake = null; });
      }).catch(function(){});
    } else if(!wakeWanted && wake){ wake.release(); wake = null; }
  }catch(e){}
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible") applyWake();
});

/* ------------------------------------------------------------------
   CRONOMETRO DELLA TENUTA (plank, plank laterale, hollow hold)
   ------------------------------------------------------------------
   Non e' il timer del riposo: quello conta alla rovescia da un valore noto,
   questo conta in avanti perche' la durata e' il DATO che stai misurando.
   La regola del plank e' "quando il bacino cede hai finito, anche se sono
   passati 18 secondi": il numero non si puo' sapere prima.

   Il valore si calcola sulla differenza fra due timestamp, non contando i
   fotogrammi: se il telefono si oscura o l'app va in secondo piano il
   conteggio a schermo si ferma, ma il secondo finale resta giusto. Stessa
   ragione per cui il timer del riposo lavora su rest.end.
   ------------------------------------------------------------------ */
var tenuta = { on:false, t0:0, ex:null, i:0, raf:0, el:null, ultimo:-1 };

function tenutaTick(){
  if(!tenuta.on) return;
  var s = Math.floor((Date.now() - tenuta.t0) / 1000);
  /* Si scrive solo quando il secondo cambia: sessanta scritture al secondo su
     un numero che cambia una volta al secondo sono solo batteria. */
  if(s !== tenuta.ultimo && tenuta.el){
    tenuta.ultimo = s;
    tenuta.el.textContent = s + "″";
  }
  tenuta.raf = requestAnimationFrame(tenutaTick);
}
function tenutaVia(el, exId, i){
  tenutaFerma(true);                       /* uno alla volta */
  tenuta = { on:true, t0:Date.now(), ex:exId, i:i, raf:0, el:el, ultimo:-1 };
  el.setAttribute("data-on", "1");
  el.textContent = "0″";
  buzz(20);
  tenutaTick();
}
/* annulla=true chiude senza restituire niente: serve quando ne parte un altro
   o quando si esce dalla vista. */
function tenutaFerma(annulla){
  if(!tenuta.on) return null;
  if(tenuta.raf) cancelAnimationFrame(tenuta.raf);
  var sec = Math.max(1, Math.round((Date.now() - tenuta.t0) / 1000));
  var r = { ex:tenuta.ex, i:tenuta.i, sec:sec };
  if(tenuta.el){ tenuta.el.removeAttribute("data-on"); }
  tenuta = { on:false, t0:0, ex:null, i:0, raf:0, el:null, ultimo:-1 };
  return annulla ? null : r;
}

var rest = { end:0, tot:0, label:"", on:false };
function restStart(sec, label){
  rest.end = Date.now() + sec * 1000; rest.tot = sec; rest.label = label; rest.on = true;
  syncWake(); tickRest();
}
function restStop(){ rest.on = false; document.getElementById("rest").hidden = true; syncWake(); }
function tickRest(){
  var el = document.getElementById("rest");
  if(!rest.on){ el.hidden = true; return; }
  var left = (rest.end - Date.now()) / 1000;
  /* Nella seduta guidata il conto alla rovescia sta a schermo intero: la
     fascetta in basso resterebbe nascosta sotto la schermata blu. */
  var cd = document.getElementById("sesCd");
  if(cd) cd.textContent = mmss(Math.max(0, left));
  /* Chi usa un lettore di schermo non vede il numero che scorre. Si annuncia
     solo negli ultimi 10 secondi: un annuncio al secondo per due minuti
     renderebbe l'app inascoltabile (WCAG 4.1.3). */
  var live = document.getElementById("sesLive");
  if(live){
    var L = Math.ceil(Math.max(0, left));
    live.textContent = left <= 0 ? "Riposo finito" : (L <= 10 ? L + " secondi" : "");
  }
  el.hidden = ses.on;
  if(!ses.on){
    var ln = document.getElementById("restLn");
    if(ln) ln.style.width = (Math.max(0, Math.min(1, left / (rest.tot || 1))) * 100).toFixed(2) + "%";
    document.getElementById("restT").textContent = mmss(Math.max(0, left));
    document.getElementById("restW").innerHTML = left <= 0
      ? "Riposo finito — vai con la serie"
      : "Riposo · " + esc(rest.label);
  }
  if(left <= 0 && !rest.done){ rest.done = true; beep(2); buzz([160,80,160]); }
  if(left > 0) rest.done = false;
  /* "lui conta il tempo, poi parte l'altra": a zero il percorso avanza da solo. */
  if(left <= 0 && ses.on && !ses.avanzato && (ses.steps[ses.i] || {}).t === "riposo"){
    ses.avanzato = true; restStop(); sesVai(1); return;
  }
  if(left < -20) restStop();
}

/* ============================================================
   LA TRACCIA DELLA CORSA
   ============================================================
   Perche' non c'e' una cartina. Disegnare le strade vuol dire chiedere le
   tessere a un servizio esterno, e a ogni tocco quel servizio impara dove sei.
   La traccia — la forma del percorso su fondo vuoto — dice quanto e dove sei
   girato senza che la tua posizione esca dal telefono, e non introduce una
   dipendenza in un file che non ne ha nessuna.

   Il GPS non e' preciso: si scartano i punti con precisione peggiore di 35 m
   e i salti che implicherebbero piu di 8 m/s, che a piedi non esistono e sono
   il modo tipico in cui il GPS urbano inventa cento metri fermi al semaforo.

   La traccia salvata e' potata a 120 punti e arrotondata a cinque decimali
   (~1 m): finisce dentro stato.json, che viaggia in rete a ogni modifica, e
   una corsa da mille punti la farebbe pesare piu di tutto il resto insieme.
   ============================================================ */

var gps = { on:false, id:0, pts:[], km:0, prec:null, errore:"", ultimo:null, t0:0, tUlt:0 };

/* Il passo al chilometro: minuti e secondi per km, da distanza e tempo che ho
   gia' tutti e due. E' un numero MISURATO, al contrario dei passi — e per una
   corsa in cui l'istruzione e' "ritmo facile, quello in cui riesci a dire una
   frase intera", sapere che stai andando a 7'30" invece che a 6'00" e' l'unica
   informazione che cambia qualcosa mentre corri. */
function secKm(km, ms){
  if(!km || km < 0.08 || !ms) return null;
  var sec = (ms / 1000) / km;
  return sec > 1800 ? null : sec;                /* oltre mezz'ora al km e' fermo */
}
function mmSec(sec){
  if(sec == null) return null;
  var m = Math.floor(sec / 60), s = Math.round(sec % 60);
  if(s === 60){ m++; s = 0; }
  return m + "'" + (s < 10 ? "0" : "") + s + '"';
}
function passoAlKm(km, ms){ return mmSec(secKm(km, ms)); }

/* ---------- IL PASSO DEL BLOCCO ----------
   Il passo cumulativo e' SBAGLIATO per una seduta a intervalli: mescola otto
   blocchi di corsa con sette di cammino, quindi mentre corri dice sempre un
   numero piu lento del vero e non ti fa correggere niente. Difetto della v3.3,
   trovato dal confronto fra le quattro direzioni.

   Ogni punto GPS porta con se l'indice della fase in cui e' stato preso, e
   qui si guarda solo quella. Sotto 120 metri non si dice niente: due fix e
   un'incertezza di 15 metri darebbero un passo inventato. */
function passoBlocco(idx){
  if(idx == null || idx < 0) return null;
  var p = [], i;
  for(i = 0; i < gps.pts.length; i++) if(gps.pts[i][3] === idx) p.push(gps.pts[i]);
  if(p.length < 2) return null;
  var km = 0;
  for(i = 1; i < p.length; i++) km += haversine(p[i-1], p[i]);
  if(km < 0.12) return null;
  var ms = p[p.length-1][2] - p[0][2];
  var sec = secKm(km, ms);
  return sec == null ? null : { km:km, sec:sec, testo:mmSec(sec), fermoDa:Date.now() - p[p.length-1][2] };
}
/* L'ultimo blocco di corsa gia chiuso, per avere qualcosa da dire nei primi
   120 metri del blocco in corso. */
function passoBloccoPrec(idx){
  for(var k = idx - 1; k >= 0; k--){
    if((run.seq[k] || {}).k !== "run") continue;
    var p = passoBlocco(k);
    if(p) return { p:p, i:k };
  }
  return null;
}

/* Il riferimento: mediana dei passi delle corse passate andate BENE, cioe a
   sensazione 3 o meno. Sotto tre corse non esiste, e un quadrante senza
   taratura non deve fingere di averla. */
function rifPasso(){
  var v = [];
  (S.runs || []).forEach(function(r){
    if(r.pc && r.rpe != null && r.rpe <= 3) v.push(r.pc);
  });
  if(v.length < 3) return null;
  v.sort(function(a, b){ return a - b; });
  return v[Math.floor(v.length / 2)];
}
/* La banda: ±20 secondi al chilometro attorno al riferimento.
   ATTENZIONE: quei 20 secondi sono un GIUDIZIO, non una fonte. Nessuno studio
   dice che venti secondi siano la soglia giusta. Se qualcuno li cita come
   evidenza, sta sbagliando. */
var BANDA = 20;
/* Asimmetrico di proposito: si accende solo il lato "stai andando troppo
   forte". Piu lento del riferimento e' grigio e mai ambra — il facile e' il
   bersaglio, non il minimo, e questa e' la regola del programma. */
function giudizioPasso(sec){
  var r = rifPasso();
  if(r == null || sec == null) return { st:"neutro", t:"" };
  if(sec < r - BANDA) return { st:"veloce", t:"Rallenta finché non riesci a dire una frase intera" };
  if(sec > r + BANDA) return { st:"lento",  t:"Va bene: il facile è il bersaglio, non il minimo" };
  return { st:"dentro", t:"Dentro il tuo ritmo facile" };
}

function haversine(a, b){
  var R = 6371, r = Math.PI / 180;
  var dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  var s = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
}

function gpsVia(){
  if(!navigator.geolocation){ gps.errore = "Questo telefono non da la posizione."; render(); return; }
  gps = { on:true, id:0, pts:[], km:0, prec:null, errore:"", ultimo:null, t0:0, tUlt:0 };
  gps.id = navigator.geolocation.watchPosition(function(p){
    var c = p.coords;
    gps.prec = Math.round(c.accuracy);
    if(c.accuracy > 35) return;                       /* troppo incerto per fidarsi */
    var q = [c.latitude, c.longitude], t = p.timestamp || Date.now();
    if(gps.ultimo){
      var dkm = haversine(gps.ultimo.q, q);
      var dt = Math.max(1, (t - gps.ultimo.t) / 1000);
      if(dkm * 1000 / dt > 8) return;                 /* 8 m/s a piedi non esistono */
      if(dkm * 1000 < 3) return;                      /* fermo: non accumulare rumore */
      gps.km += dkm;
    }
    if(!gps.t0) gps.t0 = t;
    gps.tUlt = t;
    gps.ultimo = { q:q, t:t };
    /* Quarto elemento: l indice della fase. Serve al passo del blocco, e non
       rompe niente — haversine, proiez, zoomPer, tracciaSVG e mappaHTML
       leggono solo [0] e [1], e potaTraccia ricostruisce coppie a due. */
    gps.pts.push([q[0], q[1], t, run.started ? run.i : -1]);
    var el = document.getElementById("gpsKm");
    if(el) el.textContent = gps.km.toFixed(2).replace(".", ",");
    var pa = document.getElementById("gpsPasso");
    if(pa) pa.textContent = passoAlKm(gps.km, gps.tUlt - gps.t0) || "—";
    /* La mappa si ridisegna ogni cinque punti, non a ogni fix: rifare le
       tessere venti volte al minuto e' traffico e batteria per niente. */
    if(imm.on){ immFix(); }
    else {
      var tr = document.getElementById("gpsTr");
      if(tr && gps.pts.length % 5 === 0) tr.innerHTML = mappaHTML(gps.pts);
    }
  }, function(e){
    gps.errore = e.code === 1
      ? "Permesso negato. Serve autorizzare la posizione per questa pagina."
      : "La posizione non arriva. Sotto un tetto o fra i palazzi capita.";
    render();
  }, { enableHighAccuracy:true, maximumAge:2000, timeout:12000 });
  render();
}

function gpsFerma(){
  if(gps.id) navigator.geolocation.clearWatch(gps.id);
  gps.on = false; gps.id = 0;
}

/* Potatura: si tengono 120 punti presi a passo costante. Non e' la
   semplificazione piu furba possibile, ma e' prevedibile e non puo' storcere
   la forma piu di quanto la storca il GPS stesso. */
function potaTraccia(pts){
  if(pts.length <= 120) return pts.map(function(p){
    return [+p[0].toFixed(5), +p[1].toFixed(5)];
  });
  var out = [], passo = pts.length / 120;
  for(var i = 0; i < 120; i++){
    var p = pts[Math.floor(i * passo)];
    out.push([+p[0].toFixed(5), +p[1].toFixed(5)]);
  }
  out.push([+pts[pts.length-1][0].toFixed(5), +pts[pts.length-1][1].toFixed(5)]);
  return out;
}

/* ---------- le strade sotto la traccia ----------
   Tessere di OpenStreetMap, e sono LA PRIMA DIPENDENZA ESTERNA di questa app.
   Due cose cambiano rispetto alla sola traccia, e vanno sapute:
   1. se il servizio e' lento, cambia regole o sparisce, la mappa si rompe.
      Per questo l'errore di caricamento non fa danni: si resta sulla traccia
      su fondo vuoto, che funziona sempre.
   2. per disegnare la tessera giusta il server deve sapere dove sei. Il
      commutatore in fondo alla schermata la spegne, e allora non esce niente.
   L'attribuzione non e' cortesia: e' la licenza dei dati e va mostrata. */

var TESSERE = "https://tile.openstreetmap.org/";

/* Web Mercator: da gradi a pixel del mondo allo zoom z, tessere da 256. */
function proiez(lat, lon, z){
  var n = 256 * Math.pow(2, z);
  var s = Math.max(-0.9999, Math.min(0.9999, Math.sin(lat * Math.PI / 180)));
  return [ (lon + 180) / 360 * n,
           (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n ];
}

/* Lo zoom piu stretto in cui il percorso ci sta ancora tutto. Sotto 11 non si
   scende: piu lontano di cosi non si riconosce piu niente. */
function zoomPer(pts, W, H){
  var laMin=90,laMax=-90,loMin=180,loMax=-180;
  pts.forEach(function(p){
    if(p[0]<laMin)laMin=p[0]; if(p[0]>laMax)laMax=p[0];
    if(p[1]<loMin)loMin=p[1]; if(p[1]>loMax)loMax=p[1];
  });
  for(var z = 18; z >= 11; z--){
    var a = proiez(laMax, loMin, z), b = proiez(laMin, loMax, z);
    if((b[0]-a[0]) <= W - 24 && (b[1]-a[1]) <= H - 24) return z;
  }
  return 11;
}

function mappaHTML(pts){
  if(!pts || pts.length < 2) return '<p class="fine">In attesa del segnale…</p>';
  if(!(S.tessere !== false)) return '<div class="trbox">' + tracciaSVG(pts) + '</div>';

  var W = 300, H = 200;
  var z = zoomPer(pts, W, H);
  var px = pts.map(function(p){ return proiez(p[0], p[1], z); });
  var xMin=Infinity,xMax=-Infinity,yMin=Infinity,yMax=-Infinity;
  px.forEach(function(p){
    if(p[0]<xMin)xMin=p[0]; if(p[0]>xMax)xMax=p[0];
    if(p[1]<yMin)yMin=p[1]; if(p[1]>yMax)yMax=p[1];
  });
  /* Il riquadro si centra sul percorso, non sul primo punto. */
  var cx = (xMin+xMax)/2, cy = (yMin+yMax)/2;
  var x0 = cx - W/2, y0 = cy - H/2;

  var tx0 = Math.floor(x0/256), tx1 = Math.floor((x0+W)/256);
  var ty0 = Math.floor(y0/256), ty1 = Math.floor((y0+H)/256);
  var max = Math.pow(2, z), img = "";
  for(var tx = tx0; tx <= tx1; tx++){
    for(var ty = ty0; ty <= ty1; ty++){
      if(ty < 0 || ty >= max) continue;
      var wx = ((tx % max) + max) % max;
      img += '<img class="tess" alt="" loading="lazy" ' +
        'style="left:' + (tx*256 - x0) + 'px;top:' + (ty*256 - y0) + 'px" ' +
        'src="' + TESSERE + z + '/' + wx + '/' + ty + '.png" ' +
        'onerror="this.style.visibility=\'hidden\'">';
    }
  }
  var d = px.map(function(p,i){
    return (i?"L":"M") + (p[0]-x0).toFixed(1) + " " + (p[1]-y0).toFixed(1);
  }).join(" ");
  var u = px[px.length-1], f = px[0];
  return '<div class="mappa" style="height:' + H + 'px">' + img +
    '<svg class="sopra" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="percorso della corsa sulla mappa">' +
      '<path d="' + d + '" fill="none" stroke="#0A0D10" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>' +
      '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="' + (f[0]-x0).toFixed(1) + '" cy="' + (f[1]-y0).toFixed(1) + '" r="4" fill="#0A0D10" stroke="#fff" stroke-width="1.5"/>' +
      '<circle cx="' + (u[0]-x0).toFixed(1) + '" cy="' + (u[1]-y0).toFixed(1) + '" r="5" fill="var(--accent)" stroke="#0A0D10" stroke-width="1.5"/>' +
    '</svg>' +
    '<span class="attrib">© OpenStreetMap</span></div>';
}

function tracciaSVG(pts){
  if(!pts || pts.length < 2) return '<p class="fine">In attesa del segnale…</p>';
  var laMin = 90, laMax = -90, loMin = 180, loMax = -180;
  pts.forEach(function(p){
    if(p[0] < laMin) laMin = p[0]; if(p[0] > laMax) laMax = p[0];
    if(p[1] < loMin) loMin = p[1]; if(p[1] > loMax) loMax = p[1];
  });
  /* La longitudine si accorcia con la latitudine: senza il coseno un percorso
     nord-sud verrebbe schiacciato e uno est-ovest stirato. */
  var kx = Math.cos((laMin + laMax) / 2 * Math.PI / 180);
  var w = Math.max(1e-7, (loMax - loMin) * kx), hgt = Math.max(1e-7, laMax - laMin);
  var scala = Math.min(280 / w, 160 / hgt);
  var ox = (300 - w * scala) / 2, oy = (180 - hgt * scala) / 2;
  var d = pts.map(function(p, i){
    var x = ox + (p[1] - loMin) * kx * scala;
    var y = 180 - oy - (p[0] - laMin) * scala;
    return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
  }).join(" ");
  var ult = pts[pts.length - 1];
  var ux = ox + (ult[1] - loMin) * kx * scala, uy = 180 - oy - (ult[0] - laMin) * scala;
  var pri = pts[0];
  var px = ox + (pri[1] - loMin) * kx * scala, py = 180 - oy - (pri[0] - laMin) * scala;
  return '<svg class="traccia" viewBox="0 0 300 180" role="img" aria-label="percorso della corsa">' +
    '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="3.5" fill="var(--ink-3)"/>' +
    '<circle cx="' + ux.toFixed(1) + '" cy="' + uy.toFixed(1) + '" r="4.5" fill="var(--accent)"/>' +
    '</svg>';
}

/* ---------- da chilometri a passi, e a energia ----------
   I PASSI NON SONO CONTATI, SONO DIVISI. Il telefono qui non conta i passi:
   si divide la distanza per una falcata stimata sull'altezza. Il numero e'
   onesto solo se detto cosi', ed e' scritto anche nell'app.
   0,75 m sta fra la falcata di cammino a 160 cm (~0,66) e quella di corsa
   (~0,95): una seduta a intervalli le alterna entrambe. */
var FALCATA = 0.75;
function passiDa(km){ return Math.round(km * 1000 / FALCATA); }

/* Costo energetico: ~0,9 kcal per kg per km, valore intermedio fra corsa
   (~1,03) e cammino (~0,5), perche' la seduta alterna le due. Moltiplicato
   per il peso vero, se c'e'. */
function pesoOra(){
  var w = (S.weights || []).slice().sort(function(a,b){ return a.d < b.d ? -1 : 1; });
  return w.length ? w[w.length-1].kg : 45;
}
function kcalDa(km){ return Math.round(km * pesoOra() * 0.9); }

/* Quanta energia hai speso correndo, in quel giorno. Non e' un premio: alza
   il bersaglio del piatto. Vedi targetKcal(). */
function kcalCorse(d){
  return (S.runs || []).reduce(function(a, r){
    return a + ((r.d === d && r.kcal) ? r.kcal : 0);
  }, 0);
}
/* IL PUNTO DI TUTTA LA FUNZIONE. A BMI 17,6 un contatore di calorie bruciate
   e' un invito al conto sbagliato. Qui l'energia spesa NON viene mostrata
   come risultato: viene sommata al bersaglio della giornata, cioe' diventa
   cibo da rimettere. vincoli.md: ogni aumento di carico va accompagnato da un
   aumento di cibo, mai il contrario. */
function targetKcal(d){ return KCAL_MIN + kcalCorse(d); }
/* L'etichetta della barra dice il bersaglio e, quando c'e', da dove viene
   l'aumento: senza, un giorno il numero cambia e sembra un guasto. */
function etichettaKcal(d){
  var extra = kcalCorse(d);
  var t = targetKcal(d);
  return extra
    ? (t + " · " + KCAL_MIN + " + " + extra + " di corsa")
    : (KCAL_MIN + "-" + KCAL_MAX);
}

var run = { seq:[], i:0, end:0, playing:false, started:false };

/* Lo stato della modalita immersiva. p va da 0 (mappa piena) a 1 (quadranti);
   manuale dice se lo scorrimento ha scavalcato il cambio automatico, e si
   azzera al cambio di fase successivo. */
var imm = { on:false, p:0, manuale:false, scena:"a", raf:0, tessOk:0, tessKo:0, fondo:false };
var immG = null, immNodi = {}, immCentro = null;
/* Lo zoom era fisso a 16 e si vedevano ~660 m di lato: su una corsa da tre
   chilometri e' una finestrella. Ora si sceglie e resta scelto per la
   sessione — cambiarlo e un ricalcolo, cioe esattamente quello che succede
   gia ogni 128 px di deriva, non un costo nuovo.
   15 di partenza: ~1,3 km di lato, dove un giro si riconosce. */
function immZoom(){ var z = S.immZoom; return (z >= 13 && z <= 17) ? z : 15; }
Object.defineProperty(window, "immZ", { get: immZoom });
function buildSeq(week){
  var cfg = RUN_WEEKS[Math.max(0, Math.min(3, week - 1))];
  var seq = [{ k:"warm", n:"Riscaldamento", s:WARMUP }];
  for(var i = 0; i < cfg.reps; i++){
    seq.push({ k:"run", n:"Corsa", s:cfg.run, b:i+1, tot:cfg.reps });
    if(i < cfg.reps - 1) seq.push({ k:"walk", n:"Cammino", s:cfg.walk, b:i+1, tot:cfg.reps });
  }
  seq.push({ k:"cool", n:"Defaticamento", s:COOLDOWN });
  return seq;
}
/* ============================================================
   MODALITA IMMERSIVA — motore
   ============================================================ */

var LATO_I = 16, MANIGLIA_I = 44, PADT_I = 14;
var immBase = null;                 /* pixel mondo dell'angolo alto-sinistro */

/* Una formula, non dei numeri: la finestra piccola dello stato B ha la stessa
   proporzione dello schermo, quindi A -> B e' solo translate + scale e regge
   ogni schermo e la rotazione. */
function immGeo(){
  var W = innerWidth, H = innerHeight;
  var w = Math.round((W - LATO_I*2 - 12) * 0.485);
  return { W:W, H:H, bx:LATO_I, by:MANIGLIA_I + PADT_I, s:w / W };
}
function immPiazza(p){
  var g = immG || (immG = immGeo());
  var s = 1 + (g.s - 1) * p;
  var m = document.getElementById("immMappa");
  if(m) m.style.transform = "translate3d(" + (g.bx*p).toFixed(1) + "px," +
    (g.by*p).toFixed(1) + "px,0) scale(" + s.toFixed(4) + ")";
  var hud = document.getElementById("immHud");
  if(hud) hud.style.opacity = String(Math.max(0, 1 - Math.min(1, p*1.7)));
  var f = document.getElementById("immFoglio");
  if(f) f.style.opacity = String(Math.max(0, Math.min(1, (p - 0.45) / 0.35)));
  var mp = document.getElementById("immMappa");
  if(mp) mp.style.setProperty("--p", String(p));
}

/* ---------- il gestore delle tessere ----------
   Chiave z/x/y -> nodo. Si aggiungono solo le tessere nuove al bordo; la
   traccia si aggiorna con un solo setAttribute. Il set si ricalcola solo dopo
   128 px di deriva (~113 m). E' l'unico pezzo di tutta la modalita che
   consuma MENO di quello che c'era prima, dove ogni cinque fix si buttava via
   e si ricreava l'intero innerHTML. */
function immRicalcola(){
  var g = immG || (immG = immGeo());
  var u = gps.pts[gps.pts.length - 1];
  if(!u) return;
  var c = proiez(u[0], u[1], immZ);
  immBase = [ c[0] - g.W/2, c[1] - g.H*0.42 ];
  immCentro = c;
  var box = document.getElementById("immTess");
  if(!box) return;
  box.style.transform = "translate3d(0,0,0)";
  document.getElementById("immSvg").style.transform = "translate3d(0,0,0)";
  if(S.tessere === false){ box.innerHTML = ""; immNodi = {}; return; }

  var max = Math.pow(2, immZ), voluti = {};
  var tx0 = Math.floor(immBase[0]/256) - 1, tx1 = Math.floor((immBase[0]+g.W)/256) + 1;
  var ty0 = Math.floor(immBase[1]/256) - 1, ty1 = Math.floor((immBase[1]+g.H)/256) + 1;
  for(var tx = tx0; tx <= tx1; tx++){
    for(var ty = ty0; ty <= ty1; ty++){
      if(ty < 0 || ty >= max) continue;
      var wx = ((tx % max) + max) % max, k = immZ + "/" + wx + "/" + ty;
      voluti[k] = 1;
      var n = immNodi[k];
      if(!n){
        n = document.createElement("img");
        n.alt = ""; n.loading = "lazy";
        n.onload  = function(){ imm.tessOk++; };
        n.onerror = function(){ imm.tessKo++; this.style.visibility = "hidden"; immFondo(); };
        n.src = TESSERE + k + ".png";
        immNodi[k] = n; box.appendChild(n);
      }
      n.style.left = (tx*256 - immBase[0]) + "px";
      n.style.top  = (ty*256 - immBase[1]) + "px";
    }
  }
  Object.keys(immNodi).forEach(function(k){
    if(!voluti[k]){ var n = immNodi[k]; if(n && n.parentNode) n.parentNode.removeChild(n); delete immNodi[k]; }
  });
  /* Se piu di meta delle tessere non arriva, si resta sul pavimento. Non e un
     allarme: e una condizione, e S.tessere non si spegne mai da sola. */
  setTimeout(immFondo, 6000);
}
function immFondo(){
  var tot = imm.tessOk + imm.tessKo;
  var giu = tot >= 4 && imm.tessKo / tot > 0.5;
  if(giu === imm.fondo) return;
  imm.fondo = giu;
  var el = document.getElementById("imm");
  if(el) el.setAttribute("data-fondo", giu ? "1" : "0");
}

function immTraccia(){
  var g = immG || (immG = immGeo());
  var d = "";
  if(immBase && gps.pts.length > 1){
    for(var i = 0; i < gps.pts.length; i++){
      var q = proiez(gps.pts[i][0], gps.pts[i][1], immZ);
      d += (i ? "L" : "M") + (q[0]-immBase[0]).toFixed(1) + " " + (q[1]-immBase[1]).toFixed(1);
    }
  }
  var p = document.getElementById("immD");
  if(p && p.getAttribute("d") !== d) p.setAttribute("d", d);
}

/* Un fix: due transform e un path. Niente innerHTML, niente lettura di
   layout, niente ricostruzione di nodi. */
function immFix(){
  var g = immG || (immG = immGeo());
  var u = gps.pts[gps.pts.length - 1];
  if(!u) return;
  if(!immBase){ immRicalcola(); immTraccia(); tickImm(); return; }
  var c = proiez(u[0], u[1], immZ);
  var dx = (c[0] - g.W/2) - immBase[0], dy = (c[1] - g.H*0.42) - immBase[1];
  if(Math.abs(dx) > 128 || Math.abs(dy) > 128){ immRicalcola(); immTraccia(); tickImm(); return; }
  var t = "translate3d(" + (-dx).toFixed(1) + "px," + (-dy).toFixed(1) + "px,0)";
  var box = document.getElementById("immTess"), sv = document.getElementById("immSvg");
  if(box) box.style.transform = t;
  if(sv) sv.style.transform = t;
  immTraccia();
  tickImm();
}

/* ---------- cosa si scrive, e dove ---------- */

function immFase(){ return run.started ? (run.seq[run.i] || {}) : { k:"warm", n:"Riscaldamento", s:WARMUP }; }
function immResta(){
  var ph = immFase();
  if(!run.started) return ph.s;
  return run.playing ? Math.max(0, (run.end - Date.now()) / 1000) : ph.s;
}
function immKm(){ return gps.pts.length > 1 ? gps.km : null; }

/* Il pannello del passo, che e' l'unico numero su cui puoi agire correndo.
   Precedenze: segnale cattivo > fermo > blocco in corso > ultimo chiuso. */
function immPasso(){
  if(!gps.on) return { v:"—", st:"neutro", g:"Senza posizione non c'è passo. Il timer funziona lo stesso." };
  if(gps.prec != null && gps.prec > 20 && gps.pts.length < 2)
    return { v:"—", st:"neutro", g:"Segnale a " + gps.prec + " m — non mi fiderei" };
  var idx = run.started && immFase().k === "run" ? run.i : -1;
  var pb = idx >= 0 ? passoBlocco(idx) : null;
  if(pb && pb.fermoDa > 20000)
    return { v:pb.testo, st:"neutro", g:"fermo da " + Math.round(pb.fermoDa/1000) + "″" };
  if(pb){ var gj = giudizioPasso(pb.sec); return { v:pb.testo, sec:pb.sec, st:gj.st, g:gj.t }; }
  var pp = run.started ? passoBloccoPrec(run.i) : null;
  if(pp) return { v:pp.p.testo, sec:pp.p.sec, st:"neutro", g:"ultimo blocco chiuso" };
  return { v:"—", st:"neutro", g:gps.pts.length < 2 ? "Cerco il segnale…" : "" };
}

function immHudHTML(){
  var ph = immFase(), km = immKm(), pa = immPasso();
  var seq = run.started ? run.seq : buildSeq(weekClamped());
  var blocchi = seq.filter(function(x){ return x.k === "run"; }).length;
  var occhio = ph.k === "run" && ph.b
    ? "Corsa · blocco " + ph.b + " di " + (ph.tot || blocchi)
    : (ph.n || "Pronto");
  return '<div class="track">' + seq.map(function(x, i){
      return '<i data-s="' + x.k + '" data-p="' + (run.started && i <= run.i ? 1 : 0) + '"></i>';
    }).join("") + '</div>' +
    (S.tessere !== false && !imm.fondo && gps.pts.length > 1 ? '<span class="attrib">© OpenStreetMap</span>' : "") +
    '<div class="imm-zoom">' +
      '<button data-act="immZoomPiu"' + (immZ >= 17 ? " disabled" : "") + ' aria-label="avvicina">+</button>' +
      '<button data-act="immZoomMeno"' + (immZ <= 13 ? " disabled" : "") + ' aria-label="allontana">−</button>' +
    '</div>' +
    '<div class="occhiello" data-f="' + esc(ph.k || "") + '">' + esc(occhio) + '</div>' +
    '<div class="grande" id="immBig">' + mmss(immResta()) + '</div>' +
    '<div class="pan">' +
      '<div><div class="k">km</div><div class="v" id="immKm">' + (km == null ? "—" : km.toFixed(2).replace(".", ",")) + '</div></div>' +
      '<div><div class="k">passo</div><div class="v" data-s="' + pa.st + '" id="immPa">' + esc(pa.v) + '</div>' +
        (pa.g ? '<div class="g">' + esc(pa.g) + '</div>' : '') + '</div>' +
    '</div>';
}

function immFoglioHTML(){
  var ph = immFase(), km = immKm(), pa = immPasso(), r = rifPasso();
  var seq = run.started ? run.seq : buildSeq(weekClamped());
  var blocchi = seq.filter(function(x){ return x.k === "run"; }).length;
  var restaMin = Math.round(seq.slice(run.started ? run.i : 0).reduce(function(a,x){ return a+x.s; }, 0) / 60);
  var conMappa = gps.on && gps.pts.length > 1;
  var tile = function(k, v, s){ return '<div class="imm-t"><div class="k">' + k + '</div><div class="v">' + v + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>'; };

  var h = '<div class="imm-maniglia"><i></i></div>';
  h += '<div class="imm-griglia2" style="' + (conMappa ? '' : 'grid-template-columns:1fr 1fr') + '">';
  if(conMappa) h += '<div></div>';   /* la colonna della mappa: la riempie il transform */
  h += '<div class="imm-col">' +
      tile(esc((ph.n || "Pronto")) + " · resta", mmss(immResta())) +
      tile("Blocchi", (run.started ? (ph.b || "—") : 0) + "/" + blocchi, "restano " + restaMin + " min") +
      (conMappa ? tile("Distanza", km.toFixed(2).replace(".", ",") + " km") : "") +
    '</div></div>';

  h += '<div class="imm-t imm-passo"><div class="k">Passo del blocco</div>' +
    '<div class="v" data-s="' + pa.st + '">' + esc(pa.v) + '</div>' +
    (pa.g ? '<div class="g">' + esc(pa.g) + '</div>' : '');
  if(r != null && pa.v !== "—"){
    var lo = r - BANDA, hi = r + BANDA, min = lo - 60, span = (hi + 60) - min;
    /* Il cursore sta dove sta il tuo passo. Piu a sinistra = piu veloce. */
    var cur = pa.sec != null ? Math.max(0, Math.min(99, (pa.sec - min) / span * 100)) : null;
    h += '<div class="imm-banda"><i style="left:' + ((lo-min)/span*100).toFixed(1) + '%;width:' + ((hi-lo)/span*100).toFixed(1) + '%"></i>' +
      (cur == null ? '' : '<b style="left:' + cur.toFixed(1) + '%"></b>') + '</div>' +
      '<div class="s">Riferimento ' + mmSec(r) + ' al km, dalle tue corse a sensazione 3 o meno. La fascia è ±' + BANDA + '″ — è un giudizio, non una misura.</div>';
  } else {
    h += '<div class="s">Nessun riferimento ancora: servono tre corse a sensazione 3 o meno col percorso acceso.</div>';
  }
  h += '</div>';

  if(conMappa){
    h += '<div class="imm-griglia2" style="grid-template-columns:1fr 1fr;margin-top:12px">' +
      tile("+" + kcalDa(gps.km) + " kcal", "", "nel piatto di oggi") +
      tile("Passi", passiDa(gps.km).toLocaleString("it-IT"), "stimati, non contati") +
      '</div>' +
      '<p class="imm-msg">' + (gps.prec != null ? "Precisione " + gps.prec + " m" : "") +
      (S.tessere !== false && !imm.fondo ? " · © OpenStreetMap" : "") + '</p>';
  }
  if(imm.fondo) h += '<p class="imm-msg">Strade non caricate — resta la traccia.</p>';
  if(!gps.on) h += '<div class="row"><button class="btn wide" data-act="gpsVia">Segui il percorso</button></div>';
  if(gps.errore) h += '<p class="imm-msg">' + esc(gps.errore) + '</p>';

  h += '<hr style="border:0;border-top:1px solid var(--line);margin:16px 0">' +
    '<label class="swi"><input type="checkbox" data-act="tessere"' + (S.tessere !== false ? " checked" : "") + '>' +
    '<span>Strade sotto la traccia</span></label>' +
    '<p class="imm-msg">' + (S.tessere !== false
      ? "Le tessere arrivano da OpenStreetMap: per disegnare quella giusta il servizio deve sapere dove sei. È l'unica cosa che esce dal telefono."
      : "Solo la traccia. Niente esce dal telefono.") + '</p>' +
    '<details class="perche"><summary><span>E i passi?</span></summary>' +
    '<p class="fine">Non sono contati: sono la distanza divisa per una falcata di 75 cm stimata sulla tua altezza. È una divisione, non una misura. Quelli veri li conta il telefono in Salute.</p></details>' +
    '<div class="row"><button class="btn ghost wide" data-act="immEsci">Chiudi la modalità</button></div>' +
    '<p class="imm-msg">Chiudere non ferma il cronometro.</p>';
  return h;
}

function immFootHTML(){
  var ph = immFase();
  return '<div class="tempo"><b id="immFt">' + mmss(immResta()) + '</b><span>' + esc(ph.n || "Pronto") + '</span></div>' +
    (!run.started
      ? '<button class="tondo" data-act="runPlay">Avvia</button>'
      : run.playing
        ? '<button class="tondo" data-act="runPause">Pausa</button>'
        : '<button class="tondo" data-act="runPlay">Vai</button>') +
    (imm.scena === "b" ? '<button data-act="runSkip">Salta fase</button>' : "");
}

/* Scrive in posto, e solo se la stringa e cambiata. Mai innerHTML del
   pannello: azzererebbe lo scorrimento e ricreerebbe tutte le tessere. */
function tickImm(){
  if(!imm.on) return;
  var t = mmss(immResta());
  var a = document.getElementById("immBig"); if(a && a.textContent !== t) a.textContent = t;
  var b = document.getElementById("immFt");  if(b && b.textContent !== t) b.textContent = t;
  var km = immKm(), ks = km == null ? "—" : km.toFixed(2).replace(".", ",");
  var c = document.getElementById("immKm"); if(c && c.textContent !== ks) c.textContent = ks;
  var pa = immPasso();
  var d = document.getElementById("immPa");
  if(d && d.textContent !== pa.v){ d.textContent = pa.v; d.setAttribute("data-s", pa.st); }
  if(run.playing && run.started && (run.end - Date.now()) <= 0) runNext();
}

function immVai(scena){
  if(!imm.on) return;
  imm.scena = scena;
  var sc = document.getElementById("immScroll");
  var el = document.getElementById("imm");
  if(el) el.setAttribute("data-scena", scena);
  var y = scena === "b" ? innerHeight : 0;
  if(sc){
    if(pocoMoto){ sc.scrollTop = y; immP(scena === "b" ? 1 : 0); }
    else sc.scrollTo({ top:y, behavior:"smooth" });
  }
  document.getElementById("immFoot").innerHTML = immFootHTML();
}
function immP(p){
  imm.p = p;
  immPiazza(p);
  var d = document.getElementById("immD");
  if(d) d.setAttribute("stroke-width", p > 0.5 ? "3" : "6");
  /* Niente da accendere: nell immersiva non c e piu una figura animata, solo
     un punto fermo. La mappa scorre sotto di lui. */
}

function immEntra(){
  /* TRAPPOLA NUMERO UNO. disegna() scrive su #fgT, #fgG, #fgB: sono ID,
     quindi si anima sempre e solo la PRIMA figura del documento. Entrando da
     vCorsa, #view non viene svuotato — e' solo coperto — e dentro c'e' gia un
     figuraSVG completo. Senza questa riga l'omino dell'immersiva resta uno
     stecco immobile e il difetto sembra della modalita nuova. */
  var vecchia = document.querySelector("#view .figcorsa");
  if(vecchia) vecchia.innerHTML = "";
  /* Svuotare il contenitore NON ferma il motore: il ciclo continuerebbe a
     girare contro un nodo che non c e piu, per tutta la seduta. Nell
     immersiva non c e nessuna figura da animare, quindi si spegne. E proprio
     la batteria che togliere l omino doveva far risparmiare. */
  animaOff();

  imm.on = true; imm.manuale = false; imm.tessOk = 0; imm.tessKo = 0; imm.fondo = false;
  immG = immGeo(); immNodi = {}; immBase = null;
  /* Svuotare la mappa delle chiavi NON basta: i nodi restano nel documento e
     ogni ingresso ne lascia dentro un altro set. Trovato in collaudo — 48 img
     con 24 chiavi — ed e proprio il consumo che questo gestore doveva
     evitare. */
  var boxT = document.getElementById("immTess");
  if(boxT) boxT.innerHTML = "";
  var el = document.getElementById("imm");
  el.hidden = false;
  document.body.classList.add("in-imm");

  var sv = document.getElementById("immSvg");
  sv.setAttribute("viewBox", "0 0 " + immG.W + " " + immG.H);
  document.getElementById("immS1").style.height = immG.H + "px";
  document.getElementById("immFoglio").style.height = immG.H + "px";
  document.getElementById("immHud").innerHTML = immHudHTML();
  document.getElementById("immFoglio").innerHTML = immFoglioHTML();
  document.getElementById("immFoot").innerHTML = immFootHTML();

  if(gps.pts.length > 1){ immRicalcola(); immTraccia(); }
  /* Non avviata: si apre sui quadranti. La modalita immersiva non ha senso
     prima di partire. */
  var scena = (run.started && immFase().k === "run") ? "a" : "b";
  imm.p = scena === "b" ? 1 : 0;
  immPiazza(imm.p);
  document.getElementById("immScroll").scrollTop = scena === "b" ? immG.H : 0;
  imm.scena = scena;
  el.setAttribute("data-scena", scena);
  syncWake();
}

function immEsci(){
  imm.on = false;
  animaOff();
  document.getElementById("imm").hidden = true;
  document.body.classList.remove("in-imm");
  var boxU = document.getElementById("immTess");
  if(boxU) boxU.innerHTML = "";
  immNodi = {}; immBase = null;
  syncWake();
  render();   /* ricostruisce #view, figura della corsa compresa */
}

/* Lo scorrimento: nativo, letto in rAF, una scrittura per fotogramma. */
var immRafOn = 0;
function immScrolla(){
  if(!imm.on) return;
  if(immRafOn) return;
  immRafOn = requestAnimationFrame(function(){
    immRafOn = 0;
    var sc = document.getElementById("immScroll");
    if(!sc) return;
    var p = Math.max(0, Math.min(1, sc.scrollTop / Math.max(1, immG.H)));
    if(Math.abs(p - imm.p) < 0.004) return;
    imm.manuale = true;
    immP(p);
    /* Isteresi asimmetrica: scroll-snap-stop non e' ovunque. */
    var nuova = p >= 0.65 ? "b" : p <= 0.35 ? "a" : imm.scena;
    if(nuova !== imm.scena){
      imm.scena = nuova;
      document.getElementById("imm").setAttribute("data-scena", nuova);
      document.getElementById("immFoot").innerHTML = immFootHTML();
      if(nuova === "b") document.getElementById("immFoglio").innerHTML = immFoglioHTML();
    }
  });
}

function runStart(){
  if(!run.started){ run.seq = buildSeq(weekClamped()); run.i = 0; run.started = true; }
  run.end = Date.now() + run.seq[run.i].s * 1000;
  run.playing = true; syncWake(); beep(1);
}
function runPause(){
  if(!run.playing) return;
  run.seq[run.i].s = Math.max(1, Math.round((run.end - Date.now()) / 1000));
  run.playing = false; syncWake();
}
function runNext(){
  run.i++;
  if(run.i >= run.seq.length){ runFinish(); return; }
  run.end = Date.now() + run.seq[run.i].s * 1000;
  /* NON e il dito a cambiare stato: e il cambio di fase. Correndo non si
     scorre — lo schermo lo guardi un secondo, di sbieco, col braccio che si
     muove. Corsa -> mappa piena, tutto il resto -> quadranti. Lo scorrimento
     resta come scavalcamento, e si azzera qui. */
  if(imm.on){
    imm.manuale = false;
    var kk = run.seq[run.i];
    /* Cammini brevissimi restano a schermo pieno: cambiare due volte in
       quaranta secondi e peggio che non cambiare. */
    var restaA = kk.k === "run" || (kk.k === "walk" && kk.s < 60);
    immVai(restaA ? "a" : "b");
    document.getElementById("immHud").innerHTML = immHudHTML();
    if(imm.scena === "b") document.getElementById("immFoglio").innerHTML = immFoglioHTML();
  }
  var k = run.seq[run.i].k;
  beep(k === "run" ? 2 : 1);
  buzz(k === "run" ? [200,90,200] : [220]);
}
function runFinish(){
  run.playing = false; run.started = false; syncWake();
  beep(3); buzz([300,120,300,120,300]);
  var rpe = prompt("Sessione finita. Sensazione da 1 a 5?\n1 = facile, potevo continuare · 3 = giusta · 5 = ho finito a fatica");
  var n = parseInt(rpe, 10);
  var voce = { d:oggiISO(), week:weekClamped(), kind:"corsa", rpe:(n >= 1 && n <= 5) ? n : null };
  /* Se il GPS stava girando, la corsa si porta dietro distanza, traccia e
     costo energetico. Senza GPS la voce resta com'era: la traccia e' un di
     piu', non un requisito per registrare di aver corso. */
  if(gps.km > 0.05){
    voce.km = Math.round(gps.km * 100) / 100;
    voce.kcal = kcalDa(gps.km);
    voce.tr = potaTraccia(gps.pts);
    voce.ms = gps.tUlt - gps.t0;
    voce.passo = passoAlKm(gps.km, voce.ms);
    /* pc = passo mediano dei soli blocchi di CORSA, in secondi al km. E il
       numero che alimenta rifPasso() nelle sedute successive. */
    var pcv = [];
    (run.seq || []).forEach(function(f, k){
      if(f.k !== "run") return;
      var pb = passoBlocco(k);
      if(pb) pcv.push(pb.sec);
    });
    if(pcv.length){
      pcv.sort(function(a,b){ return a-b; });
      voce.pc = Math.round(pcv[Math.floor(pcv.length/2)]);
    }
  }
  gpsFerma();
  if(imm.on) immEsci();
  S.runs.push(voce);
  save(); render();
}
function tickRun(){
  if(imm.on){ tickImm(); return; }
  if(!run.started) return;
  var box = document.getElementById("runner");
  if(!box) return;
  var ph = run.seq[run.i];
  var left = run.playing ? (run.end - Date.now()) / 1000 : ph.s;
  if(run.playing && left <= 0){ runNext(); return; }
  box.setAttribute("data-kind", ph.k);
  /* La figura cambia col cambio di fase: corre nei blocchi, cammina nei recuperi. */
  var vuole = ph.k === "run" ? "corre" : "cammina";
  if(anim.id !== vuole){
    var w = box.querySelector(".figcorsa");
    if(w){ w.innerHTML = figuraSVG(vuole); animaOn(vuole); }
  }
  box.querySelector(".phase").textContent = ph.n;
  box.querySelector(".big").textContent = mmss(left);
  box.querySelector(".of").textContent = ph.b ? ("blocco " + ph.b + " di " + ph.tot) : (run.playing ? "in corso" : "in pausa");
  var tr = box.querySelector(".track");
  if(tr) Array.prototype.forEach.call(tr.children, function(el, idx){
    el.setAttribute("data-p", idx <= run.i ? "1" : "0");
  });
}

setInterval(function(){ tickRest(); tickRun(); }, 250);

function lineChart(pts, opts){
  opts = opts || {};
  if(pts.length === 0) return "";
  var W = 320, H = 96, pl = 30, pr = 8, pt = 10, pb = 18;
  var ys = pts.map(function(p){ return p.y; });
  var extra = (opts.guide || []).reduce(function(a,g){ return a.concat(g.map(function(p){ return p.y; })); }, []);
  var all = ys.concat(extra, opts.goal != null ? [opts.goal] : []);
  var min = Math.min.apply(null, all), max = Math.max.apply(null, all);
  if(max - min < 0.6){ max += 0.4; min -= 0.4; }
  var pad = (max - min) * 0.12; min -= pad; max += pad;
  var n = Math.max(1, pts.length - 1);
  var X = function(i){ return pl + (i / n) * (W - pl - pr); };
  var Y = function(v){ return pt + (1 - (v - min) / (max - min)) * (H - pt - pb); };
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.alt || "grafico") + '">';
  [0, 0.5, 1].forEach(function(f){
    var y = pt + f * (H - pt - pb);
    s += '<line x1="' + pl + '" y1="' + y + '" x2="' + (W - pr) + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>';
  });
  s += '<text x="2" y="' + (pt + 4) + '" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">' + max.toFixed(0) + '</text>';
  s += '<text x="2" y="' + (H - pb + 4) + '" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">' + min.toFixed(0) + '</text>';
  if(opts.goal != null){
    s += '<line x1="' + pl + '" y1="' + Y(opts.goal) + '" x2="' + (W - pr) + '" y2="' + Y(opts.goal) + '" stroke="' + (opts.goalColor || "var(--ok)") + '" stroke-width="1.2" stroke-dasharray="3 3"/>';
  }
  (opts.guide || []).forEach(function(g){
    var d = g.map(function(p, i){ return (i ? "L" : "M") + X(p.x) + " " + Y(p.y); }).join(" ");
    s += '<path d="' + d + '" fill="none" stroke="var(--ink-3)" stroke-width="1.2" stroke-dasharray="4 3" opacity=".7"/>';
  });
  var col = opts.color || "var(--accent)";
  var d = pts.map(function(p, i){ return (i ? "L" : "M") + X(i) + " " + Y(p.y); }).join(" ");
  if(pts.length > 1){
    s += '<path d="' + d + ' L' + X(pts.length-1) + ' ' + (H - pb) + ' L' + X(0) + ' ' + (H - pb) + ' Z" fill="' + col + '" opacity=".10" style="animation:appari .8s .5s ease both"/>';
    /* pathLength="1" normalizza la lunghezza: cosi il tratteggio vale 1 e la
       linea si disegna da sinistra a destra senza doverla misurare. */
    s += '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"' +
      ' pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="animation:traccia .9s cubic-bezier(.3,.7,.3,1) forwards"/>';
  }
  pts.forEach(function(p, i){
    var last = i === pts.length - 1;
    var ritardo = (0.15 + 0.75 * (i / Math.max(1, pts.length - 1))).toFixed(2);
    s += '<circle cx="' + X(i) + '" cy="' + Y(p.y) + '" r="' + (last ? 4 : 2.4) + '" fill="' + (last ? col : "var(--bg)") + '" stroke="' + col + '" stroke-width="1.6"' +
      ' style="animation:appari .3s ' + ritardo + 's ease both"/>';
  });
  var lp = pts[pts.length-1];
  s += '<text x="' + Math.min(W - pr, X(pts.length-1)) + '" y="' + Math.max(10, Y(lp.y) - 8) + '" font-size="10" text-anchor="end" fill="' + col + '" font-family="var(--mono)" font-weight="600">' + esc(lp.lab || lp.y) + '</text>';
  s += '</svg>';
  return s;
}
